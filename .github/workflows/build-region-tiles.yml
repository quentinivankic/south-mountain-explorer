name: Build Region Tiles

# Dispatch-only: builds one OR MORE regions' trail/area .pmtiles through
# the data-pipeline (data-pipeline/, spec §10) and optionally publishes to
# the Cloudflare R2 dev bucket. Pass several region ids (comma/space
# separated) and they build in parallel via a matrix (max 3 at a time).
# Mirrors the manual-only cadence of build-trail-index.yml — never
# auto-triggers, so it can't burn CI on intermediate merges.
#
# Pipeline (spec §1): gate -> download -> stage -> build -> tile ->
# (publish). The FAIL-CLOSED licensing gate runs first and hard-stops the
# job if any of the region's sources isn't legally shippable.
#
# OSM-ONLY: every signal is derived from OpenStreetMap (Geofabrik extract)
# — trails, areas, the hiking-route "official" signal, and the inside-a-
# protected-area whitelist (from OSM area polygons). No per-country
# authoritative source (DOC/LINZ/etc.), so a new region is just a config
# row. Everything is ODbL, so the gate passes.
#
# Required repo secrets to PUBLISH (Settings → Secrets and variables →
# Actions) — same trio the sync-geom-to-r2 workflow already uses:
#   - R2_ACCOUNT_ID
#   - R2_ACCESS_KEY_ID
#   - R2_SECRET_ACCESS_KEY
# Build-only runs (publish=false) need no secrets.

on:
  workflow_dispatch:
    inputs:
      regions:
        description: 'Region id(s) from config/regions.json — one, or several comma/space-separated (e.g. "austria, norway iceland"). Each builds in parallel.'
        required: true
        default: 'new-zealand'
      publish:
        description: 'Upload the .pmtiles + attributions to the R2 dev bucket'
        type: boolean
        default: false
      sequential:
        description: 'Build one region at a time (gentle on Geofabrik) instead of 3 in parallel — use for big batches like 10 countries.'
        type: boolean
        default: false

jobs:
  # Parse the free-form regions input into a JSON array for the build matrix.
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.parse.outputs.matrix }}
    steps:
      - id: parse
        env:
          RAW: ${{ inputs.regions }}
        run: |
          MATRIX=$(python3 -c "import json,os,re; ids=[x for x in re.split(r'[,\s]+', os.environ['RAW'].strip()) if x]; assert ids, 'no regions given'; print(json.dumps(ids))")
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "building regions: $MATRIX"

  build:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false            # one region's failure must not cancel the others
      # sequential=true → one region at a time (gentle on Geofabrik for big
      # batches); otherwise up to 3 at once.
      max-parallel: ${{ inputs.sequential && 1 || 3 }}
      matrix:
        region: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    # Per-region lock: reruns of the same region serialize; different regions run free.
    concurrency:
      group: build-region-tiles-${{ matrix.region }}
      cancel-in-progress: false
    defaults:
      run:
        working-directory: data-pipeline
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ---- policy core: gate + unit tests always run (no geo deps) ----
      - name: Licensing gate (fail-closed) + unit tests
        run: |
          set -e
          REGION='${{ matrix.region }}'
          echo "== fail-closed licensing gate for $REGION =="
          make gate REGION="$REGION"
          echo "== policy-core unit tests =="
          python3 -m unittest discover -s tests

      # ---- geo toolchain ----
      - name: Install geo tools (osmium, tippecanoe) + shapely
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y osmium-tool build-essential \
            libsqlite3-dev zlib1g-dev
          python3 -m pip install --quiet 'shapely>=2.0' 'osmium>=4.0'
          # tippecanoe (>=2.x emits .pmtiles natively) — build from source.
          git clone --depth 1 https://github.com/felt/tippecanoe /tmp/tippecanoe
          make -C /tmp/tippecanoe -j"$(nproc)"
          sudo make -C /tmp/tippecanoe install
          osmium --version && tippecanoe --version

      # ---- download raw source (§3.3): OSM Geofabrik extract (the only source) ----
      - name: Download OSM extract
        run: |
          set -e
          REGION='${{ matrix.region }}'
          cd sources/downloaders
          python3 osm_region.py --region "$REGION"

      # ---- stage: osmium export -> normalized trails/areas GeoJSON (§3) ----
      - name: Stage OSM
        run: |
          set -e
          REGION='${{ matrix.region }}'
          mkdir -p staging/osm staging/areas
          # Prefilter to just the tags we stage (§3) BEFORE export.
          # Exporting a whole-country PBF (every road/building/landuse
          # polygon) to GeoJSON is many GB and minutes; this shrinks it to
          # trail ways + the four area schemes. `wr/` keeps ways AND
          # relations (multipolygon areas); referenced members are kept by
          # default so export can assemble geometry.
          echo "== osmium tags-filter (trails + area polygons + hiking routes) =="
          osmium tags-filter raw/osm/${REGION}.osm.pbf \
            w/highway=path,footway,track,bridleway \
            "w/abandoned:highway" \
            wr/boundary=protected_area,national_park \
            wr/leisure=nature_reserve \
            wr/landuse=forest \
            r/route=hiking,foot,walking,running \
            -o staging/osm/${REGION}_filtered.osm.pbf --overwrite
          echo "== osmium export trail+area geometry =="
          osmium export staging/osm/${REGION}_filtered.osm.pbf \
            -f geojson --geometry-types=linestring,polygon \
            --add-unique-id=type_id \
            -o staging/osm/${REGION}_export.geojson --overwrite
          # Global "official" signal: which ways belong to a hiking route
          # relation (+ its network). Needs the route relations kept above.
          # Non-fatal — a pyosmium hiccup just omits the route signals.
          echo "== route-relation index =="
          ROUTE_ARG=""
          if python3 build/route_index.py \
               --pbf staging/osm/${REGION}_filtered.osm.pbf \
               --out staging/osm/${REGION}_routes.json; then
            ROUTE_ARG="--route-index staging/osm/${REGION}_routes.json"
          else
            echo "::warning::route index failed — continuing without route-relation signals"
          fi
          python3 build/stage_osm.py --in staging/osm/${REGION}_export.geojson \
            --trails-out staging/osm/${REGION}_raw_trails.geojson \
            --areas-out  staging/areas/${REGION}_areas.geojson $ROUTE_ARG
          # Collapse multi-segment named routes (Te Araroa etc.) into one
          # trail so downstream sees whole routes.
          echo "== dedup multi-segment routes =="
          python3 build/dedup_trails.py \
            --in staging/osm/${REGION}_raw_trails.geojson \
            --out staging/osm/${REGION}_trails.geojson

      # ---- build: Bucket B flags + inclusion guard (§4.2, §7.1) ----
      - name: Attach Bucket B flags + inclusion guard
        run: |
          set -e
          REGION='${{ matrix.region }}'
          TRUST=$(python3 -c "import json;print(json.load(open('config/regions.json'))['regions']['$REGION']['region_trust'])")
          python3 build/confidence.py \
            --trails staging/osm/${REGION}_trails.geojson \
            --region-trust "$TRUST" \
            --out staging/${REGION}_trails_flagged.geojson
          python3 qa/assert_inclusion.py --trails staging/${REGION}_trails_flagged.geojson

      # ---- trail↔area join: "areas WITH their trails" (global) ----
      # Point-in-polygon of each trail against the OSM area polygons, so
      # tiles carry area_ids and we emit an areas index (area -> trail
      # count + miles) — the completion-app data model, done from OSM.
      - name: Assign trails to areas
        run: |
          set -e
          REGION='${{ matrix.region }}'
          mkdir -p dist
          python3 build/assign_areas.py \
            --trails staging/${REGION}_trails_flagged.geojson \
            --areas  staging/areas/${REGION}_areas.geojson \
            --trails-out staging/${REGION}_trails_final.geojson \
            --index-out  staging/${REGION}-areas-index-full.json

      # ---- curate: bake the shipped set (high+medium; drop low) (§4/§8) ----
      # curation_mode=baked → pre-filter here so the tiles AND the areas
      # index reflect what actually ships. The score is NOT written to
      # tiles; it only selects which trails ship.
      - name: Curate shipped trail set (high+medium)
        run: |
          set -e
          REGION='${{ matrix.region }}'
          mkdir -p dist
          python3 build/curate.py \
            --trails staging/${REGION}_trails_final.geojson \
            --areas  staging/areas/${REGION}_areas.geojson \
            --trails-out staging/${REGION}_trails_curated.geojson \
            --index-out  dist/${REGION}-areas-index.json \
            --keep high medium
          echo "== top areas by trail count (shipped) =="
          head -40 dist/${REGION}-areas-index.json

      # ---- sample real trails for the on-device Confidence Lab (dev aid) ----
      # Prints a small, distribution-representative sample to the LOG so it
      # can be read without downloading the 127 MB tiles, and saves it into
      # the artifact. No effect on the shipped tiles.
      - name: Sample trails for the Confidence Lab (printed to log)
        run: |
          set -e
          REGION='${{ matrix.region }}'
          mkdir -p dist
          echo "===== TRAIL SAMPLE ($REGION) BEGIN ====="
          python3 build/sample_trails.py \
            --trails staging/${REGION}_trails_final.geojson \
            --n 40 --out dist/${REGION}-trail-sample.json
          echo "===== TRAIL SAMPLE END ====="

      # ---- attributions (§2) ----
      - name: Generate attributions.json
        run: |
          set -e
          REGION='${{ matrix.region }}'
          SRC=$(python3 -c "import json;print(' '.join(json.load(open('config/regions.json'))['regions']['$REGION']['sources']))")
          CC=$(python3 -c "import json;print(' '.join(json.load(open('config/regions.json'))['regions']['$REGION']['countries']))")
          mkdir -p dist
          python3 build/attributions.py --region "$REGION" \
            --sources $SRC --countries $CC \
            --out dist/attributions.${REGION}.json
          cat dist/attributions.${REGION}.json

      # ---- tile to .pmtiles (§7) ----
      - name: Tile to .pmtiles
        run: |
          set -e
          REGION='${{ matrix.region }}'
          mkdir -p dist/regions
          bash build/tiles/build_tiles.sh "$REGION" \
            staging/${REGION}_trails_curated.geojson \
            staging/areas/${REGION}_areas.geojson \
            dist/regions/${REGION}.pmtiles

      - name: Upload .pmtiles as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.region }}-pmtiles
          path: |
            data-pipeline/dist/regions/${{ matrix.region }}.pmtiles
            data-pipeline/dist/attributions.${{ matrix.region }}.json
            data-pipeline/dist/${{ matrix.region }}-trail-sample.json
            data-pipeline/dist/${{ matrix.region }}-areas-index.json
          if-no-files-found: error

      # ---- publish to R2 dev bucket (§7.4) ----
      - name: Publish to R2 dev bucket
        if: ${{ inputs.publish }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        run: |
          set -e
          REGION='${{ matrix.region }}'
          if [ -z "$R2_ACCOUNT_ID" ] || [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$AWS_SECRET_ACCESS_KEY" ]; then
            echo "publish=true but R2_* secrets are unset."; exit 1
          fi
          ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          # Dev bucket + regions/ prefix, matching the Worker's key scheme.
          aws s3 cp dist/regions/${REGION}.pmtiles \
            s3://trekdex-areas-dev/regions/${REGION}.pmtiles \
            --endpoint-url "$ENDPOINT" \
            --content-type "application/octet-stream" \
            --cache-control "public, max-age=86400" --no-progress
          aws s3 cp dist/attributions.${REGION}.json \
            s3://trekdex-areas-dev/attributions.${REGION}.json \
            --endpoint-url "$ENDPOINT" \
            --content-type "application/json" \
            --cache-control "public, max-age=300" --no-progress
          echo "published ${REGION} to trekdex-areas-dev."
