name: Build Trail Index

on:
  workflow_dispatch:
    inputs:
      seed_states:
        description: "Seed index from OSM for these state codes (space-separated, e.g. AZ CA). Leave blank to skip seeding and just rehydrate the existing index."
        default: ""
      seed_merge:
        description: "Merge seeded results with existing index instead of replacing"
        type: boolean
        default: true
      min_trails:
        description: "Drop areas with fewer than N qualifying trails (0 = keep all)"
        default: "3"
      min_miles:
        description: "Drop areas with less than N total trail miles (0 = keep all)"
        default: "2"
      batch_size:
        description: "Areas per save batch"
        default: "50"
      delay:
        description: "Seconds between Overpass requests, per worker"
        default: "1.0"
      concurrency:
        description: "Parallel worker count (default 6 = ~6 rps to Overpass at default delay, split across two mirrors; 1 = serial)"
        default: "6"
      limit:
        description: "Max areas to process (blank = all)"
        default: ""
      force:
        description: "Re-fetch every area even if it's already cached (use after build-script logic changes, e.g. trail-filter tweaks)"
        type: boolean
        default: false
      state_filter:
        description: "Comma-separated state names to LIMIT trail-counts processing to (e.g. 'Denmark,Alberta'). Blank = process every area in the index. Pairs with seed_states for fast per-state seed runs — avoids the ~50min full-index iteration when only N new areas need processing."
        default: ""
      trigger_testflight:
        description: "Also trigger an iOS TestFlight build after the index commits (costs macOS runner minutes — leave off for data-only rebuilds)"
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write
      actions: write
    outputs:
      committed: ${{ steps.commit.outputs.committed }}

    steps:
      - uses: actions/checkout@v4

      # `counts-cache.json` is the per-area Overpass response cache
      # the builder writes to between batches so subsequent runs can
      # skip already-fetched areas. At full-US scale it grows past
      # 250 MB — well over GitHub's 100 MB single-file push limit —
      # so we deliberately keep it OUT of git and instead persist
      # it via Actions cache across workflow runs.
      #
      # The cache key is intentionally constant (`counts-cache-v1`)
      # so every run uses the same slot; `restore-keys` falls back
      # gracefully when no cache exists yet (first run after this
      # change). `save-always: true` writes whatever's at
      # `public/areas/counts-cache.json` when the workflow finishes,
      # INCLUDING on partial step failures (e.g. a transient warning
      # in the R2 sync dispatch, or a git push race that took the
      # commit step down). Without this, the post-step cache save
      # only fires on a perfectly clean run — and a single hiccup
      # silently drops a 4-hour cache rebuild. Observed in practice:
      # the full-US run completed and committed to main, but the
      # cache restored on the very next dispatch was still ~16MB
      # (pre-silhouette) instead of ~300MB (post-silhouette), so
      # every subsequent dispatch re-processed all ~3000 areas
      # from scratch.
      - name: Restore counts-cache from Actions cache
        id: cache-restore
        uses: actions/cache@v4
        with:
          path: public/areas/counts-cache.json
          key: counts-cache-v1
          save-always: true
          # No restore-keys — we want exact-match-or-cold-start
          # semantics. A stale partial cache from a much older
          # build would only confuse the diff logic.

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Optional: re-seed the index from OSM. Skipped when seed_states is
      # blank so the default workflow (rehydrate existing curated index) is
      # unchanged.
      #
      # Resilience: at full-US scale the loop hits Overpass ~50 times
      # over ~75 minutes. A single 504 mid-loop is common, so we wrap
      # the script in a 3-retry shell loop with exponential backoff
      # (60s / 240s / 540s). `--resume` makes the script skip states
      # that already landed in index.json from a prior attempt, so
      # re-runs are idempotent and only re-fetch what failed.
      # Combined with the script's own per-state 3-retry, every state
      # has up to 9 attempts before the workflow gives up.
      - name: Seed area index from OSM
        if: ${{ github.event.inputs.seed_states != '' }}
        run: |
          ARGS="--resume"
          if [ "${{ github.event.inputs.seed_merge }}" = "true" ]; then
            ARGS="$ARGS --merge"
          fi
          for attempt in 1 2 3; do
            if python3 scripts/seed-areas.py $ARGS ${{ github.event.inputs.seed_states }}; then
              echo "Seed step succeeded on attempt $attempt."
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::Seed step failed after 3 workflow attempts; bailing."
              exit 1
            fi
            SLEEP=$((60 * attempt * attempt))
            echo "::warning::Seed step failed (attempt $attempt). Sleeping ${SLEEP}s before retry."
            sleep "$SLEEP"
          done

      - name: Run trail count builder
        env:
          # Pipe inputs through env vars to dodge shell-injection risk and
          # to preserve whitespace in state names like "British Columbia".
          BATCH_SIZE: ${{ github.event.inputs.batch_size }}
          DELAY: ${{ github.event.inputs.delay }}
          CONCURRENCY: ${{ github.event.inputs.concurrency }}
          LIMIT: ${{ github.event.inputs.limit }}
          MIN_TRAILS: ${{ github.event.inputs.min_trails }}
          MIN_MILES: ${{ github.event.inputs.min_miles }}
          FORCE: ${{ github.event.inputs.force }}
          STATE_FILTER: ${{ github.event.inputs.state_filter }}
        run: |
          ARGS=(
            --batch-size "$BATCH_SIZE"
            --delay "$DELAY"
            --concurrency "$CONCURRENCY"
            --min-trails "$MIN_TRAILS"
            --min-miles "$MIN_MILES"
          )
          if [ -n "$LIMIT" ]; then
            ARGS+=(--limit "$LIMIT")
          fi
          if [ "$FORCE" = "true" ]; then
            ARGS+=(--force)
          fi
          # Comma-separated state names with optional surrounding
          # whitespace. Multiple --state-filter args build up via
          # action='append' on the script side.
          if [ -n "$STATE_FILTER" ]; then
            IFS=',' read -ra FILTERS <<< "$STATE_FILTER"
            for f in "${FILTERS[@]}"; do
              # Trim leading + trailing whitespace.
              f="$(echo "$f" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
              if [ -n "$f" ]; then
                ARGS+=(--state-filter "$f")
              fi
            done
          fi
          python3 scripts/build-trail-counts.py "${ARGS[@]}"

      - name: Commit updated index
        id: commit
        run: |
          cp public/areas/index.json ios/SouthMountainExplorer/Resources/areas-index.json
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Silhouettes are now per-area files under public/areas/silhouettes/,
          # not a single bundled JSON. The iOS app fetches them from R2 at
          # runtime via AreaSilhouetteService, mirroring the geom flow.
          #
          # `counts-cache.json` is intentionally NOT staged — at full-US
          # scale it crosses 250 MB, well past GitHub's 100 MB per-file
          # push limit. It lives in Actions cache instead (see the cache
          # restore step above) and as a workflow artifact below.
          git add public/areas/index.json public/areas/silhouettes public/areas/geom ios/SouthMountainExplorer/Resources/areas-index.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
            echo "committed=false" >> "$GITHUB_OUTPUT"
          else
            SUMMARY=$(python3 -c "
          import json
          idx = json.load(open('public/areas/index.json'))
          n = sum(1 for a in idx if len(a) >= 7)
          print(f'{n}/{len(idx)} areas have trail counts')
          ")
            SEED_NOTE=""
            if [ -n "${{ github.event.inputs.seed_states }}" ]; then
              SEED_NOTE=" (seeded from ${{ github.event.inputs.seed_states }})"
            fi
            git commit -m "chore: rebuild trail index — $SUMMARY$SEED_NOTE"
            git push
            echo "committed=true" >> "$GITHUB_OUTPUT"
          fi

      # Pushes authored by GITHUB_TOKEN don't trigger downstream workflows, so
      # we explicitly dispatch the iOS TestFlight build — but only when the
      # caller asked for it. macOS runner minutes bill at ~10x Linux, so we
      # don't want every data-only rebuild to spend minutes building an .ipa
      # nobody asked for.
      - name: Trigger iOS TestFlight build
        if: steps.commit.outputs.committed == 'true' && github.event.inputs.trigger_testflight == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run ios-testflight.yml --ref ${{ github.ref_name }}

      # Same GITHUB_TOKEN gotcha — `sync-geom-to-r2.yml`'s
      # path-filter on `public/areas/geom/**` would normally fire
      # automatically when the commit step above pushes new geom
      # files, but bot-authored pushes don't trigger downstream
      # workflows. Dispatch explicitly so R2 stays in sync with
      # the committed geom data without any manual click.
      #
      # Unlike the TestFlight build above, this one runs
      # unconditionally on every successful commit — sync is
      # cheap (Linux runner, ~1 min total), and the whole point
      # of moving the CDN to R2 was to make this transparent.
      - name: Sync geom files to R2
        if: steps.commit.outputs.committed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run sync-geom-to-r2.yml --ref ${{ github.ref_name }}

      # Side-channel safety net: upload counts-cache.json as a
      # workflow artifact so it's downloadable from the run page
      # even if the Actions cache step fails (e.g. cache eviction
      # under storage pressure). 90-day retention is the default
      # and fine for our purposes — we'd notice a stale cache
      # well before then. `if: always()` so the artifact lands
      # even when the workflow times out partway through.
      - name: Upload counts-cache.json as artifact
        if: always() && hashFiles('public/areas/counts-cache.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: counts-cache
          path: public/areas/counts-cache.json
          retention-days: 30
          if-no-files-found: ignore
