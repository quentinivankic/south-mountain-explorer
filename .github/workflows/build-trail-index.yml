name: Build Trail Index

on:
  workflow_dispatch:
    inputs:
      pipeline:
        description: "Which builder to run. 'overpass' = legacy (slow, network-bound). 'pbf' = new Geofabrik+osmium path (fast, requires no Overpass)."
        type: choice
        options: ["overpass", "pbf"]
        default: "overpass"
      seed_states:
        description: "[overpass] Seed index from OSM for these state codes (space-separated, e.g. AZ CA). Leave blank to skip seeding."
        default: ""
      seed_merge:
        description: "[overpass] Merge seeded results with existing index instead of replacing"
        type: boolean
        default: true
      regions:
        description: "[pbf] ISO region codes to rebuild (space-separated, e.g. 'DK US-AZ CA-AB'). Blank = every region in STATE_NAMES."
        default: ""
      continents:
        description: "[pbf] Geofabrik continent PBFs to download (comma-separated). Auto-derived from regions when blank; explicit value overrides. Valid: north-america, europe."
        default: ""
      min_trails:
        description: "Drop areas with fewer than N qualifying trails (0 = keep all)"
        default: "3"
      min_miles:
        description: "Drop areas with less than N total trail miles (0 = keep all)"
        default: "2"
      batch_size:
        description: "[overpass] Areas per save batch"
        default: "50"
      delay:
        description: "[overpass] Seconds between Overpass requests, per worker"
        default: "1.5"
      concurrency:
        description: "[overpass] Parallel worker count (3 = ~2 rps to Overpass at default delay; 1 = serial)"
        default: "3"
      limit:
        description: "Max areas to process (blank = all)"
        default: ""
      force:
        description: "[overpass] Re-fetch every area even if it's already cached"
        type: boolean
        default: false
      state_filter:
        description: "[overpass] Comma-separated state names to LIMIT trail-counts processing to (e.g. 'Denmark,Alberta'). Blank = process every area."
        default: ""
      trigger_testflight:
        description: "Also trigger an iOS TestFlight build after the index commits (costs macOS runner minutes — leave off for data-only rebuilds)"
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write
      actions: write
    outputs:
      committed: ${{ steps.commit.outputs.committed }}

    steps:
      - uses: actions/checkout@v4

      # `counts-cache.json` is the per-area Overpass response cache
      # the builder writes to between batches so subsequent runs can
      # skip already-fetched areas. At full-US scale it grows past
      # 250 MB — well over GitHub's 100 MB single-file push limit —
      # so we deliberately keep it OUT of git and instead persist
      # it via Actions cache across workflow runs.
      #
      # The cache key is intentionally constant (`counts-cache-v1`)
      # so every run uses the same slot; `restore-keys` falls back
      # gracefully when no cache exists yet (first run after this
      # change). `save-always: true` writes whatever's at
      # `public/areas/counts-cache.json` when the workflow finishes,
      # INCLUDING on partial step failures (e.g. a transient warning
      # in the R2 sync dispatch, or a git push race that took the
      # commit step down). Without this, the post-step cache save
      # only fires on a perfectly clean run — and a single hiccup
      # silently drops a 4-hour cache rebuild. Observed in practice:
      # the full-US run completed and committed to main, but the
      # cache restored on the very next dispatch was still ~16MB
      # (pre-silhouette) instead of ~300MB (post-silhouette), so
      # every subsequent dispatch re-processed all ~3000 areas
      # from scratch.
      - name: Restore counts-cache from Actions cache
        if: ${{ github.event.inputs.pipeline != 'pbf' }}
        id: cache-restore
        uses: actions/cache@v4
        with:
          path: public/areas/counts-cache.json
          key: counts-cache-v1
          save-always: true
          # No restore-keys — we want exact-match-or-cold-start
          # semantics. A stale partial cache from a much older
          # build would only confuse the diff logic.

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Optional: re-seed the index from OSM. Skipped when seed_states is
      # blank so the default workflow (rehydrate existing curated index) is
      # unchanged.
      #
      # Resilience: at full-US scale the loop hits Overpass ~50 times
      # over ~75 minutes. A single 504 mid-loop is common, so we wrap
      # the script in a 3-retry shell loop with exponential backoff
      # (60s / 240s / 540s). `--resume` makes the script skip states
      # that already landed in index.json from a prior attempt, so
      # re-runs are idempotent and only re-fetch what failed.
      # Combined with the script's own per-state 3-retry, every state
      # has up to 9 attempts before the workflow gives up.
      - name: Seed area index from OSM
        if: ${{ github.event.inputs.pipeline != 'pbf' && github.event.inputs.seed_states != '' }}
        run: |
          ARGS="--resume"
          if [ "${{ github.event.inputs.seed_merge }}" = "true" ]; then
            ARGS="$ARGS --merge"
          fi
          for attempt in 1 2 3; do
            if python3 scripts/seed-areas.py $ARGS ${{ github.event.inputs.seed_states }}; then
              echo "Seed step succeeded on attempt $attempt."
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::Seed step failed after 3 workflow attempts; bailing."
              exit 1
            fi
            SLEEP=$((60 * attempt * attempt))
            echo "::warning::Seed step failed (attempt $attempt). Sleeping ${SLEEP}s before retry."
            sleep "$SLEEP"
          done

      - name: Run trail count builder
        if: ${{ github.event.inputs.pipeline != 'pbf' }}
        env:
          # Pipe inputs through env vars to dodge shell-injection risk and
          # to preserve whitespace in state names like "British Columbia".
          BATCH_SIZE: ${{ github.event.inputs.batch_size }}
          DELAY: ${{ github.event.inputs.delay }}
          CONCURRENCY: ${{ github.event.inputs.concurrency }}
          LIMIT: ${{ github.event.inputs.limit }}
          MIN_TRAILS: ${{ github.event.inputs.min_trails }}
          MIN_MILES: ${{ github.event.inputs.min_miles }}
          FORCE: ${{ github.event.inputs.force }}
          STATE_FILTER: ${{ github.event.inputs.state_filter }}
        run: |
          ARGS=(
            --batch-size "$BATCH_SIZE"
            --delay "$DELAY"
            --concurrency "$CONCURRENCY"
            --min-trails "$MIN_TRAILS"
            --min-miles "$MIN_MILES"
          )
          if [ -n "$LIMIT" ]; then
            ARGS+=(--limit "$LIMIT")
          fi
          if [ "$FORCE" = "true" ]; then
            ARGS+=(--force)
          fi
          # Comma-separated state names with optional surrounding
          # whitespace. Multiple --state-filter args build up via
          # action='append' on the script side.
          if [ -n "$STATE_FILTER" ]; then
            IFS=',' read -ra FILTERS <<< "$STATE_FILTER"
            for f in "${FILTERS[@]}"; do
              # Trim leading + trailing whitespace.
              f="$(echo "$f" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
              if [ -n "$f" ]; then
                ARGS+=(--state-filter "$f")
              fi
            done
          fi
          python3 scripts/build-trail-counts.py "${ARGS[@]}"

      # --- PBF pipeline branch (PR J.2 — opt-in via pipeline=pbf) ---
      #
      # Replaces the Overpass seed + trail-count steps above with a
      # local osmium pass over Geofabrik continent extracts. No
      # network calls during the build; full rebuilds in ~30 min
      # wall-clock vs. the 2-4 h Overpass baseline.
      #
      # The four steps below are equivalent to "everything above
      # under pipeline=overpass" — they produce the same on-disk
      # artifacts (public/areas/index.json + silhouettes/ + geom/),
      # so the commit / R2-sync / TestFlight tail of the workflow
      # is identical for both paths.

      - name: Install osmium-tool
        if: ${{ github.event.inputs.pipeline == 'pbf' }}
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends osmium-tool

      - name: Install Python deps (osmium, shapely)
        if: ${{ github.event.inputs.pipeline == 'pbf' }}
        run: pip install --no-cache-dir 'osmium>=3.7' 'shapely>=2.0'

      # Auto-derive which continent PBFs to download from the
      # requested regions. DK → europe, US-* / CA-* / bare US state
      # codes → north-america. Empty `regions` means "everything"
      # so both continents download. An explicit `continents` input
      # overrides the auto-derivation (useful for testing one
      # continent at a time).
      - name: Resolve continent set
        if: ${{ github.event.inputs.pipeline == 'pbf' }}
        id: continents
        env:
          REGIONS: ${{ github.event.inputs.regions }}
          CONTINENTS_OVERRIDE: ${{ github.event.inputs.continents }}
        run: |
          if [ -n "$CONTINENTS_OVERRIDE" ]; then
            echo "list=$CONTINENTS_OVERRIDE" >> "$GITHUB_OUTPUT"
            echo "Using explicit continents: $CONTINENTS_OVERRIDE"
            exit 0
          fi
          if [ -z "$REGIONS" ]; then
            echo "list=north-america,europe" >> "$GITHUB_OUTPUT"
            echo "Empty regions → downloading both continents."
            exit 0
          fi
          need_na=0
          need_eu=0
          for r in $REGIONS; do
            case "$r" in
              DK) need_eu=1 ;;
              CA-*|US-*) need_na=1 ;;
              *) need_na=1 ;;  # bare 2-letter US state codes
            esac
          done
          out=""
          if [ "$need_na" = "1" ]; then out="north-america"; fi
          if [ "$need_eu" = "1" ]; then out="${out:+$out,}europe"; fi
          echo "list=$out" >> "$GITHUB_OUTPUT"
          echo "Resolved continents for regions [$REGIONS]: $out"

      # Serial-by-continent: download a continent PBF, prefilter it
      # to a few GB of relevant tags, delete the raw to free /mnt
      # disk, then move to the next continent. This caps peak disk
      # usage at ~30 GB (NA raw 17.7 + filtered ~1) instead of
      # ~48 GB if both raw PBFs lived on disk simultaneously.
      #
      # Filtered output preserves the topology osmium needs for the
      # Area handler (-R would strip member ways/nodes). Default
      # behavior keeps referential completeness.
      - name: Download + prefilter Geofabrik PBFs
        if: ${{ github.event.inputs.pipeline == 'pbf' }}
        env:
          CONTINENTS: ${{ steps.continents.outputs.list }}
        run: |
          set -euo pipefail
          IFS=',' read -ra ARR <<< "$CONTINENTS"
          for region in "${ARR[@]}"; do
            region="$(echo "$region" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
            [ -z "$region" ] && continue
            RAW="$RUNNER_TEMP/${region}-latest.osm.pbf"
            FILTERED="$RUNNER_TEMP/${region}-filtered.osm.pbf"
            URL="https://download.geofabrik.de/${region}-latest.osm.pbf"
            echo "::group::Download $region"
            curl --retry 5 --retry-delay 30 --fail --silent --show-error \
              --location -o "$RAW" "$URL"
            ls -lh "$RAW"
            df -h "$RUNNER_TEMP"
            echo "::endgroup::"
            echo "::group::Prefilter $region (osmium tags-filter)"
            osmium tags-filter "$RAW" \
              r/boundary=protected_area,national_park \
              r/leisure=nature_reserve \
              r/admin_level=2,4 \
              w/highway=path,footway,track,bridleway \
              -o "$FILTERED" \
              --overwrite
            rm "$RAW"
            ls -lh "$FILTERED"
            df -h "$RUNNER_TEMP"
            echo "::endgroup::"
          done

      - name: Build trail index from PBFs
        if: ${{ github.event.inputs.pipeline == 'pbf' }}
        env:
          CONTINENTS: ${{ steps.continents.outputs.list }}
          REGIONS: ${{ github.event.inputs.regions }}
          MIN_TRAILS: ${{ github.event.inputs.min_trails }}
          MIN_MILES: ${{ github.event.inputs.min_miles }}
          LIMIT: ${{ github.event.inputs.limit }}
        run: |
          set -euo pipefail
          PBFS=()
          IFS=',' read -ra ARR <<< "$CONTINENTS"
          for region in "${ARR[@]}"; do
            region="$(echo "$region" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
            [ -z "$region" ] && continue
            PBFS+=("$RUNNER_TEMP/${region}-filtered.osm.pbf")
          done
          ARGS=(--pbf "${PBFS[@]}" --min-trails "$MIN_TRAILS" --min-miles "$MIN_MILES")
          if [ -n "$REGIONS" ]; then
            # shellcheck disable=SC2086  # word-splitting intended
            ARGS+=(--regions $REGIONS)
          fi
          if [ -n "$LIMIT" ]; then
            ARGS+=(--limit "$LIMIT")
          fi
          python3 scripts/build-index-from-pbf.py "${ARGS[@]}"

      - name: Commit updated index
        id: commit
        run: |
          cp public/areas/index.json ios/SouthMountainExplorer/Resources/areas-index.json
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Silhouettes are now per-area files under public/areas/silhouettes/,
          # not a single bundled JSON. The iOS app fetches them from R2 at
          # runtime via AreaSilhouetteService, mirroring the geom flow.
          #
          # `counts-cache.json` is intentionally NOT staged — at full-US
          # scale it crosses 250 MB, well past GitHub's 100 MB per-file
          # push limit. It lives in Actions cache instead (see the cache
          # restore step above) and as a workflow artifact below.
          # osm-id-map.json is produced only by the PBF pipeline; -- it's
          # ~1 MB and committed for slug-stability tracking. The legacy
          # Overpass path never writes it, so the add is a no-op there.
          git add public/areas/index.json public/areas/silhouettes public/areas/geom ios/SouthMountainExplorer/Resources/areas-index.json
          if [ -f public/areas/osm-id-map.json ]; then
            git add public/areas/osm-id-map.json
          fi
          if git diff --cached --quiet; then
            echo "No changes to commit."
            echo "committed=false" >> "$GITHUB_OUTPUT"
          else
            SUMMARY=$(python3 -c "
          import json
          idx = json.load(open('public/areas/index.json'))
          n = sum(1 for a in idx if len(a) >= 7)
          print(f'{n}/{len(idx)} areas have trail counts')
          ")
            SEED_NOTE=""
            if [ -n "${{ github.event.inputs.seed_states }}" ]; then
              SEED_NOTE=" (seeded from ${{ github.event.inputs.seed_states }})"
            fi
            git commit -m "chore: rebuild trail index — $SUMMARY$SEED_NOTE"
            git push
            echo "committed=true" >> "$GITHUB_OUTPUT"
          fi

      # Pushes authored by GITHUB_TOKEN don't trigger downstream workflows, so
      # we explicitly dispatch the iOS TestFlight build — but only when the
      # caller asked for it. macOS runner minutes bill at ~10x Linux, so we
      # don't want every data-only rebuild to spend minutes building an .ipa
      # nobody asked for.
      - name: Trigger iOS TestFlight build
        if: steps.commit.outputs.committed == 'true' && github.event.inputs.trigger_testflight == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run ios-testflight.yml --ref ${{ github.ref_name }}

      # Same GITHUB_TOKEN gotcha — `sync-geom-to-r2.yml`'s
      # path-filter on `public/areas/geom/**` would normally fire
      # automatically when the commit step above pushes new geom
      # files, but bot-authored pushes don't trigger downstream
      # workflows. Dispatch explicitly so R2 stays in sync with
      # the committed geom data without any manual click.
      #
      # Unlike the TestFlight build above, this one runs
      # unconditionally on every successful commit — sync is
      # cheap (Linux runner, ~1 min total), and the whole point
      # of moving the CDN to R2 was to make this transparent.
      - name: Sync geom files to R2
        if: steps.commit.outputs.committed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run sync-geom-to-r2.yml --ref ${{ github.ref_name }}

      # Side-channel safety net: upload counts-cache.json as a
      # workflow artifact so it's downloadable from the run page
      # even if the Actions cache step fails (e.g. cache eviction
      # under storage pressure). 90-day retention is the default
      # and fine for our purposes — we'd notice a stale cache
      # well before then. `if: always()` so the artifact lands
      # even when the workflow times out partway through.
      - name: Upload counts-cache.json as artifact
        if: ${{ github.event.inputs.pipeline != 'pbf' && always() && hashFiles('public/areas/counts-cache.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: counts-cache
          path: public/areas/counts-cache.json
          retention-days: 30
          if-no-files-found: ignore
