name: Build Trail Index

# Two inputs, two paths through the workflow:
#
#   1. `seed_regions` blank, `force_rehydrate` false (the common case):
#      hydrate every area in the index that's still a 5-tuple seed-only
#      row. Cached areas skip in <1 ms each, so the wall-clock cost
#      scales with how many areas are NOT yet hydrated — fast steady-
#      state, slow only after a fresh region was seeded.
#
#   2. `seed_regions` non-blank: first seed each region (Overpass
#      lookup, ~1-2 min per region with retries), then ALWAYS run the
#      full hydration step — so a region can never land in the index
#      as 5-tuples-only. The post-build hydration guard verifies this.
#
# Tuning knobs (concurrency, delay, batch size, min trail thresholds)
# are baked in here rather than exposed — six months of dispatches
# have settled on these values and turning them into UI inputs
# created more footguns than flexibility.

on:
  workflow_dispatch:
    inputs:
      seed_regions:
        description: "Space-separated ISO region codes to seed (e.g. 'AZ', 'CA-AB', 'DK'). Blank = no new seeds, just hydrate everything that's missing trail counts."
        default: ""
      force_rehydrate:
        description: "Re-fetch every cached area, even ones that already have trail counts. Use after build-script logic changes that affect counts (filter tweaks, etc.)."
        type: boolean
        default: false
      trigger_testflight:
        description: "Trigger an iOS TestFlight build after the index commits. Defaults true — the bundled areas-index.json is the only path that delivers new data to users, so a new TestFlight build is the natural follow-up to every successful run."
        type: boolean
        default: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write
      actions: write
    outputs:
      committed: ${{ steps.commit.outputs.committed }}

    steps:
      - uses: actions/checkout@v4

      # `counts-cache.json` is the per-area Overpass response cache the
      # builder writes to between batches so subsequent runs can skip
      # already-fetched areas. At full-US+CA scale it grows past 250 MB
      # — well over GitHub's 100 MB single-file push limit — so we keep
      # it OUT of git and persist via Actions cache across runs.
      #
      # CRITICAL: must use the restore/save SPLIT (not the combined
      # `actions/cache@v4` action with `save-always`). The combined
      # action refuses to overwrite an existing key, so a constant
      # key like `counts-cache-v1` silently locks the cache to the
      # state of the FIRST run that wrote it — every subsequent run
      # restores that same 16 MB snapshot, paying full Overpass cost,
      # and throws away its newly-populated cache at the end. The
      # `save-always: true` flag is deprecated and ignored.
      #
      # Pattern instead:
      #   - restore with a unique-per-run key (forces a fresh slot
      #     on save) but use restore-keys partial match to find the
      #     most recent prior save
      #   - save explicitly at the end of the workflow with the
      #     same unique key
      #
      # Key version bumped v1 → v2 so we don't try to restore the
      # broken legacy cache (which is only ever 16 MB and would
      # waste an Overpass roundtrip on each "uncached" area).
      - name: Restore counts-cache from Actions cache
        id: cache-restore
        uses: actions/cache/restore@v4
        with:
          path: public/areas/counts-cache.json
          key: counts-cache-v2-${{ github.run_id }}
          restore-keys: |
            counts-cache-v2-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Cache-freshness check. The build step skips areas whose cache
      # entry includes an `osm_id` (so it can use Overpass area-relation
      # queries directly). Areas without a cached `osm_id` fall through
      # to Nominatim (1 req/sec hard limit, serializes the whole build)
      # and then to bbox-radius fallback. So a cache that's missing
      # osm_ids for most areas turns the build step into hours of
      # Nominatim-bound work.
      #
      # If coverage is low (<80% of index rows have a cached osm_id),
      # we run a `seed-areas.py --all --merge` pre-pass first to
      # refresh osm_ids via per-region Overpass queries. That's ~30 sec
      # × number of regions in STATE_NAMES — much cheaper than letting
      # the build step grind through Nominatim for the same data.
      #
      # In steady state (warm cache, no new regions) coverage is ~100%
      # and the pre-pass is skipped. The flag also auto-triggers when
      # `seed_regions` is explicitly non-empty (the user is adding new
      # regions and wants them seeded).
      - name: Check cache freshness
        id: cache_check
        env:
          SEED_REGIONS: ${{ github.event.inputs.seed_regions }}
        run: |
          python3 <<'EOF' >> "$GITHUB_OUTPUT"
          import json, os, sys
          idx_path = 'public/areas/index.json'
          cache_path = 'public/areas/counts-cache.json'
          if not os.path.exists(idx_path):
              print("needs_seed_pass=false")
              sys.exit(0)
          idx = json.load(open(idx_path))
          cache = {}
          if os.path.exists(cache_path):
              cache = json.load(open(cache_path))
          total = len(idx)
          with_osm = sum(
              1 for r in idx if cache.get(r[0], {}).get("osm_id") is not None
          )
          pct = (with_osm / total) if total else 1
          needs = pct < 0.8
          print(f"needs_seed_pass={'true' if needs else 'false'}")
          print(
              f"::notice::counts-cache.json osm_id coverage: "
              f"{with_osm}/{total} ({int(pct*100)}%) — "
              f"{'running pre-pass' if needs else 'pre-pass skipped'}",
              file=sys.stderr,
          )
          EOF

      # Seed step: runs when either (a) the user explicitly named
      # `seed_regions`, OR (b) cache coverage is low. In case (b) we
      # seed `--all` to refresh osm_ids for every region in
      # STATE_NAMES; in case (a) we seed just the named regions
      # (the user wants those specifically). Wrapped in a 3-retry
      # shell loop so a transient Overpass 504 doesn't bail the
      # workflow.
      - name: Seed area index from OSM
        if: ${{ github.event.inputs.seed_regions != '' || steps.cache_check.outputs.needs_seed_pass == 'true' }}
        env:
          SEED_REGIONS: ${{ github.event.inputs.seed_regions }}
        run: |
          set -euo pipefail
          if [ -n "$SEED_REGIONS" ]; then
            SEED_ARGS=(--merge $SEED_REGIONS)
            echo "Seeding explicit regions: $SEED_REGIONS"
          else
            SEED_ARGS=(--merge --all)
            echo "Cache osm_id coverage low — refreshing every region in STATE_NAMES."
          fi
          for attempt in 1 2 3; do
            if python3 scripts/seed-areas.py "${SEED_ARGS[@]}"; then
              echo "Seed step succeeded on attempt $attempt."
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::Seed step failed after 3 workflow attempts; bailing."
              exit 1
            fi
            SLEEP=$((60 * attempt * attempt))
            echo "::warning::Seed step failed (attempt $attempt). Sleeping ${SLEEP}s before retry."
            sleep "$SLEEP"
          done

      # Build step: ALWAYS runs, ALWAYS on the full index. Cached
      # areas skip in <1 ms each so this is essentially free for
      # everything that's already hydrated; the wall-clock cost is
      # only ever for 5-tuple seed-only rows + any areas the
      # `force_rehydrate` flag is forcing back through.
      #
      # Concurrency tuned to 6 workers / 1.0 sec delay = ~6 req/s
      # aggregate across the two Overpass mirrors (~3 req/s each).
      # The existing retry layer absorbs occasional 429s.
      - name: Run trail count builder (full index)
        env:
          FORCE: ${{ github.event.inputs.force_rehydrate }}
        run: |
          ARGS=(
            --batch-size 50
            --delay 1.0
            --concurrency 6
            --min-trails 3
            --min-miles 2
          )
          if [ "$FORCE" = "true" ]; then
            ARGS+=(--force)
          fi
          python3 scripts/build-trail-counts.py "${ARGS[@]}"

      # Hydration guard. After the build step, every row in
      # index.json should be a 7-tuple (with trail_count, total_mi).
      # If any 5-tuples remain that means Overpass failed for those
      # areas — log them loudly so the user can see, but DON'T fail
      # the workflow (a single flaky Overpass response shouldn't
      # require a manual re-dispatch; the next scheduled run will
      # retry the un-hydrated ones automatically). The warning lands
      # in the Actions log AND as a job summary so it's hard to miss.
      - name: Hydration guard
        run: |
          python3 <<'EOF'
          import json, os, sys
          idx = json.load(open('public/areas/index.json'))
          total = len(idx)
          hydrated = sum(1 for a in idx if len(a) >= 7)
          unhydrated = total - hydrated
          summary_lines = [
              "## Hydration report\n",
              f"- **Total areas**: {total}",
              f"- **Hydrated**: {hydrated}",
              f"- **Un-hydrated (5-tuple)**: {unhydrated}",
          ]
          if unhydrated == 0:
              summary_lines.append("\nEvery area has trail counts.")
          else:
              summary_lines.append(
                  f"\n{unhydrated} area(s) are still 5-tuple rows. "
                  "These will be retried on the next dispatch."
              )
              summary_lines.append("\nFirst 20 un-hydrated:")
              for a in [r for r in idx if len(r) < 7][:20]:
                  summary_lines.append(f"  - {a[0]} ({a[2]})")
              # GitHub Actions warning annotation — surfaces in the
              # run summary and on the PR (if any) — printed to stdout
              # so the Actions runner picks it up.
              print(
                  f"::warning::Build left {unhydrated} un-hydrated "
                  "area(s) in the index — see job summary."
              )

          summary = "\n".join(summary_lines) + "\n"
          # Write to the job-summary file so the report shows on the
          # workflow run page.
          path = os.environ.get("GITHUB_STEP_SUMMARY")
          if path:
              with open(path, "a") as f:
                  f.write(summary)
          # Also print for the live log.
          sys.stdout.write(summary)
          EOF

      - name: Commit updated index
        id: commit
        env:
          SEED_REGIONS: ${{ github.event.inputs.seed_regions }}
        run: |
          # Filter the master index.json down to the regions we
          # actually bundle in the app (NA only today; see
          # scripts/filter-ios-bundle.py). Replaces the plain `cp`
          # so EU rows seeded into the master never leak into the
          # iOS bundle.
          python3 scripts/filter-ios-bundle.py
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/areas/index.json public/areas/silhouettes public/areas/geom ios/SouthMountainExplorer/Resources/areas-index.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
            echo "committed=false" >> "$GITHUB_OUTPUT"
          else
            SUMMARY=$(python3 -c "
          import json
          idx = json.load(open('public/areas/index.json'))
          n = sum(1 for a in idx if len(a) >= 7)
          print(f'{n}/{len(idx)} areas have trail counts')
          ")
            SEED_NOTE=""
            if [ -n "$SEED_REGIONS" ]; then
              SEED_NOTE=" (seeded $SEED_REGIONS)"
            fi
            git commit -m "chore: rebuild trail index — $SUMMARY$SEED_NOTE"
            git push
            echo "committed=true" >> "$GITHUB_OUTPUT"
          fi

      # Pushes by GITHUB_TOKEN don't trigger downstream workflows, so
      # dispatch explicitly. TestFlight is now opt-OUT (default true)
      # because the bundled areas-index.json is the only path that
      # delivers new data to users — every successful data refresh
      # should ship to TestFlight unless the user explicitly turns it
      # off (e.g. during back-to-back iteration where they don't want
      # the macOS minutes spent per attempt).
      - name: Trigger iOS TestFlight build
        if: steps.commit.outputs.committed == 'true' && github.event.inputs.trigger_testflight == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run ios-testflight.yml --ref ${{ github.ref_name }}

      - name: Sync geom files to R2
        if: steps.commit.outputs.committed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run sync-geom-to-r2.yml --ref ${{ github.ref_name }}

      # Persist counts-cache.json to Actions cache for the next
      # dispatch. Uses the unique-per-run key from the restore step,
      # so each run writes a fresh cache slot (works around the
      # actions/cache "no overwrite" limitation). `if: always()`
      # so partial-failure runs still save their work — losing a
      # multi-hour rebuild because of a transient network blip in
      # the final R2-sync step would be a disaster.
      - name: Save counts-cache to Actions cache
        if: always() && hashFiles('public/areas/counts-cache.json') != ''
        uses: actions/cache/save@v4
        with:
          path: public/areas/counts-cache.json
          key: counts-cache-v2-${{ github.run_id }}

      - name: Upload counts-cache.json as artifact
        if: always() && hashFiles('public/areas/counts-cache.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: counts-cache
          path: public/areas/counts-cache.json
          retention-days: 30
          if-no-files-found: ignore
