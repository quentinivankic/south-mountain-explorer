name: iOS – PR build & test

# Fast compile-check + unit-test gate that runs on every pull
# request touching iOS sources, the test target, the bundled trail
# data, or the project config. Catches Swift compiler / type errors
# and any regression in the unit tests before code lands on main —
# without the cert / provisioning / TestFlight upload overhead of
# `ios-testflight.yml`.
#
# Build is performed against the iOS Simulator with code signing
# fully disabled so this workflow needs no secrets.

on:
  pull_request:
    paths:
      - "ios/**"
      - "public/areas/index.json"
      - ".github/workflows/ios-pr-build.yml"
  workflow_dispatch:

# Cancel an in-flight build for a PR when a new commit lands on its
# branch — no point continuing the older build's compile+test if
# the user just pushed a fix.
concurrency:
  group: ios-pr-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: xcode-27
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 27.1
        run: sudo xcode-select -s /Applications/Xcode_27.1.app/Contents/Developer
      - name: Show Xcode + SDK
        run: xcodebuild -version && xcodebuild -showsdks | grep -i ios

      - name: Install iOS platform + Simulator runtime
        # MUST run before the build. The macos-latest image rolled
        # (2026-06) and Xcode 26's iOS platform is no longer
        # preinstalled at all — xcodebuild's destination resolver
        # fails with "iOS 26.0 is not installed", so even a
        # `generic/platform=iOS Simulator` BUILD can't resolve a
        # destination. Downloading the iOS platform here makes both the
        # build's generic destination and the test's simulator
        # destination resolvable. ~3-5 min on a cold runner, ~0 when
        # already cached.
        #
        # NO sudo: running xcodebuild as root can't reach the
        # user-session CoreSimulator service, which made this step fail
        # intermittently with "Unable to connect to simulator" (exit
        # 70). The reliable ios-testflight.yml runs it un-sudo'd too.
        # Wrapped in a retry because the download itself occasionally
        # hits a transient network/service hiccup on a cold runner.
        # Between retries, bounce CoreSimulatorService: some runners come
        # up with the daemon wedged ("Unable to connect to simulator" from
        # the very first call) and it never recovers on its own — killing
        # it forces a clean relaunch on the next attempt.
        #
        # Skipped when the runner image already ships an available iOS
        # Simulator runtime whose version equals the selected Xcode's
        # iphonesimulator SDK (the xcode-27 image ships 27.0 and 27.1).
        # Any other case (no runtime, older runtime only, unreadable
        # output) falls through to the download loop as before.
        run: |
          SDK_VER=$(xcrun --sdk iphonesimulator --show-sdk-version 2>/dev/null || true)
          if [ -n "$SDK_VER" ] && xcrun simctl list runtimes available -j 2>/dev/null \
               | python3 -c "
          import sys, json
          want = sys.argv[1]
          rts = json.load(sys.stdin).get('runtimes', [])
          ok = any(r.get('platform') == 'iOS' and r.get('isAvailable') and r.get('version') == want for r in rts)
          sys.exit(0 if ok else 1)
          " "$SDK_VER"; then
            echo "iOS $SDK_VER Simulator runtime already installed; skipping download"
            exit 0
          fi
          echo "No installed iOS ${SDK_VER:-unknown} Simulator runtime; downloading"
          for attempt in 1 2 3 4; do
            if xcodebuild -downloadPlatform iOS; then
              echo "iOS platform ready (attempt $attempt)"
              exit 0
            fi
            echo "downloadPlatform attempt $attempt failed; bouncing CoreSimulator, retrying in 30s" >&2
            sudo killall -9 com.apple.CoreSimulator.CoreSimulatorService 2>/dev/null || true
            sleep 30
          done
          echo "downloadPlatform failed after 4 attempts" >&2
          exit 1

      - name: Install XcodeGen (pinned release binary)
        # Pinned to the version used locally (2.46.0) and checked against
        # its SHA-256, instead of `brew install xcodegen`, which resolved
        # bottle manifests on every run and floats to whatever Homebrew
        # has. The 2.46.0 release binary generates a byte-identical
        # project to the Homebrew 2.46.0 build (checked with diff -r).
        env:
          XCODEGEN_VERSION: "2.46.0"
          XCODEGEN_SHA256: "4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806"
        run: |
          DEST="$RUNNER_TEMP/xcodegen-$XCODEGEN_VERSION"
          mkdir -p "$DEST"
          curl -fsSL --retry 3 --retry-delay 5 -o "$DEST/xcodegen.zip" \
            "https://github.com/yonaskolb/XcodeGen/releases/download/$XCODEGEN_VERSION/xcodegen.zip"
          echo "$XCODEGEN_SHA256  $DEST/xcodegen.zip" | shasum -a 256 -c -
          unzip -q "$DEST/xcodegen.zip" -d "$DEST"
          echo "$DEST/xcodegen/bin" >> "$GITHUB_PATH"
          "$DEST/xcodegen/bin/xcodegen" --version

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Copy committed trail index into iOS bundle
        # See ios-testflight.yml for the rationale — TL;DR: don't
        # regenerate index.json from cache here, just copy the
        # committed one. Regenerating would overwrite it with a
        # near-empty result because counts-cache.json no longer
        # lives in git (it's persisted via Actions cache on
        # build-trail-index per PR #93). That bug shipped to
        # builds 121-122 and emptied the Explore tab.
        run: |
          cp public/areas/index.json ios/SouthMountainExplorer/Resources/areas-index.json

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build (iOS Simulator, no code signing)
        working-directory: ios
        # Build for `generic/platform=iOS Simulator` (the platform is
        # downloaded by the earlier step). The three CODE_SIGN_*
        # overrides defensively disable signing even though simulator
        # builds default to off — guarantees we never bounce on a
        # missing provisioning profile.
        #
        # `-quiet` keeps the log small enough to skim when a build
        # fails; full xcodebuild output dumps thousands of lines per
        # target.
        run: |
          xcodebuild build \
            -project SouthMountainExplorer.xcodeproj \
            -scheme SouthMountainExplorer \
            -configuration Debug \
            -destination "generic/platform=iOS Simulator" \
            -quiet \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Pick an available iPhone simulator
        # Resolve a concrete simulator UDID at runtime instead of
        # pinning a model name. The macos-latest image's simulator
        # lineup changes as it rolls — the previously-pinned
        # "iPhone 16" disappeared when the image moved to the
        # iPhone 17 family, so `-destination name=iPhone 16` stopped
        # resolving and the test step failed with exit 70. Picking
        # whatever iPhone the runtime actually ships keeps this
        # robust across future image rolls.
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          iphones = [d for devs in data['devices'].values() for d in devs if 'iPhone' in d['name']]
          print(iphones[0]['udid'] if iphones else '')
          ")
          if [ -z "$UDID" ]; then
            echo "No available iPhone simulator found" >&2
            xcrun simctl list devices available >&2
            exit 1
          fi
          echo "Using simulator $UDID"
          echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"

      - name: Run unit tests (iOS Simulator)
        working-directory: ios
        # `test` reuses the build products from the previous step
        # via Xcode's derived-data cache, so this is fast — only the
        # test target itself recompiles + the simulator boots.
        #
        # No `-quiet` here, intentionally: when a test fails we
        # want the per-test output (failure messages, expected vs
        # actual, file:line) in the CI log so it can be diagnosed
        # without rerunning locally. The build step above stays
        # quiet because its only useful output is errors/warnings,
        # which xcodebuild emits even with `-quiet`.
        #
        # Destination is a concrete UDID resolved in the previous
        # step (see there for why we don't pin a device name).
        #
        # TEST_RUNNER_TREKDEX_CI reaches the tests as TREKDEX_CI=1
        # (xcodebuild strips the TEST_RUNNER_ prefix). PlanTiming uses
        # it to give timing-budget tests 3x headroom on shared runners;
        # local runs keep the strict limits.
        env:
          TEST_RUNNER_TREKDEX_CI: "1"
        run: |
          xcodebuild test \
            -project SouthMountainExplorer.xcodeproj \
            -scheme SouthMountainExplorer \
            -configuration Debug \
            -destination "id=$SIM_UDID" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO
