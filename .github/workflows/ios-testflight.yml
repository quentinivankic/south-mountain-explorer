name: iOS – Build & Upload to TestFlight

on:
  push:
    branches: [main]
    paths: ["ios/**", "public/areas/index.json"]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26
        run: sudo xcode-select -s /Applications/Xcode_26.0.app/Contents/Developer

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Copy areas index into app bundle
        run: cp public/areas/index.json ios/SouthMountainExplorer/Resources/areas-index.json

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Import distribution certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          echo "$CERTIFICATE_BASE64" | base64 --decode > distribution.p12
          echo "p12 size: $(wc -c < distribution.p12) bytes"
          openssl pkcs12 -in distribution.p12 -noout -passin pass:"$CERTIFICATE_PASSWORD" && echo "p12 password OK" || echo "p12 password FAILED"
          # Re-encrypt p12 with legacy encryption that macOS Keychain accepts
          openssl pkcs12 -in distribution.p12 -passin pass:"$CERTIFICATE_PASSWORD" \
            -out distribution.pem -nodes -legacy
          openssl pkcs12 -export -in distribution.pem -out distribution_nopass.p12 \
            -passout pass:"" -legacy
          security create-keychain -p "" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import distribution_nopass.p12 \
            -k build.keychain \
            -P "" \
            -T /usr/bin/codesign
          security set-key-partition-list \
            -S apple-tool:,apple: -s -k "" build.keychain
          rm distribution.p12 distribution.pem distribution_nopass.p12

      - name: Write App Store Connect API key
        env:
          API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
        run: |
          mkdir -p private_keys
          echo "$API_KEY_BASE64" | base64 --decode \
            > "private_keys/AuthKey_${API_KEY_ID}.p8"

      - name: Archive (manual signing)
        working-directory: ios
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
        run: |
          xcodebuild archive \
            -project SouthMountainExplorer.xcodeproj \
            -scheme SouthMountainExplorer \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath ../build/SouthMountainExplorer.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$GITHUB_WORKSPACE/private_keys/AuthKey_${API_KEY_ID}.p8" \
            -authenticationKeyID "$API_KEY_ID" \
            -authenticationKeyIssuerID "$API_ISSUER_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID"

      - name: Export IPA
        env:
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
        run: |
          xcodebuild -exportArchive \
            -archivePath build/SouthMountainExplorer.xcarchive \
            -exportOptionsPlist ios/ExportOptions.plist \
            -exportPath build/output \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$GITHUB_WORKSPACE/private_keys/AuthKey_${API_KEY_ID}.p8" \
            -authenticationKeyID "$API_KEY_ID" \
            -authenticationKeyIssuerID "$API_ISSUER_ID"

      - name: Upload to TestFlight
        env:
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
        run: |
          xcrun altool --upload-app \
            --type ios \
            --file build/output/SouthMountainExplorer.ipa \
            --apiKey "$API_KEY_ID" \
            --apiIssuer "$API_ISSUER_ID"

      - name: Clean up
        if: always()
        run: |
          rm -rf private_keys
          security delete-keychain build.keychain 2>/dev/null || true
