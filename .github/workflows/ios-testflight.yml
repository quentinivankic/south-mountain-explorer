name: iOS – Build & Upload to TestFlight

on:
  # Manual-only. Was previously auto-triggered on every push to main
  # that touched `ios/**` or the bundled trail index, but that burned
  # TestFlight upload slots on intermediate merges and made it too
  # easy to ship before PR CI had even reported. Dispatch from the
  # Actions tab when you're ready to cut a build.
  workflow_dispatch:

# Coalesce back-to-back merges into a single TestFlight upload.
# When three PRs land within ~30 seconds of each other (typical
# "merge a batch" cadence), without this each push would race
# Apple's build-number gate and burn an upload slot per merge.
# `cancel-in-progress: true` kills the in-flight archive when a
# newer commit lands on main; only the latest commit's run
# completes the archive + TestFlight upload. The cleanup step
# already has `if: always()` so keychain teardown still runs on
# cancellation.
concurrency:
  group: ios-testflight
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26
        run: sudo xcode-select -s /Applications/Xcode_26.0.app/Contents/Developer

      - name: Install matching iOS simulator runtime
        # GitHub's macos-latest image rolls — when Apple drops a point
        # release and GitHub bumps the image's installed simulator
        # runtimes, the active Xcode's iPhoneSimulator SDK can end up
        # without a matching runtime on disk. Asset thinning during
        # `xcodebuild archive` (CompileAssetCatalogVariant thinned)
        # consults the simulator runtime even for a device archive and
        # fails with "No simulator runtime version from [...] available
        # to use with iphonesimulator SDK version <X>". Downloading the
        # matching iOS platform pulls in a runtime that lines up with
        # the active SDK, making the build deterministic across runner-
        # image rolls. Adds ~3-5 min when the runtime needs to be
        # fetched, ~0 when it's already there.
        #
        # Wrapped in a 3× retry: this step intermittently fails with
        # "Unable to connect to simulator" (exit 70) — a transient
        # CoreSimulator hiccup, not a real error — which would abort the
        # whole TestFlight build. Same retry the PR-build workflow got
        # in #204.
        run: |
          for attempt in 1 2 3; do
            if xcodebuild -downloadPlatform iOS; then
              echo "iOS platform ready (attempt $attempt)"
              exit 0
            fi
            echo "downloadPlatform attempt $attempt failed; retrying in 15s" >&2
            sleep 15
          done
          echo "downloadPlatform failed after 3 attempts" >&2
          exit 1

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Copy committed trail index into iOS bundle
        # `public/areas/index.json` is committed to main by
        # `build-trail-index` whenever the upstream OSM data is
        # rebuilt. The iOS bundle just needs a copy in
        # Resources/ before xcodegen runs. We do NOT regenerate
        # the index here — running
        # `build-trail-counts.py --cache-only` would read
        # `public/areas/counts-cache.json`, which no longer
        # lives in git (it's persisted via Actions cache on the
        # build-trail-index workflow per PR #93). With the cache
        # file missing, the script overwrites index.json with a
        # near-empty result, which is exactly the bug that broke
        # builds 121-122 (Explore / Favorite / Browse tabs
        # empty). Just copy what's already in main.
        run: |
          # Filter the master index.json down to the regions we
          # actually bundle in the app (NA only today). See
          # scripts/filter-ios-bundle.py for the allowlist.
          python3 scripts/filter-ios-bundle.py

      - name: Import distribution certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          echo "$CERTIFICATE_BASE64" | base64 --decode > distribution.p12
          security create-keychain -p "build" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "build" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import distribution.p12 \
            -k build.keychain \
            -P "$CERTIFICATE_PASSWORD" \
            -A \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: -s -k "build" build.keychain
          rm distribution.p12

      - name: Inject build number
        # CFBundleVersion in project.yml is "1" as a placeholder so
        # local builds work. CI replaces it with github.run_number per
        # push so App Store Connect doesn't reject subsequent uploads
        # as redundant (error 90189 — "you've already uploaded a build
        # with build number X for version Y"). github.run_number is
        # monotonic per workflow file, so every successive push gets a
        # strictly larger build number.
        run: |
          sed -i "" "s/CFBundleVersion: \"1\"/CFBundleVersion: \"${{ github.run_number }}\"/" ios/project.yml
          echo "Build number set to ${{ github.run_number }}"

      - name: Install provisioning profile and inject UUID
        env:
          PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROVISIONING_PROFILE_BASE64" | base64 --decode \
            > ~/Library/MobileDevice/Provisioning\ Profiles/distribution.mobileprovision
          PROFILE_UUID=$(security cms -D \
            -i ~/Library/MobileDevice/Provisioning\ Profiles/distribution.mobileprovision \
            | plutil -extract UUID xml1 -o - - \
            | sed -n 's/.*<string>\(.*\)<\/string>.*/\1/p')
          echo "Profile UUID: $PROFILE_UUID"
          sed -i "" "s/PROFILE_UUID_PLACEHOLDER/$PROFILE_UUID/" ios/project.yml
          sed -i "" "s/PROFILE_UUID_PLACEHOLDER/$PROFILE_UUID/" ios/ExportOptions.plist
      - name: Install Live Activity extension provisioning profile and inject UUID
        # The widget extension (com.southmountainexplorer.app.liveactivity)
        # needs its own App Store distribution profile. Written to a
        # different filename so it does not overwrite the app's profile.
        env:
          LIVEACTIVITY_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_LIVEACTIVITY_BASE64 }}
        run: |
          if [ -z "$LIVEACTIVITY_PROFILE_BASE64" ]; then
            echo "::error::Secret APPLE_PROVISIONING_PROFILE_LIVEACTIVITY_BASE64 is empty or missing. The Live Activity extension cannot be signed without it. Create an App Store distribution profile for com.southmountainexplorer.app.liveactivity in the Apple Developer portal and add it as that secret (base64 of the .mobileprovision)." >&2
            exit 1
          fi
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$LIVEACTIVITY_PROFILE_BASE64" | base64 --decode \
            > ~/Library/MobileDevice/Provisioning\ Profiles/liveactivity.mobileprovision
          LA_PROFILE_UUID=$(security cms -D \
            -i ~/Library/MobileDevice/Provisioning\ Profiles/liveactivity.mobileprovision \
            | plutil -extract UUID xml1 -o - - \
            | sed -n 's/.*<string>\(.*\)<\/string>.*/\1/p')
          if [ -z "$LA_PROFILE_UUID" ]; then
            echo "::error::Could not read a UUID from the Live Activity provisioning profile. The secret is probably not a valid base64 .mobileprovision." >&2
            exit 1
          fi
          echo "Live Activity profile UUID: $LA_PROFILE_UUID"
          sed -i "" "s/LIVEACTIVITY_PROFILE_UUID_TOKEN/$LA_PROFILE_UUID/" ios/project.yml
          sed -i "" "s/LIVEACTIVITY_PROFILE_UUID_TOKEN/$LA_PROFILE_UUID/" ios/ExportOptions.plist
      - name: Verify tokens replaced and versions match across targets
        run: |
          if grep -n "PROFILE_UUID_PLACEHOLDER\|LIVEACTIVITY_PROFILE_UUID_TOKEN" ios/project.yml ios/ExportOptions.plist; then
            echo "::error::Unreplaced provisioning profile token left in project.yml or ExportOptions.plist." >&2
            exit 1
          fi
          BUILDS=$(grep -c "CFBundleVersion: \"${{ github.run_number }}\"" ios/project.yml)
          DISTINCT_BUILDS=$(grep "CFBundleVersion:" ios/project.yml | sed 's/^ *//' | sort -u | wc -l | tr -d ' ')
          DISTINCT_MARKETING=$(grep "CFBundleShortVersionString:" ios/project.yml | sed 's/^ *//' | sort -u | wc -l | tr -d ' ')
          echo "CFBundleVersion lines set to run number: $BUILDS (expected 2); distinct CFBundleVersion values: $DISTINCT_BUILDS; distinct marketing versions: $DISTINCT_MARKETING"
          if [ "$BUILDS" != "2" ] || [ "$DISTINCT_BUILDS" != "1" ] || [ "$DISTINCT_MARKETING" != "1" ]; then
            echo "::error::App and Live Activity extension CFBundleVersion / CFBundleShortVersionString differ. Apple rejects mismatched extension versions." >&2
            exit 1
          fi
      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Write App Store Connect API key
        env:
          API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
        run: |
          mkdir -p private_keys
          echo "$API_KEY_BASE64" | base64 --decode \
            > "private_keys/AuthKey_${API_KEY_ID}.p8"

      - name: Archive
        working-directory: ios
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
        run: |
          xcodebuild archive \
            -project SouthMountainExplorer.xcodeproj \
            -scheme SouthMountainExplorer \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath ../build/SouthMountainExplorer.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$GITHUB_WORKSPACE/private_keys/AuthKey_${API_KEY_ID}.p8" \
            -authenticationKeyID "$API_KEY_ID" \
            -authenticationKeyIssuerID "$API_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID"

      - name: Export and Upload to TestFlight
        env:
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
        run: |
          xcodebuild -exportArchive \
            -archivePath build/SouthMountainExplorer.xcarchive \
            -exportOptionsPlist ios/ExportOptions.plist \
            -exportPath build/output \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$GITHUB_WORKSPACE/private_keys/AuthKey_${API_KEY_ID}.p8" \
            -authenticationKeyID "$API_KEY_ID" \
            -authenticationKeyIssuerID "$API_ISSUER_ID"

      - name: Clean up
        if: always()
        run: |
          rm -rf private_keys
          security delete-keychain build.keychain 2>/dev/null || true
          security default-keychain -s login.keychain 2>/dev/null || true
