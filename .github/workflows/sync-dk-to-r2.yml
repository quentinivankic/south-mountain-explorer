name: Sync Danish areas to R2 (N areas, registry)

# Manual R2 publish for the Danish areas committed by trailforge-publish-dk.yml.
# Same semantics as sync-mols-to-r2.yml, generalised from one area to N. Needs only
# the three R2 repo secrets (R2_ACCOUNT_ID / R2_ACCESS_KEY_ID /
# R2_SECRET_ACCESS_KEY). No environment, no signed receipt.
#
# The area list is NOT an input: it is the committed index diff, i.e. the rows of
# ios/.../areas-index.json beyond the LIVE R2 index.json rows (each must be a
# registry area with a blessed expected-table entry, 1..120 areas).
#
# The write set is exactly 2N per-area keys (geom + silhouette) plus index.json,
# trail-search.json and trail-shapes.json. The three shared files are the LIVE R2
# bytes with the N areas' records spliced on, so no other area's bytes can change.
# parking.json is read only to prove it did not move (ETag checked before and
# after); it is never written.
#
# mode=plan      read-only: snapshot live R2, build + prove candidates, upload the
#                snapshot/plan as an artifact. Writes nothing to R2.
# mode=apply     plan, then write the 2N+3 keys (geoms/silhouettes, shapes, search,
#                index last) and read each back by sha256.
# mode=rollback  restore the shared files from an apply run's snapshot (each at
#                candidate -> restore, or already baseline -> skip; anything else
#                is a third party's publish and is refused) and delete exactly the
#                2N keys.
#
# UPDATE modes (republish EXISTING Danish areas after trailforge-publish-dk.yml
# mode=update landed on main; the append-only modes above are unchanged):
# mode=plan-update      read-only: download the live per-area objects of every Danish
#                       area in the live index, derive the update set (areas whose
#                       repo geom/silhouette differ from live R2; NOT an input, 1..40,
#                       registry + blessed table + not Mols unless allow_update),
#                       build the candidates (shared files = LIVE bytes with only
#                       those areas' records replaced in place), prove every other
#                       record byte-identical, upload the snapshot of the OLD bytes
#                       of every object to be overwritten. The 2N keys MUST exist.
# mode=apply-update     plan-update, then conditionally overwrite (If-Match on the
#                       snapshotted ETag) 2N per-area objects, shapes, search, index
#                       last; sha256 readback of every key; parking.json ETag
#                       before/after, never written. PARTIAL APPLY trap.
# mode=rollback-update  restore the old bytes of every overwritten object from the
#                       apply run's snapshot (candidate -> restore, old -> skip,
#                       anything else refused), final sha256 readback, parking check.
#
# REMOVE modes (UNLIST Danish areas the repo already dropped via
# `dk_publish.py remove-areas`; registry hold=superseded is required, so only a Danish
# registry area can ever be removed). The 2N per-area objects are NEVER deleted (archive):
# only the three shared files change, with the removed areas' rows/blocks dropped.
# mode=plan-remove      read-only: derive the removal set (live Danish rows absent from
#                       the repo bundle; NOT an input, 1..40), record the ETags of the
#                       2N kept objects (they must exist), build the candidates (shared
#                       files = LIVE bytes minus those areas' records), prove every other
#                       record byte-identical, upload the snapshot.
# mode=apply-remove     plan-remove, then If-Match overwrite of index, search, shapes
#                       (index first so the app stops listing), sha256 readback, kept
#                       objects + parking.json ETags unchanged. PARTIAL APPLY trap.
# mode=rollback-remove  restore the three shared files from the apply run's snapshot
#                       (candidate -> restore, baseline -> skip, anything else refused).

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "plan | apply | rollback (append new areas) ; plan-update | apply-update | rollback-update (overwrite existing areas) ; plan-remove | apply-remove | rollback-remove (unlist superseded areas)"
        type: choice
        options: [plan, apply, rollback, plan-update, apply-update, rollback-update, plan-remove, apply-remove, rollback-remove]
        default: plan
      rollback_run_id:
        description: "rollback / rollback-update / rollback-remove only: run id of the apply run whose snapshot to restore"
        default: ""

permissions:
  contents: read
  actions: read

concurrency:
  group: sync-geom-to-r2
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      MODE: ${{ inputs.mode }}
      ROLLBACK_RUN_ID: ${{ inputs.rollback_run_id }}
      BUCKET: trekdex-areas
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Guards (main tip, inputs, secrets)
        run: |
          set -euo pipefail
          [[ "$MODE" =~ ^(plan|apply|rollback|plan-update|apply-update|rollback-update|plan-remove|apply-remove|rollback-remove)$ ]]
          if [ "$MODE" = "rollback" ] || [ "$MODE" = "rollback-update" ] || [ "$MODE" = "rollback-remove" ]; then
            [[ "$ROLLBACK_RUN_ID" =~ ^[0-9]+$ ]]
          else
            test -z "$ROLLBACK_RUN_ID"
          fi
          test "$GITHUB_REF_NAME" = "main"
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$(git rev-parse HEAD)"
          test -z "$(git status --porcelain)"
          for v in R2_ACCOUNT_ID AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY; do
            test -n "${!v}" || { echo "Missing repo secret for $v"; exit 1; }
          done
          echo "ENDPOINT=https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com" >> "$GITHUB_ENV"
          echo "main tip $(git rev-parse HEAD) mode=$MODE"

      - name: Snapshot live R2 (index, trail-search, trail-shapes, parking)
        run: |
          set -euo pipefail
          mkdir -p snap
          : > snap/etags.tsv
          for key in index.json trail-search.json trail-shapes.json parking.json; do
            etag="$(aws s3api get-object --bucket "$BUCKET" --key "$key" \
              --endpoint-url "$ENDPOINT" --query ETag --output text "snap/$key")"
            etag="${etag//\"/}"
            printf '%s\t%s\t%s\n' "$key" "$etag" "$(sha256sum "snap/$key" | cut -d' ' -f1)" >> snap/etags.tsv
          done
          cat snap/etags.tsv

      - name: Plan (area list from the committed index diff; build + prove candidates)
        if: ${{ inputs.mode == 'plan' || inputs.mode == 'apply' }}
        run: |
          set -euo pipefail
          mkdir -p cand
          python3 scripts/dk_publish.py derive-areas \
            --repo . --live-index snap/index.json --out cand/areas.txt
          # None of the 2N new per-area keys may already exist in R2.
          while read -r area; do
            for key in "$area.json" "silhouettes/$area.json"; do
              found="$(aws s3api list-objects-v2 --bucket "$BUCKET" --prefix "$key" \
                --endpoint-url "$ENDPOINT" --query "Contents[?Key=='$key'].Key" --output text)"
              if [ -n "$found" ] && [ "$found" != "None" ]; then
                echo "key already exists in R2: $key; refusing to overwrite"; exit 1
              fi
            done
          done < cand/areas.txt
          python3 scripts/dk_publish.py build-candidates \
            --repo . \
            --live-index snap/index.json --live-search snap/trail-search.json \
            --live-shapes snap/trail-shapes.json \
            --areas-file cand/areas.txt --out-dir cand
          cp snap/etags.tsv cand/baseline-etags.tsv

      - name: Save snapshot + candidates (rollback source; before any write)
        if: ${{ inputs.mode == 'plan' || inputs.mode == 'apply' }}
        uses: actions/upload-artifact@v4
        with:
          name: dk-r2-snapshot-${{ github.run_id }}
          path: |
            snap/
            cand/
          retention-days: 30
          if-no-files-found: error

      - name: Apply (write 2N+3 keys in order, read each back)
        if: ${{ inputs.mode == 'apply' }}
        run: |
          set -euo pipefail
          put() { # file key cache-control
            aws s3 cp "$1" "s3://$BUCKET/$2" --endpoint-url "$ENDPOINT" \
              --content-type "application/json" --cache-control "$3" --no-progress
          }
          cur() { aws s3api head-object --bucket "$BUCKET" --key "$1" --endpoint-url "$ENDPOINT" --query ETag --output text | tr -d '"'; }
          base() { awk -F'\t' -v k="$1" '$1==k {print $2}' snap/etags.tsv; }
          # Race guard: shared files and parking must still be the snapshotted objects.
          for key in index.json trail-search.json trail-shapes.json parking.json; do
            test "$(cur "$key")" = "$(base "$key")" || { echo "$key changed since snapshot; aborting before any write"; exit 1; }
          done
          trap 'rc=$?; [ "$rc" -eq 0 ] || echo "PARTIAL APPLY: dispatch mode=rollback with rollback_run_id=$GITHUB_RUN_ID"' EXIT
          # plan.json lists writes in order: geoms, silhouettes, shapes, search, index last
          # (the app only learns about the areas once their data exists).
          jq -r '.writes[] | [.key, .file] | @tsv' cand/plan.json | while IFS=$'\t' read -r key file; do
            case "$key" in
              index.json|trail-search.json|trail-shapes.json) cc="public, max-age=300" ;;
              *) cc="public, max-age=86400" ;;
            esac
            put "cand/$file" "$key" "$cc"
          done
          mkdir -p verify
          jq -r '.writes[] | [.key, .file, .sha256] | @tsv' cand/plan.json | while IFS=$'\t' read -r key file sha; do
            mkdir -p "verify/$(dirname "$file")"
            aws s3api get-object --bucket "$BUCKET" --key "$key" --endpoint-url "$ENDPOINT" "verify/$file" > /dev/null
            test "$(sha256sum "verify/$file" | cut -d' ' -f1)" = "$sha" || { echo "READBACK MISMATCH $key"; exit 1; }
            echo "verified $key $sha"
          done
          test "$(cur parking.json)" = "$(base parking.json)" || { echo "parking.json changed"; exit 1; }
          trap - EXIT
          echo "apply complete. rollback: dispatch mode=rollback rollback_run_id=$GITHUB_RUN_ID"

      - name: Rollback (restore shared files, delete exactly the 2N area keys)
        if: ${{ inputs.mode == 'rollback' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p rb
          gh run download "$ROLLBACK_RUN_ID" -R "$GITHUB_REPOSITORY" -n "dk-r2-snapshot-$ROLLBACK_RUN_ID" -D rb
          # Artifact is unzipped as rb/snap/* and rb/cand/*.
          test -f rb/cand/plan.json
          # Snapshot files must match the hashes recorded when they were taken.
          for key in index.json trail-search.json trail-shapes.json; do
            want="$(jq -r --arg k "$key" '.baseline[$k].sha256' rb/cand/plan.json)"
            test "$(sha256sum "rb/snap/$key" | cut -d' ' -f1)" = "$want" || { echo "snapshot $key corrupt"; exit 1; }
          done
          parking_before="$(awk -F'\t' '$1=="parking.json" {print $2}' snap/etags.tsv)"
          # Do not clobber anyone else's later publish: each shared file must be the applied
          # candidate (restore) or already the baseline (skip); anything else refuses.
          python3 scripts/dk_publish.py rollback-decide --plan rb/cand/plan.json --live-dir snap > rb/actions.tsv
          cat rb/actions.tsv
          # Restores first (index first so the app stops listing the areas), then deletes.
          while IFS=$'\t' read -r key action; do
            case "$action" in
              restore)
                aws s3 cp "rb/snap/$key" "s3://$BUCKET/$key" --endpoint-url "$ENDPOINT" \
                  --content-type "application/json" --cache-control "public, max-age=300" --no-progress ;;
              skip) echo "skip $key (already baseline)" ;;
              delete)
                aws s3api delete-object --bucket "$BUCKET" --key "$key" --endpoint-url "$ENDPOINT" ;;
              *) echo "unknown action $action"; exit 1 ;;
            esac
          done < rb/actions.tsv
          mkdir -p verify
          for key in index.json trail-search.json trail-shapes.json; do
            aws s3api get-object --bucket "$BUCKET" --key "$key" --endpoint-url "$ENDPOINT" "verify/$key" > /dev/null
            test "$(sha256sum "verify/$key" | cut -d' ' -f1)" = "$(sha256sum "rb/snap/$key" | cut -d' ' -f1)" || { echo "ROLLBACK READBACK MISMATCH $key"; exit 1; }
          done
          awk -F'\t' '$2=="delete" {print $1}' rb/actions.tsv | while read -r key; do
            found="$(aws s3api list-objects-v2 --bucket "$BUCKET" --prefix "$key" --endpoint-url "$ENDPOINT" --query "Contents[?Key=='$key'].Key" --output text)"
            test -z "$found" -o "$found" = "None" || { echo "$key still present"; exit 1; }
          done
          parking_after="$(aws s3api head-object --bucket "$BUCKET" --key parking.json --endpoint-url "$ENDPOINT" --query ETag --output text | tr -d '"')"
          test "$parking_after" = "$parking_before" || { echo "parking.json changed"; exit 1; }
          echo "rollback verified"

      # ---------------------------------------------------------------------
      # UPDATE modes (overwrite existing Danish areas). Everything above this
      # line is the unchanged append-only path (plan | apply | rollback).
      # ---------------------------------------------------------------------
      - name: Update plan (live Danish objects, repo-vs-live area set, candidates, proofs)
        if: ${{ inputs.mode == 'plan-update' || inputs.mode == 'apply-update' }}
        run: |
          set -euo pipefail
          mkdir -p cand all-areas/silhouettes snap/areas/silhouettes
          python3 scripts/dk_publish.py live-dk-ids --repo . --live-index snap/index.json --out cand/live-dk.txt
          : > all-areas/etags.tsv
          # The 2N keys MUST already exist (opposite of the append path): a missing key fails here.
          while read -r area; do
            for key in "$area.json" "silhouettes/$area.json"; do
              etag="$(aws s3api get-object --bucket "$BUCKET" --key "$key" \
                --endpoint-url "$ENDPOINT" --query ETag --output text "all-areas/$key")"
              etag="${etag//\"/}"
              printf '%s\t%s\t%s\n' "$key" "$etag" "$(sha256sum "all-areas/$key" | cut -d' ' -f1)" >> all-areas/etags.tsv
            done
          done < cand/live-dk.txt
          # The update set is NOT an input: Danish areas whose repo files differ from live R2.
          python3 scripts/dk_publish.py derive-update-areas \
            --repo . --live-index snap/index.json --live-areas-dir all-areas --out cand/areas.txt
          python3 scripts/dk_publish.py build-update-candidates \
            --repo . \
            --live-index snap/index.json --live-search snap/trail-search.json \
            --live-shapes snap/trail-shapes.json --live-areas-dir all-areas \
            --areas-file cand/areas.txt --out-dir cand
          # Snapshot the OLD bytes of every per-area object that will be overwritten.
          : > snap/area-etags.tsv
          jq -r '.old_objects | to_entries[] | [.key, .value.file, .value.sha256] | @tsv' cand/plan.json | \
          while IFS=$'\t' read -r key file sha; do
            mkdir -p "snap/$(dirname "$file")"
            cp "all-areas/$key" "snap/$file"
            test "$(sha256sum "snap/$file" | cut -d' ' -f1)" = "$sha"
            awk -F'\t' -v k="$key" '$1==k' all-areas/etags.tsv >> snap/area-etags.tsv
          done
          test "$(wc -l < snap/area-etags.tsv)" -eq "$(jq '.old_objects | length' cand/plan.json)"
          cp snap/etags.tsv cand/baseline-etags.tsv
          jq -r '.writes[] | .key' cand/plan.json

      - name: Save update snapshot + candidates (rollback source; before any write)
        if: ${{ inputs.mode == 'plan-update' || inputs.mode == 'apply-update' }}
        uses: actions/upload-artifact@v4
        with:
          name: dk-r2-update-snapshot-${{ github.run_id }}
          path: |
            snap/
            cand/
          retention-days: 30
          if-no-files-found: error

      - name: Apply update (conditional overwrite of 2N+3 keys, read each back)
        if: ${{ inputs.mode == 'apply-update' }}
        run: |
          set -euo pipefail
          # Conditional write: the object must still be exactly the snapshotted one (If-Match).
          put() { # file key cache-control etag
            aws s3api put-object --bucket "$BUCKET" --key "$2" --body "$1" \
              --content-type "application/json" --cache-control "$3" --if-match "$4" \
              --endpoint-url "$ENDPOINT" > /dev/null
          }
          cur() { aws s3api head-object --bucket "$BUCKET" --key "$1" --endpoint-url "$ENDPOINT" --query ETag --output text | tr -d '"'; }
          base() { awk -F'\t' -v k="$1" '$1==k {print $2}' snap/etags.tsv snap/area-etags.tsv; }
          # Race guard: every overwritten key and parking must still be the snapshotted object.
          for key in $(jq -r '.writes[].key' cand/plan.json) parking.json; do
            want="$(base "$key")"
            test -n "$want" || { echo "no snapshot ETag for $key; aborting before any write"; exit 1; }
            test "$(cur "$key")" = "$want" || { echo "$key changed since snapshot; aborting before any write"; exit 1; }
          done
          trap 'rc=$?; [ "$rc" -eq 0 ] || echo "PARTIAL APPLY: dispatch mode=rollback-update with rollback_run_id=$GITHUB_RUN_ID"' EXIT
          # plan.json lists writes in order: geoms, silhouettes, shapes, search, index last.
          jq -r '.writes[] | [.key, .file] | @tsv' cand/plan.json | while IFS=$'\t' read -r key file; do
            case "$key" in
              index.json|trail-search.json|trail-shapes.json) cc="public, max-age=300" ;;
              *) cc="public, max-age=86400" ;;
            esac
            put "cand/$file" "$key" "$cc" "$(base "$key")"
          done
          mkdir -p verify
          jq -r '.writes[] | [.key, .file, .sha256] | @tsv' cand/plan.json | while IFS=$'\t' read -r key file sha; do
            mkdir -p "verify/$(dirname "$file")"
            aws s3api get-object --bucket "$BUCKET" --key "$key" --endpoint-url "$ENDPOINT" "verify/$file" > /dev/null
            test "$(sha256sum "verify/$file" | cut -d' ' -f1)" = "$sha" || { echo "READBACK MISMATCH $key"; exit 1; }
            echo "verified $key $sha"
          done
          test "$(cur parking.json)" = "$(base parking.json)" || { echo "parking.json changed"; exit 1; }
          trap - EXIT
          echo "update apply complete. rollback: dispatch mode=rollback-update rollback_run_id=$GITHUB_RUN_ID"

      - name: Rollback update (restore the OLD bytes of every overwritten object)
        if: ${{ inputs.mode == 'rollback-update' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p rb rb/live
          gh run download "$ROLLBACK_RUN_ID" -R "$GITHUB_REPOSITORY" -n "dk-r2-update-snapshot-$ROLLBACK_RUN_ID" -D rb
          test -f rb/cand/plan.json
          jq -e '.schema == "trekdex-dk-r2-update-plan-v1"' rb/cand/plan.json > /dev/null
          # The snapshot must match the hashes recorded when it was taken.
          for key in index.json trail-search.json trail-shapes.json; do
            want="$(jq -r --arg k "$key" '.baseline[$k].sha256' rb/cand/plan.json)"
            test "$(sha256sum "rb/snap/$key" | cut -d' ' -f1)" = "$want" || { echo "snapshot $key corrupt"; exit 1; }
          done
          jq -r '.old_objects | to_entries[] | [.value.file, .value.sha256] | @tsv' rb/cand/plan.json | \
          while IFS=$'\t' read -r file sha; do
            test "$(sha256sum "rb/snap/$file" | cut -d' ' -f1)" = "$sha" || { echo "snapshot $file corrupt"; exit 1; }
          done
          parking_before="$(awk -F'\t' '$1=="parking.json" {print $2}' snap/etags.tsv)"
          # Current live bytes + ETags of every overwritten object.
          : > rb/live-etags.tsv
          for key in $(jq -r '.writes[].key' rb/cand/plan.json); do
            mkdir -p "rb/live/$(dirname "$key")"
            etag="$(aws s3api get-object --bucket "$BUCKET" --key "$key" --endpoint-url "$ENDPOINT" \
              --query ETag --output text "rb/live/$key")"
            printf '%s\t%s\n' "$key" "${etag//\"/}" >> rb/live-etags.tsv
          done
          # Each object must be the applied candidate (restore) or already old (skip); a
          # third party's bytes refuse the whole rollback before anything is written.
          python3 scripts/dk_publish.py rollback-decide-update --plan rb/cand/plan.json --live-dir rb/live > rb/actions.tsv
          cat rb/actions.tsv
          while IFS=$'\t' read -r key action; do
            case "$action" in
              restore)
                case "$key" in
                  index.json|trail-search.json|trail-shapes.json) src="rb/snap/$key"; cc="public, max-age=300" ;;
                  *) src="rb/snap/areas/$key"; cc="public, max-age=86400" ;;
                esac
                aws s3api put-object --bucket "$BUCKET" --key "$key" --body "$src" \
                  --content-type "application/json" --cache-control "$cc" \
                  --if-match "$(awk -F'\t' -v k="$key" '$1==k {print $2}' rb/live-etags.tsv)" \
                  --endpoint-url "$ENDPOINT" > /dev/null ;;
              skip) echo "skip $key (already old bytes)" ;;
              *) echo "unknown action $action"; exit 1 ;;
            esac
          done < rb/actions.tsv
          # Final readback: every overwritten object is now exactly its old bytes.
          mkdir -p verify
          awk -F'\t' '{print $1}' rb/actions.tsv | while read -r key; do
            case "$key" in
              index.json|trail-search.json|trail-shapes.json) src="rb/snap/$key" ;;
              *) src="rb/snap/areas/$key" ;;
            esac
            mkdir -p "verify/$(dirname "$key")"
            aws s3api get-object --bucket "$BUCKET" --key "$key" --endpoint-url "$ENDPOINT" "verify/$key" > /dev/null
            test "$(sha256sum "verify/$key" | cut -d' ' -f1)" = "$(sha256sum "$src" | cut -d' ' -f1)" || { echo "ROLLBACK READBACK MISMATCH $key"; exit 1; }
          done
          parking_after="$(aws s3api head-object --bucket "$BUCKET" --key parking.json --endpoint-url "$ENDPOINT" --query ETag --output text | tr -d '"')"
          test "$parking_after" = "$parking_before" || { echo "parking.json changed"; exit 1; }
          echo "update rollback verified"

      # ---------------------------------------------------------------------
      # REMOVE modes (unlist superseded Danish areas; per-area objects are kept).
      # Everything above this line is unchanged.
      # ---------------------------------------------------------------------
      - name: Remove plan (removal set from the repo vs live index, kept objects, candidates, proofs)
        if: ${{ inputs.mode == 'plan-remove' || inputs.mode == 'apply-remove' }}
        run: |
          set -euo pipefail
          mkdir -p cand
          # The removal set is NOT an input: live Danish rows the repo bundle no longer lists.
          python3 scripts/dk_publish.py derive-remove-areas \
            --repo . --live-index snap/index.json --out cand/areas.txt
          # The 2N per-area objects are kept: they must exist and are never written or deleted.
          : > snap/kept-etags.tsv
          while read -r area; do
            for key in "$area.json" "silhouettes/$area.json"; do
              etag="$(aws s3api head-object --bucket "$BUCKET" --key "$key" \
                --endpoint-url "$ENDPOINT" --query ETag --output text)"
              printf '%s\t%s\n' "$key" "${etag//\"/}" >> snap/kept-etags.tsv
            done
          done < cand/areas.txt
          python3 scripts/dk_publish.py build-remove-candidates \
            --repo . \
            --live-index snap/index.json --live-search snap/trail-search.json \
            --live-shapes snap/trail-shapes.json \
            --areas-file cand/areas.txt --out-dir cand
          test "$(wc -l < snap/kept-etags.tsv)" -eq "$(jq '.kept_objects | length' cand/plan.json)"
          cp snap/etags.tsv cand/baseline-etags.tsv
          jq -r '.writes[] | .key' cand/plan.json

      - name: Save remove snapshot + candidates (rollback source; before any write)
        if: ${{ inputs.mode == 'plan-remove' || inputs.mode == 'apply-remove' }}
        uses: actions/upload-artifact@v4
        with:
          name: dk-r2-remove-snapshot-${{ github.run_id }}
          path: |
            snap/
            cand/
          retention-days: 30
          if-no-files-found: error

      - name: Apply remove (conditional overwrite of the 3 shared files, nothing deleted)
        if: ${{ inputs.mode == 'apply-remove' }}
        run: |
          set -euo pipefail
          put() { # file key cache-control etag
            aws s3api put-object --bucket "$BUCKET" --key "$2" --body "$1" \
              --content-type "application/json" --cache-control "$3" --if-match "$4" \
              --endpoint-url "$ENDPOINT" > /dev/null
          }
          cur() { aws s3api head-object --bucket "$BUCKET" --key "$1" --endpoint-url "$ENDPOINT" --query ETag --output text | tr -d '"'; }
          base() { awk -F'\t' -v k="$1" '$1==k {print $2}' snap/etags.tsv; }
          # Race guard: the shared files and parking must still be the snapshotted objects.
          for key in index.json trail-search.json trail-shapes.json parking.json; do
            test "$(cur "$key")" = "$(base "$key")" || { echo "$key changed since snapshot; aborting before any write"; exit 1; }
          done
          trap 'rc=$?; [ "$rc" -eq 0 ] || echo "PARTIAL APPLY: dispatch mode=rollback-remove with rollback_run_id=$GITHUB_RUN_ID"' EXIT
          # plan.json lists writes in order: index first (the app stops listing), search, shapes.
          jq -r '.writes[] | [.key, .file] | @tsv' cand/plan.json | while IFS=$'\t' read -r key file; do
            put "cand/$file" "$key" "public, max-age=300" "$(base "$key")"
          done
          mkdir -p verify
          jq -r '.writes[] | [.key, .file, .sha256] | @tsv' cand/plan.json | while IFS=$'\t' read -r key file sha; do
            aws s3api get-object --bucket "$BUCKET" --key "$key" --endpoint-url "$ENDPOINT" "verify/$file" > /dev/null
            test "$(sha256sum "verify/$file" | cut -d' ' -f1)" = "$sha" || { echo "READBACK MISMATCH $key"; exit 1; }
            echo "verified $key $sha"
          done
          # The kept per-area objects were not touched.
          while IFS=$'\t' read -r key etag; do
            test "$(cur "$key")" = "$etag" || { echo "KEPT OBJECT CHANGED $key"; exit 1; }
          done < snap/kept-etags.tsv
          test "$(cur parking.json)" = "$(base parking.json)" || { echo "parking.json changed"; exit 1; }
          trap - EXIT
          echo "remove apply complete. rollback: dispatch mode=rollback-remove rollback_run_id=$GITHUB_RUN_ID"

      - name: Rollback remove (restore the 3 shared files; nothing was deleted)
        if: ${{ inputs.mode == 'rollback-remove' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p rb rb/live
          gh run download "$ROLLBACK_RUN_ID" -R "$GITHUB_REPOSITORY" -n "dk-r2-remove-snapshot-$ROLLBACK_RUN_ID" -D rb
          test -f rb/cand/plan.json
          jq -e '.schema == "trekdex-dk-r2-remove-plan-v1"' rb/cand/plan.json > /dev/null
          for key in index.json trail-search.json trail-shapes.json; do
            want="$(jq -r --arg k "$key" '.baseline[$k].sha256' rb/cand/plan.json)"
            test "$(sha256sum "rb/snap/$key" | cut -d' ' -f1)" = "$want" || { echo "snapshot $key corrupt"; exit 1; }
          done
          parking_before="$(awk -F'\t' '$1=="parking.json" {print $2}' snap/etags.tsv)"
          : > rb/live-etags.tsv
          for key in index.json trail-search.json trail-shapes.json; do
            etag="$(aws s3api get-object --bucket "$BUCKET" --key "$key" --endpoint-url "$ENDPOINT" \
              --query ETag --output text "rb/live/$key")"
            printf '%s\t%s\n' "$key" "${etag//\"/}" >> rb/live-etags.tsv
          done
          # Each shared file must be the applied candidate (restore) or already baseline (skip);
          # a third party's bytes refuse the whole rollback before anything is written.
          python3 scripts/dk_publish.py rollback-decide-remove --plan rb/cand/plan.json --live-dir rb/live > rb/actions.tsv
          cat rb/actions.tsv
          while IFS=$'\t' read -r key action; do
            case "$action" in
              restore)
                aws s3api put-object --bucket "$BUCKET" --key "$key" --body "rb/snap/$key" \
                  --content-type "application/json" --cache-control "public, max-age=300" \
                  --if-match "$(awk -F'\t' -v k="$key" '$1==k {print $2}' rb/live-etags.tsv)" \
                  --endpoint-url "$ENDPOINT" > /dev/null ;;
              skip) echo "skip $key (already baseline)" ;;
              *) echo "unknown action $action"; exit 1 ;;
            esac
          done < rb/actions.tsv
          mkdir -p verify
          for key in index.json trail-search.json trail-shapes.json; do
            aws s3api get-object --bucket "$BUCKET" --key "$key" --endpoint-url "$ENDPOINT" "verify/$key" > /dev/null
            test "$(sha256sum "verify/$key" | cut -d' ' -f1)" = "$(sha256sum "rb/snap/$key" | cut -d' ' -f1)" || { echo "ROLLBACK READBACK MISMATCH $key"; exit 1; }
          done
          while IFS=$'\t' read -r key etag; do
            now="$(aws s3api head-object --bucket "$BUCKET" --key "$key" --endpoint-url "$ENDPOINT" --query ETag --output text | tr -d '"')"
            test "$now" = "$etag" || { echo "KEPT OBJECT CHANGED $key"; exit 1; }
          done < rb/snap/kept-etags.tsv
          parking_after="$(aws s3api head-object --bucket "$BUCKET" --key parking.json --endpoint-url "$ENDPOINT" --query ETag --output text | tr -d '"')"
          test "$parking_after" = "$parking_before" || { echo "parking.json changed"; exit 1; }
          echo "remove rollback verified"
