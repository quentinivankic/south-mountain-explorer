name: Sync Geom to R2 from an approved immutable source

# This is intentionally manual-only. Every run must name one root-approved
# full commit and its exact tree. The workflow definition must itself run at
# that commit, checkout is detached, and identity is rechecked immediately
# before the first provider write. Branch names, tips, schedules, merge events,
# and mutable-main reconciliation are not accepted release identities.
#
# The remote inventory is mandatory. A failed, empty, malformed, duplicate, or
# implausibly incomplete listing aborts before staging and before every upload.
# scripts/stage-changed-r2.py emits an exact per-object manifest; this workflow
# verifies each staged SHA-256/MD5 and uploads each named object individually.

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: "Root-approved full 40-character source commit SHA"
        required: true
        type: string
      source_tree:
        description: "Exact full 40-character Git tree for source_sha"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: sync-geom-to-r2
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout the approved commit, detached
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify immutable source identity
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          SOURCE_TREE: ${{ inputs.source_tree }}
        run: |
          set -euo pipefail
          if [[ ! "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::source_sha must be one full lowercase commit SHA"
            exit 1
          fi
          if [[ ! "$SOURCE_TREE" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::source_tree must be one full lowercase tree SHA"
            exit 1
          fi
          if [ "$GITHUB_SHA" != "$SOURCE_SHA" ]; then
            echo "::error::workflow definition ref is not the approved source_sha"
            exit 1
          fi
          git cat-file -e "${SOURCE_SHA}^{commit}"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$SOURCE_TREE"
          if git symbolic-ref -q HEAD; then
            echo "::error::approved source checkout is attached to a mutable ref"
            exit 1
          fi
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          echo "verified detached source commit=$SOURCE_SHA tree=$SOURCE_TREE"

      - name: Build exact upload set and synchronize R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          SOURCE_TREE: ${{ inputs.source_tree }}
        run: |
          set -euo pipefail
          if [ -z "$R2_ACCOUNT_ID" ] || [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$AWS_SECRET_ACCESS_KEY" ]; then
            echo "Missing one of R2_ACCOUNT_ID / R2_ACCESS_KEY_ID / R2_SECRET_ACCESS_KEY repo secrets."
            exit 1
          fi
          ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          WORK_ROOT="$(mktemp -d "${RUNNER_TEMP:-/tmp}/trekdex-r2-sync.XXXXXX")"
          INVENTORY="$WORK_ROOT/r2-inventory.json"
          STAGE_ROOT="$WORK_ROOT/stage"

          echo "Fetching and validating every R2 inventory page..."
          python3 scripts/stage-changed-r2.py fetch-inventory \
            --bucket trekdex-areas \
            --endpoint-url "$ENDPOINT" \
            --output "$INVENTORY"
          test -s "$INVENTORY"

          echo "Requiring complete local-key coverage and building an exact upload manifest..."
          python3 scripts/stage-changed-r2.py stage \
            --inventory "$INVENTORY" \
            --bucket trekdex-areas \
            --stage-root "$STAGE_ROOT"
          UPLOAD_MANIFEST="$STAGE_ROOT/upload-manifest.tsv"
          test -f "$UPLOAD_MANIFEST"

          # Build every global object before the first write. A build failure
          # therefore cannot leave a run that already uploaded an inferred set.
          TRAIL_SEARCH="$WORK_ROOT/trail-search.json"
          PARKING="$WORK_ROOT/parking.json"
          TRAIL_SHAPES="$WORK_ROOT/trail-shapes.json"
          python3 scripts/build-trail-search-index.py --out "$TRAIL_SEARCH"
          python3 scripts/build-parking-pool.py --out "$PARKING" \
            --extra public/areas/parking-pool.json \
            --verdicts public/areas/parking-verdicts.json \
            --add-keeps
          python3 scripts/build-trail-shapes.py --out "$TRAIL_SHAPES"
          test -s ios/SouthMountainExplorer/Resources/areas-index.json
          test -s "$TRAIL_SEARCH"
          test -s "$PARKING"
          test -s "$TRAIL_SHAPES"

          # Recheck the approved immutable source at the last local boundary
          # before any provider mutation.
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$SOURCE_TREE"
          if git symbolic-ref -q HEAD; then
            echo "::error::source became attached to a mutable ref"
            exit 1
          fi
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

          upload_count=0
          while IFS=$'\t' read -r dataset name expected_md5 expected_sha256 extra; do
            [ -z "${extra:-}" ] || { echo "::error::malformed upload manifest row"; exit 1; }
            [ -n "$dataset" ] || continue
            case "$dataset" in
              geom) key="$name" ;;
              silhouettes) key="silhouettes/$name" ;;
              *) echo "::error::unknown upload dataset: $dataset"; exit 1 ;;
            esac
            case "$name" in
              */*|*$'\n'*|*$'\r'*|*$'\t'*)
                echo "::error::unsafe upload basename"
                exit 1
                ;;
            esac
            file="$STAGE_ROOT/$dataset/$name"
            test -f "$file"
            test ! -L "$file"
            test "$(md5sum "$file" | awk '{print $1}')" = "$expected_md5"
            test "$(sha256sum "$file" | awk '{print $1}')" = "$expected_sha256"
            aws s3 cp "$file" "s3://trekdex-areas/$key" \
              --endpoint-url "$ENDPOINT" \
              --content-type "application/json" \
              --cache-control "public, max-age=86400" \
              --no-progress
            upload_count=$((upload_count + 1))
          done < "$UPLOAD_MANIFEST"
          manifest_count=$(awk -F '\t' 'NF { count += 1 } END { print count + 0 }' "$UPLOAD_MANIFEST")
          test "$upload_count" -eq "$manifest_count"

          aws s3 cp ios/SouthMountainExplorer/Resources/areas-index.json \
            s3://trekdex-areas/index.json \
            --endpoint-url "$ENDPOINT" \
            --content-type "application/json" \
            --cache-control "public, max-age=300" \
            --no-progress
          aws s3 cp "$TRAIL_SEARCH" \
            s3://trekdex-areas/trail-search.json \
            --endpoint-url "$ENDPOINT" \
            --content-type "application/json" \
            --cache-control "public, max-age=300" \
            --no-progress
          aws s3 cp "$PARKING" \
            s3://trekdex-areas/parking.json \
            --endpoint-url "$ENDPOINT" \
            --content-type "application/json" \
            --cache-control "public, max-age=300" \
            --no-progress
          aws s3 cp "$TRAIL_SHAPES" \
            s3://trekdex-areas/trail-shapes.json \
            --endpoint-url "$ENDPOINT" \
            --content-type "application/json" \
            --cache-control "public, max-age=300" \
            --no-progress

          echo "Sync complete from approved commit=$SOURCE_SHA tree=$SOURCE_TREE; exact changed-object uploads=$upload_count."
