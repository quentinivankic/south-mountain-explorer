name: Sync Geom to R2 from an approved immutable source

# This is intentionally manual-only. Every run must name one root-approved
# full commit and its exact tree. The workflow definition must itself run at
# that commit, checkout is detached, and identity is rechecked immediately
# before the first provider write. Branch names, tips, schedules, merge events,
# and mutable-main reconciliation are not accepted release identities.
#
# The remote inventory is mandatory. A failed, empty, malformed, duplicate, or
# incomplete listing aborts before staging and before every write. The receipt
# binds privacy-safe identity references, all page/token closure, every exact
# key/preimage, the protected set, denominator, digest, and anchor state.
# scripts/stage-changed-r2.py emits one complete producer population and the
# exact changed-leaf-plus-four-global conditional manifest. Apply accepts only
# its separately reviewed SHA-256 and emits a typed terminal receipt.

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: "Root-approved full 40-character source commit SHA"
        required: true
        type: string
      source_tree:
        description: "Exact full 40-character Git tree for source_sha"
        required: true
        type: string
      root_approval_ref:
        description: "Immutable privacy-safe sha256 reference to root approval"
        required: true
        type: string
      account_identity_ref:
        description: "Precomputed privacy-safe sha256 reference to the provider account"
        required: true
        type: string
      endpoint_identity_ref:
        description: "Precomputed privacy-safe sha256 reference to the provider endpoint"
        required: true
        type: string
      inventory_anchor_ref:
        description: "Verified independent inventory-anchor sha256 reference"
        required: true
        type: string
      authoritative_denominator:
        description: "Reviewed exact total object count for the complete bucket inventory"
        required: true
        type: number
      plan_only:
        description: "Build canonical evidence only; perform no provider writes"
        required: true
        type: boolean
        default: true
      approved_manifest_sha256:
        description: "Exact reviewed manifest hash; required when plan_only is false"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: sync-geom-to-r2
  cancel-in-progress: false

jobs:
  sync:
    environment: trekdex-r2-release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout the approved commit, detached
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify immutable source identity
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          SOURCE_TREE: ${{ inputs.source_tree }}
        run: |
          set -euo pipefail
          if [[ ! "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::source_sha must be one full lowercase commit SHA"
            exit 1
          fi
          if [[ ! "$SOURCE_TREE" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::source_tree must be one full lowercase tree SHA"
            exit 1
          fi
          if [ "$GITHUB_SHA" != "$SOURCE_SHA" ]; then
            echo "::error::workflow definition ref is not the approved source_sha"
            exit 1
          fi
          git cat-file -e "${SOURCE_SHA}^{commit}"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$SOURCE_TREE"
          if git symbolic-ref -q HEAD; then
            echo "::error::approved source checkout is attached to a mutable ref"
            exit 1
          fi
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          echo "verified detached source commit=$SOURCE_SHA tree=$SOURCE_TREE"

      - name: Build canonical plan and optionally apply the exact reviewed manifest
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ROOT_APPROVAL_ASSERTION_JSON: ${{ secrets.R2_ROOT_APPROVAL_ASSERTION_JSON }}
          R2_ROOT_APPROVAL_HMAC_KEY: ${{ secrets.R2_ROOT_APPROVAL_HMAC_KEY }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          SOURCE_TREE: ${{ inputs.source_tree }}
          ROOT_APPROVAL_REF: ${{ inputs.root_approval_ref }}
          ACCOUNT_IDENTITY_REF: ${{ inputs.account_identity_ref }}
          ENDPOINT_IDENTITY_REF: ${{ inputs.endpoint_identity_ref }}
          INVENTORY_ANCHOR_REF: ${{ inputs.inventory_anchor_ref }}
          AUTHORITATIVE_DENOMINATOR: ${{ inputs.authoritative_denominator }}
          PLAN_ONLY: ${{ inputs.plan_only }}
          APPROVED_MANIFEST_SHA256: ${{ inputs.approved_manifest_sha256 }}
        run: |
          set -euo pipefail
          if [ -z "$R2_ACCOUNT_ID" ] || [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$AWS_SECRET_ACCESS_KEY" ]; then
            echo "::error::required provider identity or credential is unavailable"
            exit 1
          fi
          [[ "$ROOT_APPROVAL_REF" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$ACCOUNT_IDENTITY_REF" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$ENDPOINT_IDENTITY_REF" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$INVENTORY_ANCHOR_REF" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$AUTHORITATIVE_DENOMINATOR" =~ ^[1-9][0-9]*$ ]]

          ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          WORK_ROOT="${RUNNER_TEMP}/trekdex-r2-sync-contract"
          test ! -e "$WORK_ROOT"
          mkdir -m 700 "$WORK_ROOT"
          INVENTORY="$WORK_ROOT/inventory-receipt.json"
          STAGE_ROOT="$WORK_ROOT/stage"
          TERMINAL="$WORK_ROOT/terminal-receipt.json"
          WORKFLOW_SHA256=$(sha256sum .github/workflows/sync-geom-to-r2.yml | awk '{print $1}')

          TRAIL_SEARCH="$WORK_ROOT/trail-search.json"
          PARKING="$WORK_ROOT/parking.json"
          TRAIL_SHAPES="$WORK_ROOT/trail-shapes.json"
          python3 scripts/build-trail-search-index.py --out "$TRAIL_SEARCH"
          python3 scripts/build-parking-pool.py --out "$PARKING" \
            --extra public/areas/parking-pool.json \
            --verdicts public/areas/parking-verdicts.json \
            --add-keeps
          python3 scripts/build-trail-shapes.py --out "$TRAIL_SHAPES"
          test -s ios/SouthMountainExplorer/Resources/areas-index.json
          test -s "$TRAIL_SEARCH"
          test -s "$PARKING"
          test -s "$TRAIL_SHAPES"

          python3 scripts/stage-changed-r2.py fetch-inventory \
            --bucket trekdex-areas \
            --endpoint-url "$ENDPOINT" \
            --account-identity-ref "$ACCOUNT_IDENTITY_REF" \
            --endpoint-identity-ref "$ENDPOINT_IDENTITY_REF" \
            --authoritative-denominator "$AUTHORITATIVE_DENOMINATOR" \
            --area-index public/areas/index.json \
            --anchor-ref "$INVENTORY_ANCHOR_REF" \
            --output "$INVENTORY"

          APPROVED_ARGS=()
          if [ "$PLAN_ONLY" != "true" ]; then
            [[ "$APPROVED_MANIFEST_SHA256" =~ ^[0-9a-f]{64}$ ]]
            APPROVED_ARGS=(--approved-manifest-sha256 "$APPROVED_MANIFEST_SHA256")
          fi
          python3 scripts/stage-changed-r2.py stage \
            --inventory "$INVENTORY" \
            --bucket trekdex-areas \
            --stage-root "$STAGE_ROOT" \
            --global-object "index.json=ios/SouthMountainExplorer/Resources/areas-index.json" \
            --global-object "parking.json=$PARKING" \
            --global-object "trail-search.json=$TRAIL_SEARCH" \
            --global-object "trail-shapes.json=$TRAIL_SHAPES" \
            --source-sha "$SOURCE_SHA" \
            --source-tree "$SOURCE_TREE" \
            --workflow-sha256 "$WORKFLOW_SHA256" \
            --root-approval-ref "$ROOT_APPROVAL_REF" \
            --anchor-ref "$INVENTORY_ANCHOR_REF" \
            "${APPROVED_ARGS[@]}"

          if [ "$PLAN_ONLY" = "true" ]; then
            echo "Plan-only complete: no provider write was attempted."
            exit 0
          fi
          python3 scripts/stage-changed-r2.py apply-manifest \
            --inventory "$INVENTORY" \
            --manifest "$STAGE_ROOT/upload-manifest.json" \
            --approved-manifest-sha256 "$APPROVED_MANIFEST_SHA256" \
            --endpoint-url "$ENDPOINT" \
            --geom-dir public/areas/geom \
            --silhouettes-dir public/areas/silhouettes \
            --area-index public/areas/index.json \
            --global-object "index.json=ios/SouthMountainExplorer/Resources/areas-index.json" \
            --global-object "parking.json=$PARKING" \
            --global-object "trail-search.json=$TRAIL_SEARCH" \
            --global-object "trail-shapes.json=$TRAIL_SHAPES" \
            --workflow .github/workflows/sync-geom-to-r2.yml \
            --terminal-receipt "$TERMINAL"

      - name: Upload exact release contract evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: r2-sync-evidence-${{ inputs.source_sha }}
          path: |
            ${{ runner.temp }}/trekdex-r2-sync-contract/inventory-receipt.json
            ${{ runner.temp }}/trekdex-r2-sync-contract/stage/upload-manifest.json
            ${{ runner.temp }}/trekdex-r2-sync-contract/terminal-receipt.json
          if-no-files-found: warn
          retention-days: 7
