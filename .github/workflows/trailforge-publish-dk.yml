name: Trailforge — publish Danish areas (registry, N per run)

# Registry-driven generalisation of the reviewed exact-Mols path
# (trailforge-publish.yml mols_simple_publish). One job, one Denmark PBF
# download + prefilter + discovery, then every selected area runs the SAME
# exact pipeline in its own work dir (scripts/dk-run-area.sh):
#   discovery check -> AOI cut -> relation-root ledgers -> exact assemble
#   -> exact-boundary publish_areas (--no-elevation, one --only-area per call)
#
# mode=qualify  DRY RUN. Writes nothing to main. Uploads a per-area report
#               artifact (counts, miles, removed categories, full trail names,
#               route segments, computed bbox/centre, dropped multi-stage
#               relations) plus a PROPOSED dk-areas-expected.json and registry
#               bbox/centre. Runs on any branch.
# mode=publish  main only. Needs trailforge/golden/dk-areas-expected.json (the
#               blessed table) and a complete registry entry per area. Refuses
#               unless EVERY selected area matches; one commit of exactly
#               2N+2 paths; NO R2 write (sync-dk-to-r2.yml is separate).
# mode=update   main only. REPUBLISH areas that are already in
#               public/areas/index.json (explicit id list, never batch=; each must
#               also be in the registry and the blessed table; Mols/legacy entries
#               are refused unless the registry sets allow_update: true). Re-runs
#               the exact pipeline, asserts the result against the (re-)blessed
#               table, rewrites ONLY those areas' geom + silhouette and replaces
#               ONLY their rows in both index files in place (row order kept).
#               One commit, only modified paths: the 2N area files + the 2 index
#               files; every other index row byte-identical. NO R2 write; push it
#               with sync-dk-to-r2.yml mode=plan-update / apply-update.
#               To change an area's blessed entry first: run qualify, copy that
#               area's entry from dk-areas-expected.proposed.json into
#               trailforge/golden/dk-areas-expected.json on main, review, merge.
#
# areas: comma list of registry ids, or batch=<n> (n-th chunk, 1-based, of the
#        registry entries not yet in public/areas/index.json).
# chunk_size: default 25, hard max 40 (also the cap on an explicit list).

on:
  workflow_dispatch:
    inputs:
      areas:
        description: "Registry ids (comma list) or batch=<n> (n-th chunk of unpublished registry areas)"
        required: true
      mode:
        description: "qualify (dry run, report only) | publish (main only, new areas) | update (main only, republish existing areas)"
        type: choice
        options: [qualify, publish, update]
        default: qualify
      chunk_size:
        description: "Areas per run (default 25, hard max 40)"
        default: "25"

permissions:
  contents: write

concurrency:
  group: trailforge-publish
  cancel-in-progress: false

jobs:
  dk:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Validate input shape before checkout
        env:
          RAW_AREAS: ${{ inputs.areas }}
          RAW_MODE: ${{ inputs.mode }}
          RAW_CHUNK: ${{ inputs.chunk_size }}
        run: |
          set -euo pipefail
          [[ "$RAW_AREAS" =~ ^(batch=[1-9][0-9]{0,3}|[a-z0-9]+(-[a-z0-9]+)*-dk(,[a-z0-9]+(-[a-z0-9]+)*-dk)*)$ ]]
          [[ "$RAW_MODE" =~ ^(qualify|publish|update)$ ]]
          [[ "$RAW_CHUNK" =~ ^([1-9]|[1-3][0-9]|40)$ ]]
          if [ "$RAW_MODE" = "update" ]; then
            [[ "$RAW_AREAS" != batch=* ]]
          fi
          if [ "$RAW_MODE" != "qualify" ]; then
            test "$GITHUB_REF_TYPE" = "branch"
            test "$GITHUB_REF_NAME" = "main"
          fi

      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Publish guard (main tip is this checkout)
        if: ${{ inputs.mode == 'publish' || inputs.mode == 'update' }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$(git rev-parse HEAD)"
          test -z "$(git status --porcelain)"
          test -f trailforge/golden/dk-areas-expected.json

      - name: Select areas (registry, chunk cap)
        id: select
        env:
          AREAS: ${{ inputs.areas }}
          MODE: ${{ inputs.mode }}
          CHUNK: ${{ inputs.chunk_size }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/dk"
          python3 scripts/dk_publish.py select \
            --areas "$AREAS" --mode "$MODE" --chunk-size "$CHUNK" \
            --out "$RUNNER_TEMP/dk/selected.txt" --github-output "$GITHUB_OUTPUT"

      - name: Install osmium + pyosmium + shapely + Pillow
        run: sudo apt-get update && sudo apt-get install -y osmium-tool python3-pyosmium python3-shapely python3-pil jq

      - name: Download + prefilter Denmark (once)
        env:
          GETID_ARGS: ${{ steps.select.outputs.getid_args }}
        run: |
          set -euo pipefail
          cd trailforge
          mkdir -p data/raw data/aoi data/source
          curl -fL --retry 5 --retry-delay 5 --connect-timeout 20 \
            --speed-limit 2000 --speed-time 30 -o data/raw/denmark.osm.pbf \
            "https://download.geofabrik.de/europe/denmark-latest.osm.pbf"
          ls -lh data/raw/denmark.osm.pbf
          PREFILTER_DK_AREAS=1 bash extract/prefilter.sh data/raw/denmark.osm.pbf data/hiking.osm.pbf
          # Way-backed boundaries (registry way_id) are only kept by the prefilter when their
          # tags happen to match (leisure=park, place=island, boundary=forest, ... are not).
          # Add exactly the selected closed ways (plus their nodes) from the raw file, and only
          # when a way-backed area is selected: every other run keeps the prefilter bytes.
          WAY_IDS="$(printf '%s\n' "$GETID_ARGS" | tr ' ' '\n' | grep -E '^w[1-9][0-9]*$' || true)"
          if [ -n "$WAY_IDS" ]; then
            # shellcheck disable=SC2086
            osmium getid -r --overwrite -o data/way-boundaries.osm.pbf data/raw/denmark.osm.pbf $WAY_IDS
            osmium merge --overwrite -o data/hiking.merged.osm.pbf data/hiking.osm.pbf data/way-boundaries.osm.pbf
            mv data/hiking.merged.osm.pbf data/hiking.osm.pbf
            rm -f data/way-boundaries.osm.pbf
          fi

      - name: Discovery (once) and boundary bbox derivation
        id: prepare
        env:
          MODE: ${{ inputs.mode }}
          GETID_ARGS: ${{ steps.select.outputs.getid_args }}
        run: |
          set -euo pipefail
          W="$RUNNER_TEMP/dk"
          SOURCE_PBF="$GITHUB_WORKSPACE/trailforge/data/raw/denmark.osm.pbf"
          SOURCE_SHA="$(sha256sum "$SOURCE_PBF" | cut -d' ' -f1)"
          python3 scripts/seed-areas.py --dry-run DK \
            --source-pbf "$SOURCE_PBF" --source-pbf-sha256 "$SOURCE_SHA" \
            --discovery-report "$W/discovery-report.json" \
            --pbf-provenance "$W/pbf-provenance.json"
          # One pass over the raw PBF for every selected boundary relation.
          # shellcheck disable=SC2086
          osmium getid -r --overwrite -o "$W/bounds.osm.pbf" "$SOURCE_PBF" $GETID_ARGS
          # update re-runs prepare-areas with the strict (publish) bbox/centre checks.
          PREP_MODE="$MODE"; [ "$MODE" = "update" ] && PREP_MODE=publish
          python3 scripts/dk_publish.py prepare-areas \
            --selected "$W/selected.txt" --bounds-pbf "$W/bounds.osm.pbf" \
            --discovery-report "$W/discovery-report.json" \
            --mode "$PREP_MODE" --out-dir "$W"

      - name: Run the exact pipeline per area (fail closed per area)
        id: areas
        env:
          MODE: ${{ inputs.mode }}
        run: |
          set -uo pipefail
          # GitHub runs this step as `bash -e`: without this, one failing
          # area would kill the step before mark-failed / continue and the
          # remaining areas would never run. Failure stays fail-closed via
          # FAILED=1 and the publish refusal below.
          set +e
          W="$RUNNER_TEMP/dk"
          FAILED=0
          for ID in $(cat "$W/selected.txt"); do
            A="$W/$ID"
            echo "::group::$ID"
            if [ "$(jq -r .status "$A/area.json")" != "ok" ]; then
              python3 scripts/dk_publish.py mark-failed --area-id "$ID" --stage prepare \
                --area-json "$A/area.json" --out "$A/report.json"
              FAILED=1; echo "::endgroup::"; continue
            fi
            NAME="$(jq -r .name "$A/area.json")"
            REL="$(jq -r '.relation_id // empty' "$A/area.json")"
            WAY="$(jq -r '.way_id // empty' "$A/area.json")"
            BBOX="$(jq -r .bbox_arg "$A/area.json")"
            ( set -euo pipefail
              AREA_ID="$ID" AREA_NAME="$NAME" RELATION_ID="$REL" WAY_ID="$WAY" BBOX="$BBOX" W="$W" \
                bash scripts/dk-run-area.sh ) 2>&1 | tee "$W/$ID.log"
            if [ "${PIPESTATUS[0]}" -ne 0 ]; then
              python3 scripts/dk_publish.py mark-failed --area-id "$ID" --stage pipeline \
                --area-json "$A/area.json" --out "$A/report.json"
              FAILED=1; echo "::endgroup::"; continue
            fi
            python3 scripts/dk_publish.py report-area \
              --area-json "$A/area.json" --geom "$A/geom/$ID.json" \
              --trails-geojson "$A/trails.geojson" --removed-geojson "$A/removed.geojson" \
              --assembly-json "$A/assembly.json" --out "$A/report.json" || FAILED=1
            if [ "$MODE" != "qualify" ]; then
              python3 scripts/dk_publish.py assert-expected --geom "$A/geom/$ID.json" --area-id "$ID" || {
                python3 scripts/dk_publish.py mark-failed --area-id "$ID" --stage blessed-table \
                  --area-json "$A/area.json" --out "$A/report.json"
                FAILED=1; }
            fi
            echo "::endgroup::"
          done
          echo "failed=$FAILED" >> "$GITHUB_OUTPUT"
          # publish/update: any failed area aborts before the repo is touched.
          if [ "$MODE" != "qualify" ] && [ "$FAILED" -ne 0 ]; then
            echo "REFUSED: at least one selected area is not the blessed result; nothing committed"
            exit 1
          fi
          exit 0

      - name: Qualify report + proposed tables
        if: ${{ always() && inputs.mode == 'qualify' }}
        run: |
          set +e
          W="$RUNNER_TEMP/dk"
          mkdir -p "$W/qualify"
          python3 scripts/dk_publish.py qualify-aggregate \
            --reports-dir "$W" --out-dir "$W/qualify"
          cat "$W/qualify/qualify-report.md" >> "$GITHUB_STEP_SUMMARY" 2>/dev/null
          exit 0

      - name: Upload qualify / publish evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: dk-${{ inputs.mode }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/dk
            !${{ runner.temp }}/dk/**/*.pbf
          retention-days: 30
          if-no-files-found: warn

      - name: Fail the qualify run if any area failed
        if: ${{ inputs.mode == 'qualify' }}
        env:
          FAILED: ${{ steps.areas.outputs.failed }}
        run: test "${FAILED:-1}" = "0"

      - name: Install blessed geoms, append index rows, regenerate silhouettes + bundle
        if: ${{ inputs.mode == 'publish' }}
        run: |
          set -euo pipefail
          W="$RUNNER_TEMP/dk"
          for ID in $(cat "$W/selected.txt"); do
            test ! -e "public/areas/geom/$ID.json"
            cp "$W/$ID/geom/$ID.json" "public/areas/geom/$ID.json"
          done
          python3 scripts/dk_publish.py merge-index \
            --selected "$W/selected.txt" --rows-dir "$W" \
            --geom-dir public/areas/geom --target public/areas/index.json
          python3 scripts/silhouettes-from-geom.py
          python3 scripts/filter-ios-bundle.py

      - name: Install updated geoms, replace index rows in place, regenerate silhouettes + bundle
        if: ${{ inputs.mode == 'update' }}
        run: |
          set -euo pipefail
          W="$RUNNER_TEMP/dk"
          for ID in $(cat "$W/selected.txt"); do
            test -f "public/areas/geom/$ID.json"
            test -f "public/areas/silhouettes/$ID.json"
            cp "$W/$ID/geom/$ID.json" "public/areas/geom/$ID.json"
          done
          python3 scripts/dk_publish.py replace-index \
            --selected "$W/selected.txt" --rows-dir "$W" \
            --geom-dir public/areas/geom --target public/areas/index.json
          python3 scripts/silhouettes-from-geom.py
          python3 scripts/filter-ios-bundle.py

      - name: Commit published data (publish exactly 2N+2 paths; update only modified 2N+2 paths) and push to main
        if: ${{ inputs.mode == 'publish' || inputs.mode == 'update' }}
        env:
          MODE: ${{ inputs.mode }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_TERMINAL_PROMPT: "0"
          AREA_IDS: ${{ steps.select.outputs.area_ids }}
          AREA_COUNT: ${{ steps.select.outputs.area_count }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF_TYPE" = "branch"
          test "$GITHUB_REF_NAME" = "main"
          git config user.name "trailforge-bot"
          git config user.email "actions@users.noreply.github.com"
          W="$RUNNER_TEMP/dk"
          git add public/areas ios/SouthMountainExplorer/Resources/areas-index.json
          python3 scripts/dk_publish.py verify-staged --repo "$GITHUB_WORKSPACE" \
            --areas "$AREA_IDS" --mode "$MODE" --output "$W/staged-diff-receipt.json"
          if git diff --cached --quiet; then
            echo "No data changes to commit."; exit 1
          fi
          if [ "$MODE" = "update" ]; then
            git commit -m "trailforge: update ${AREA_COUNT} Danish area(s) in app" -m "areas: ${AREA_IDS}"
          else
            git commit -m "trailforge: publish ${AREA_COUNT} Danish area(s) to app" -m "areas: ${AREA_IDS}"
          fi
          git config --local credential.https://github.com.helper '!gh auth git-credential'
          python3 scripts/dk_publish.py verify-commit --repo "$GITHUB_WORKSPACE" \
            --areas "$AREA_IDS" --mode "$MODE" --output "$W/commit-diff-receipt.json"
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$(git rev-parse HEAD^)"
          git push
          git config --local --unset-all credential.https://github.com.helper || true
          echo "pushed $(git rev-parse HEAD) tree $(git rev-parse 'HEAD^{tree}')"
          echo "Commit pushed to main only. Dispatch sync-dk-to-r2.yml (mode=plan, or plan-update after an update) separately."
