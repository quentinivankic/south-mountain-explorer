name: Trailforge — publish a state to the app

# Runs the whole trailforge pipeline in the cloud (no homelab): download a
# Geofabrik extract -> prefilter -> assemble statewide with per-area merge ->
# batch-publish each app area (clip to boundary, convert, VALIDATE) into
# public/areas/geom + bump the index, then trigger the R2 sync.
#
# State-scale only (fits the 16 GB runner; planet still needs the homelab).
# Default is a DRY RUN — it reports what would publish and writes nothing, so
# you can review before committing anything to production.

on:
  workflow_dispatch:
    inputs:
      extract:
        description: "Geofabrik extract path (no -latest suffix)"
        default: "north-america/us/arizona"
      state:
        description: "Index 'state' whose areas to publish"
        default: "Arizona"
      dry_run:
        description: "Preview only — report matches, write/publish nothing"
        type: boolean
        default: true
      no_routes:
        description: "Drop thru-routes (Maricopa, AZ Trail) from the checklist"
        type: boolean
        default: false
      touch_report:
        description: "Diagnostic: report trails that TOUCH each area but aren't published (keep-whole gain). Writes nothing."
        type: boolean
        default: false
      elevation:
        description: "Bake DEM elevation gain + gain-aware difficulty into the geom while publishing (durable across republishes). Uncheck only to skip sampling."
        type: boolean
        default: true
      region_code:
        description: "Optional assemble --region 2-letter code, e.g. dk. Leave empty for US states."
        default: ""
      pilot_area_id:
        description: "Opt into the read-only Mols Bjerge QA pilot"
        default: ""
      pilot_bbox:
        description: "Exact padded bbox required by the Mols Bjerge QA pilot or signed publication"
        default: ""
      mols_release_input_receipt_b64:
        description: "Canonical signed exact-Mols release-input receipt; blank preserves generic US publication"
        default: ""
      mols_simple_publish:
        description: "Exact-Mols publication WITHOUT a signed receipt (same pinned inputs and staged-diff guards). Commits to main only; R2 is a separate sync-mols-to-r2.yml dispatch."
        type: boolean
        default: false

concurrency:
  group: trailforge-publish
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ github.event.inputs.pilot_area_id == '' }}
    permissions:
      contents: write
      actions: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Validate publication input shape before secrets
        id: input_shape
        env:
          RAW_EXTRACT: ${{ inputs.extract }}
          RAW_STATE: ${{ inputs.state }}
          RAW_DRY_RUN: ${{ inputs.dry_run }}
          RAW_NO_ROUTES: ${{ inputs.no_routes }}
          RAW_TOUCH_REPORT: ${{ inputs.touch_report }}
          RAW_ELEVATION: ${{ inputs.elevation }}
          RAW_REGION_CODE: ${{ inputs.region_code }}
          RAW_PILOT_AREA_ID: ${{ inputs.pilot_area_id }}
          RAW_PILOT_BBOX: ${{ inputs.pilot_bbox }}
          RAW_MOLS_RELEASE_INPUT_RECEIPT_B64: ${{ inputs.mols_release_input_receipt_b64 }}
          RAW_MOLS_SIMPLE: ${{ inputs.mols_simple_publish }}
        run: |
          set -euo pipefail
          [[ "$RAW_EXTRACT" =~ ^[a-z0-9]+(-[a-z0-9]+)*(/[a-z0-9]+(-[a-z0-9]+)*)*$ ]]
          [[ "$RAW_STATE" =~ ^[A-Za-z]+([\ -][A-Za-z]+)*$ ]]
          [[ -z "$RAW_REGION_CODE" || "$RAW_REGION_CODE" =~ ^[a-z]{2}$ ]]
          [[ -z "$RAW_PILOT_AREA_ID" || "$RAW_PILOT_AREA_ID" =~ ^[a-z0-9]+(-[a-z0-9]+)*$ ]]
          [[ -z "$RAW_PILOT_BBOX" || "$RAW_PILOT_BBOX" =~ ^-?[0-9]+(\.[0-9]+)?,-?[0-9]+(\.[0-9]+)?,-?[0-9]+(\.[0-9]+)?,-?[0-9]+(\.[0-9]+)?$ ]]
          for value in "$RAW_DRY_RUN" "$RAW_NO_ROUTES" "$RAW_TOUCH_REPORT" "$RAW_ELEVATION"; do
            [[ "$value" = "true" || "$value" = "false" ]]
          done
          [[ "$RAW_MOLS_SIMPLE" = "true" || "$RAW_MOLS_SIMPLE" = "false" ]]
          RELEASE_MODE=generic
          if [ -n "$RAW_MOLS_RELEASE_INPUT_RECEIPT_B64" ] || [ "$RAW_MOLS_SIMPLE" = "true" ]; then
            if [ -n "$RAW_MOLS_RELEASE_INPUT_RECEIPT_B64" ]; then
              # A receipt and the simple flag are mutually exclusive.
              test "$RAW_MOLS_SIMPLE" = "false"
              test "${#RAW_MOLS_RELEASE_INPUT_RECEIPT_B64}" -le 16384
              [[ "$RAW_MOLS_RELEASE_INPUT_RECEIPT_B64" =~ ^[A-Za-z0-9+/]+={0,2}$ ]]
              test "$(( ${#RAW_MOLS_RELEASE_INPUT_RECEIPT_B64} % 4 ))" -eq 0
            fi
            test "$GITHUB_REF_TYPE" = "branch"
            test "$GITHUB_REF_NAME" = "main"
            test "$RAW_EXTRACT" = "europe/denmark"
            test "$RAW_STATE" = "Denmark"
            test "$RAW_REGION_CODE" = "dk"
            test "$RAW_PILOT_BBOX" = "10.40,56.08,10.90,56.35"
            test "$RAW_PILOT_AREA_ID" = ""
            test "$RAW_DRY_RUN" = "false"
            test "$RAW_NO_ROUTES" = "false"
            test "$RAW_TOUCH_REPORT" = "false"
            test "$RAW_ELEVATION" = "false"
            RELEASE_MODE=mols
          else
            test "$RAW_STATE" != "Denmark"
            test "$RAW_REGION_CODE" != "dk"
          fi
          {
            printf 'extract=%s\n' "$RAW_EXTRACT"
            printf 'state=%s\n' "$RAW_STATE"
            printf 'dry_run=%s\n' "$RAW_DRY_RUN"
            printf 'no_routes=%s\n' "$RAW_NO_ROUTES"
            printf 'touch_report=%s\n' "$RAW_TOUCH_REPORT"
            printf 'elevation=%s\n' "$RAW_ELEVATION"
            printf 'region_code=%s\n' "$RAW_REGION_CODE"
            printf 'pilot_area_id=%s\n' "$RAW_PILOT_AREA_ID"
            printf 'pilot_bbox=%s\n' "$RAW_PILOT_BBOX"
            printf 'mols_release_input_receipt_b64=%s\n' "$RAW_MOLS_RELEASE_INPUT_RECEIPT_B64"
            printf 'release_mode=%s\n' "$RELEASE_MODE"
            printf 'mols_simple=%s\n' "$RAW_MOLS_SIMPLE"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify canonical Mols release input after shape validation
        id: release_input
        if: ${{ steps.input_shape.outputs.release_mode == 'mols' }}
        env:
          MOLS_RELEASE_INPUT_RECEIPT_B64: ${{ steps.input_shape.outputs.mols_release_input_receipt_b64 }}
          PUBLISH_EXTRACT: ${{ steps.input_shape.outputs.extract }}
          PUBLISH_STATE: ${{ steps.input_shape.outputs.state }}
          PUBLISH_DRY_RUN: ${{ steps.input_shape.outputs.dry_run }}
          PUBLISH_NO_ROUTES: ${{ steps.input_shape.outputs.no_routes }}
          PUBLISH_TOUCH_REPORT: ${{ steps.input_shape.outputs.touch_report }}
          PUBLISH_ELEVATION: ${{ steps.input_shape.outputs.elevation }}
          PUBLISH_REGION_CODE: ${{ steps.input_shape.outputs.region_code }}
          PUBLISH_PILOT_AREA_ID: ${{ steps.input_shape.outputs.pilot_area_id }}
          PUBLISH_PILOT_BBOX: ${{ steps.input_shape.outputs.pilot_bbox }}
          MOLS_SIMPLE: ${{ steps.input_shape.outputs.mols_simple }}
          R2_ROOT_APPROVAL_HMAC_KEY: ${{ secrets.R2_ROOT_APPROVAL_HMAC_KEY }}
        run: |
          set -euo pipefail
          if [ "$MOLS_SIMPLE" = "true" ]; then
            # Unsigned path: fixed-identity check only, no receipt, no HMAC.
            python3 scripts/simple_mols_publish.py prepare-input \
              --extract "$PUBLISH_EXTRACT" \
              --state "$PUBLISH_STATE" \
              --region-code "$PUBLISH_REGION_CODE" \
              --bbox "$PUBLISH_PILOT_BBOX" \
              --dry-run "$PUBLISH_DRY_RUN" \
              --no-routes "$PUBLISH_NO_ROUTES" \
              --touch-report "$PUBLISH_TOUCH_REPORT" \
              --elevation "$PUBLISH_ELEVATION" \
              --pilot-area-id "$PUBLISH_PILOT_AREA_ID" \
              --workflow-source-sha "$GITHUB_SHA" \
              --mols-index-output "$RUNNER_TEMP/mols-release-index.json" \
              --github-output "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 scripts/stage-changed-r2.py verify-release-input \
            --extract "$PUBLISH_EXTRACT" \
            --state "$PUBLISH_STATE" \
            --region-code "$PUBLISH_REGION_CODE" \
            --bbox "$PUBLISH_PILOT_BBOX" \
            --dry-run "$PUBLISH_DRY_RUN" \
            --no-routes "$PUBLISH_NO_ROUTES" \
            --touch-report "$PUBLISH_TOUCH_REPORT" \
            --elevation "$PUBLISH_ELEVATION" \
            --pilot-area-id "$PUBLISH_PILOT_AREA_ID" \
            --workflow-source-sha "$GITHUB_SHA" \
            --workflow-source-tree "$(git rev-parse 'HEAD^{tree}')" \
            --mols-index-output "$RUNNER_TEMP/mols-release-index.json" \
            --github-output "$GITHUB_OUTPUT"

      - name: Install osmium + pyosmium + shapely + Pillow
        run: sudo apt-get update && sudo apt-get install -y osmium-tool python3-pyosmium python3-shapely python3-pil

      - name: Download + prefilter extract
        env:
          PUBLISH_EXTRACT: ${{ steps.input_shape.outputs.extract }}
        run: |
          set -e
          cd trailforge
          mkdir -p data/raw data/aoi
          F="data/raw/$(basename "$PUBLISH_EXTRACT").osm.pbf"
          echo "Downloading validated extract ..."
          curl -fL --retry 5 --retry-delay 5 --connect-timeout 20 \
            --speed-limit 2000 --speed-time 30 -o "$F" \
            "https://download.geofabrik.de/${PUBLISH_EXTRACT}-latest.osm.pbf"
          ls -lh "$F"
          bash extract/prefilter.sh "$F" data/hiking.osm.pbf

      - name: Assemble (statewide, per-area merge)
        env:
          PUBLISH_REGION_CODE: ${{ steps.input_shape.outputs.region_code }}
        run: |
          set -e
          cd trailforge
          # Pass --region ONLY when region_code is set, so existing US-state
          # dispatches (empty region_code) retain the same command behavior.
          REGION_FLAG=()
          if [ -n "$PUBLISH_REGION_CODE" ]; then
            REGION_FLAG=(--region "$PUBLISH_REGION_CODE")
          fi
          python3 assemble/assemble.py --in data/hiking.osm.pbf \
            --out data/aoi/state.trails.geojson --min-length-mi 0.1 --per-area-merge \
            "${REGION_FLAG[@]}"

      - name: Publish areas (clip + convert + validate)
        env:
          PUBLISH_STATE: ${{ steps.input_shape.outputs.state }}
          PUBLISH_DRY_RUN: ${{ steps.input_shape.outputs.dry_run }}
          PUBLISH_NO_ROUTES: ${{ steps.input_shape.outputs.no_routes }}
          PUBLISH_TOUCH_REPORT: ${{ steps.input_shape.outputs.touch_report }}
          PUBLISH_ELEVATION: ${{ steps.input_shape.outputs.elevation }}
          RELEASE_MODE: ${{ steps.input_shape.outputs.release_mode }}
          VERIFIED_AREA_ID: ${{ steps.release_input.outputs.area_id }}
          VERIFIED_INDEX_PATH: ${{ steps.release_input.outputs.publication_index_path }}
        run: |
          set -e
          cd trailforge
          FLAGS=()
          INDEX_PATH="../public/areas/index.json"
          ONLY_AREA=()
          [ "$PUBLISH_DRY_RUN" = "true" ] && FLAGS+=(--dry-run)
          [ "$PUBLISH_NO_ROUTES" = "true" ] && FLAGS+=(--no-routes)
          [ "$PUBLISH_TOUCH_REPORT" = "true" ] && FLAGS+=(--touch-report)
          [ "$PUBLISH_ELEVATION" = "true" ] && FLAGS+=(--elevation)
          if [ "$RELEASE_MODE" = "mols" ]; then
            test "$VERIFIED_AREA_ID" = "nationalpark-mols-bjerge-dk"
            test -f "$VERIFIED_INDEX_PATH"
            INDEX_PATH="$VERIFIED_INDEX_PATH"
            ONLY_AREA=(--only-area "$VERIFIED_AREA_ID")
          fi
          # Read the MASTER index (every seeded state) so a not-yet-bundled
          # state has areas to fill; publish_areas updates its counts in place.
          python3 serve/publish_areas.py \
            --trails data/aoi/state.trails.geojson --hiking data/hiking.osm.pbf \
            --state "$PUBLISH_STATE" \
            --index "$INDEX_PATH" \
            --out-dir ../public/areas/geom "${ONLY_AREA[@]}" "${FLAGS[@]}"

      - name: Merge signed Mols row into canonical master index
        if: ${{ steps.input_shape.outputs.dry_run == 'false' && steps.input_shape.outputs.release_mode == 'mols' }}
        env:
          RELEASE_INPUT_RECEIPT_SHA256: ${{ steps.release_input.outputs.receipt_sha256 }}
          VERIFIED_INDEX_PATH: ${{ steps.release_input.outputs.publication_index_path }}
        run: |
          set -euo pipefail
          python3 scripts/stage-changed-r2.py merge-mols-index \
            --source "$VERIFIED_INDEX_PATH" \
            --target public/areas/index.json \
            --expected-receipt-sha256 "$RELEASE_INPUT_RECEIPT_SHA256"

      - name: Regenerate silhouettes from the clean geom (Explore/Browse art)
        if: ${{ steps.input_shape.outputs.dry_run == 'false' }}
        run: python3 scripts/silhouettes-from-geom.py

      - name: Regenerate app bundle (only areas with clean trailforge geom)
        if: ${{ steps.input_shape.outputs.dry_run == 'false' }}
        run: python3 scripts/filter-ios-bundle.py

      - name: Commit published data and seal pushed identity
        id: published_commit
        if: ${{ steps.input_shape.outputs.dry_run == 'false' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_TERMINAL_PROMPT: "0"
          PUBLISH_STATE: ${{ steps.input_shape.outputs.state }}
          RELEASE_MODE: ${{ steps.input_shape.outputs.release_mode }}
          RELEASE_INPUT_RECEIPT_SHA256: ${{ steps.release_input.outputs.receipt_sha256 }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF_TYPE" = "branch"
          test "$GITHUB_REF_NAME" = "main"
          git config user.name "trailforge-bot"
          git config user.email "actions@users.noreply.github.com"
          # public/areas covers geom + the master index; the bundle is the app's.
          git add public/areas ios/SouthMountainExplorer/Resources/areas-index.json
          if [ "$RELEASE_MODE" = "mols" ]; then
            [[ "$RELEASE_INPUT_RECEIPT_SHA256" =~ ^[0-9a-f]{64}$ ]]
            python3 scripts/stage-changed-r2.py verify-mols-staged-diff \
              --repo "$GITHUB_WORKSPACE" \
              --expected-receipt-sha256 "$RELEASE_INPUT_RECEIPT_SHA256" \
              --output "$RUNNER_TEMP/mols-staged-diff-receipt.json"
          fi
          if git diff --cached --quiet; then
            echo "No data changes to commit."
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "trailforge: publish ${PUBLISH_STATE} areas to app"

          git config --local credential.https://github.com.helper '!gh auth git-credential'
          trap 'git config --local --unset-all credential.https://github.com.helper || true' EXIT

          if [ "$RELEASE_MODE" = "mols" ]; then
            python3 scripts/stage-changed-r2.py verify-mols-commit \
              --repo "$GITHUB_WORKSPACE" \
              --expected-receipt-sha256 "$RELEASE_INPUT_RECEIPT_SHA256" \
              --output "$RUNNER_TEMP/mols-commit-diff-receipt.json"
            git fetch --no-tags origin main
            test "$(git rev-parse origin/main)" = "$(git rev-parse HEAD^)"
            git push
          else
            # Preserve the existing generic state retry behavior. This branch
            # never carries Mols publication authority.
            pushed=false
            for i in 1 2 3 4 5; do
              if git push; then
                pushed=true
                break
              fi
              echo "push rejected (attempt $i) — rebasing on latest main"
              git pull --rebase origin main || { git rebase --abort || true; exit 1; }
            done
            test "$pushed" = "true"
          fi
          SOURCE_SHA="$(git rev-parse HEAD)"
          SOURCE_TREE="$(git rev-parse 'HEAD^{tree}')"
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$SOURCE_TREE" =~ ^[0-9a-f]{40}$ ]]
          echo "published=true" >> "$GITHUB_OUTPUT"
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "source_tree=$SOURCE_TREE" >> "$GITHUB_OUTPUT"
          echo "sealed pushed commit=$SOURCE_SHA tree=$SOURCE_TREE"

      - name: Dispatch exact plan-only R2 sync and stop for manifest review
        if: ${{ steps.input_shape.outputs.dry_run == 'false' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_MODE: ${{ steps.input_shape.outputs.release_mode }}
          PUBLISHED: ${{ steps.published_commit.outputs.published }}
          SOURCE_SHA: ${{ steps.published_commit.outputs.source_sha }}
          SOURCE_TREE: ${{ steps.published_commit.outputs.source_tree }}
          ROOT_APPROVAL_REF: ${{ steps.release_input.outputs.root_approval_ref }}
          ACCOUNT_IDENTITY_REF: ${{ steps.release_input.outputs.account_identity_ref }}
          ENDPOINT_IDENTITY_REF: ${{ steps.release_input.outputs.endpoint_identity_ref }}
          INVENTORY_ANCHOR_REF: ${{ steps.release_input.outputs.inventory_anchor_ref }}
          AUTHORITATIVE_DENOMINATOR: ${{ steps.release_input.outputs.authoritative_denominator }}
          MOLS_SIMPLE: ${{ steps.input_shape.outputs.mols_simple }}
        run: |
          set -euo pipefail
          if [ "$MOLS_SIMPLE" = "true" ]; then
            echo "Simple Mols publish: commit pushed to main only. Dispatch sync-mols-to-r2.yml separately."
            exit 0
          fi
          if [ "$PUBLISHED" != "true" ] || [ "$RELEASE_MODE" != "mols" ]; then
            echo "No pushed verified Mols publication commit; R2 plan dispatch skipped."
            exit 0
          fi
          [[ "$ROOT_APPROVAL_REF" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$ACCOUNT_IDENTITY_REF" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$ENDPOINT_IDENTITY_REF" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$INVENTORY_ANCHOR_REF" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$AUTHORITATIVE_DENOMINATOR" =~ ^[1-9][0-9]*$ ]]
          # This chained dispatch is always evidence-only. A separate reviewed
          # manual dispatch supplies approved_manifest_sha256 with plan_only=false.
          gh workflow run sync-geom-to-r2.yml --ref main \
            -f source_sha="$SOURCE_SHA" \
            -f source_tree="$SOURCE_TREE" \
            -f root_approval_ref="$ROOT_APPROVAL_REF" \
            -f account_identity_ref="$ACCOUNT_IDENTITY_REF" \
            -f endpoint_identity_ref="$ENDPOINT_IDENTITY_REF" \
            -f inventory_anchor_ref="$INVENTORY_ANCHOR_REF" \
            -f authoritative_denominator="$AUTHORITATIVE_DENOMINATOR" \
            -f plan_only=true

  pilot:
    if: ${{ github.event.inputs.pilot_area_id != '' }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PILOT_EXTRACT: ${{ github.event.inputs.extract }}
      PILOT_STATE: ${{ github.event.inputs.state }}
      PILOT_DRY_RUN: ${{ github.event.inputs.dry_run }}
      PILOT_NO_ROUTES: ${{ github.event.inputs.no_routes }}
      PILOT_TOUCH_REPORT: ${{ github.event.inputs.touch_report }}
      PILOT_ELEVATION: ${{ github.event.inputs.elevation }}
      PILOT_REGION_CODE: ${{ github.event.inputs.region_code }}
      PILOT_AREA_ID: ${{ github.event.inputs.pilot_area_id }}
      PILOT_BBOX: ${{ github.event.inputs.pilot_bbox }}
      PILOT_EXPECTED_RELATION_ID: "7046785"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Initialize runner-local QA directories
        shell: bash
        run: |
          set -euo pipefail
          WORK_ROOT="$(mktemp -d "${RUNNER_TEMP:?}/mols-bjerge-work.XXXXXX")"
          QA_ROOT="$(mktemp -d "${RUNNER_TEMP:?}/mols-bjerge-qa.XXXXXX")"
          export PILOT_WORK_ROOT="$WORK_ROOT"
          export PILOT_QA_ROOT="$QA_ROOT"
          export PILOT_REPO="$WORK_ROOT/repo"
          export PILOT_INDEX="$WORK_ROOT/mols-index.json"
          export PILOT_SCOPE_TRUST="$WORK_ROOT/scope-trust.json"
          {
            echo "PILOT_WORK_ROOT=$PILOT_WORK_ROOT"
            echo "PILOT_QA_ROOT=$PILOT_QA_ROOT"
            echo "PILOT_REPO=$PILOT_REPO"
            echo "PILOT_INDEX=$PILOT_INDEX"
            echo "PILOT_SCOPE_TRUST=$PILOT_SCOPE_TRUST"
          } >> "$GITHUB_ENV"
          mkdir -p \
            "$PILOT_QA_ROOT/data/aoi" \
            "$PILOT_QA_ROOT/data/source" \
            "$PILOT_QA_ROOT/discovery" \
            "$PILOT_QA_ROOT/golden" \
            "$PILOT_QA_ROOT/reports" \
            "$PILOT_QA_ROOT/validation" \
            "$PILOT_QA_ROOT/viewer" \
            "$PILOT_QA_ROOT/visual"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["PILOT_QA_ROOT"])
          inputs = {
              "extract": os.environ["PILOT_EXTRACT"],
              "state": os.environ["PILOT_STATE"],
              "dry_run": os.environ["PILOT_DRY_RUN"],
              "no_routes": os.environ["PILOT_NO_ROUTES"],
              "touch_report": os.environ["PILOT_TOUCH_REPORT"],
              "elevation": os.environ["PILOT_ELEVATION"],
              "region_code": os.environ["PILOT_REGION_CODE"],
              "pilot_area_id": os.environ["PILOT_AREA_ID"],
              "pilot_bbox": os.environ["PILOT_BBOX"],
              "expected_osm_relation_id": os.environ["PILOT_EXPECTED_RELATION_ID"],
          }
          manifest = {
              "schema_version": 1,
              "branch_ref": os.environ["GITHUB_REF_NAME"],
              "source_sha": os.environ["GITHUB_SHA"],
              "inputs": inputs,
              "visual_review_url": "http://127.0.0.1:8000/viewer/?aoi=mols-bjerge",
              "attribution": "© OpenStreetMap contributors",
          }
          (root / "manifest.json").write_text(
              json.dumps(manifest, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )
          (root / "README.md").write_text(
              "# Nationalpark Mols Bjerge runner-local QA\n\n"
              "No persistent or live data was written. A completed package "
              "includes sealed raw-Denmark authority, full-prefilter witness, "
              "and AOI render-scope relation ledgers plus the compact AOI PBF, "
              "exact app preview, validation-only golden record, and a "
              "network-free SVG. Download this artifact, start its loopback-only "
              "viewer (bound only to 127.0.0.1) by running "
              "`python3 viewer/serve.py` from any directory, and open "
              "http://127.0.0.1:8000/viewer/?aoi=mols-bjerge.\n\n"
              "Dispatch inputs:\n```json\n"
              + json.dumps(inputs, indent=2)
              + "\n```\n\n© OpenStreetMap contributors\n",
              encoding="utf-8",
          )
          PY

      - name: Validate exact pilot inputs
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee "$PILOT_QA_ROOT/reports/input-validation.log") 2>&1
          [[ "$GITHUB_REF_NAME" == "chat/denmark-trails" ]]
          [[ "$PILOT_DRY_RUN" == "true" ]]
          [[ "$PILOT_STATE" == "Denmark" ]]
          [[ "$PILOT_REGION_CODE" == "dk" ]]
          [[ "$PILOT_EXTRACT" == "europe/denmark" ]]
          [[ "$PILOT_NO_ROUTES" == "false" ]]
          [[ "$PILOT_TOUCH_REPORT" == "false" ]]
          [[ "$PILOT_ELEVATION" == "false" ]]
          [[ "$PILOT_AREA_ID" == "nationalpark-mols-bjerge-dk" ]]
          [[ "$PILOT_BBOX" == "10.40,56.08,10.90,56.35" ]]
          [[ "$PILOT_EXPECTED_RELATION_ID" =~ ^[0-9]+$ ]]
          [[ "$PILOT_EXPECTED_RELATION_ID" != "0" ]]
          SEED_CODE="${PILOT_REGION_CODE^^}"
          [[ "$SEED_CODE" == "DK" ]]
          echo "PILOT_SEED_CODE=$SEED_CODE" >> "$GITHUB_ENV"
          echo "Validated read-only Mols Bjerge pilot inputs."

      - name: Materialize tracked HEAD in runner-local work area
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$PILOT_REPO"
          git archive HEAD | tar -x -C "$PILOT_REPO"
          test -f "$PILOT_REPO/scripts/seed-areas.py"
          test -f "$PILOT_REPO/scripts/_pbf_discovery.py"
          test -f "$PILOT_REPO/trailforge/tools/build_pbf_receipt.py"
          test -f "$PILOT_REPO/trailforge/tools/build_relation_slice.py"
          test -f "$PILOT_REPO/trailforge/tools/export_relation_members.py"
          test -f "$PILOT_REPO/trailforge/tools/export_way_topology.py"
          test -f "$PILOT_REPO/trailforge/tools/validate_publish_pilot.py"

      - name: Install osmium + pyosmium + shapely + Pillow
        run: sudo apt-get update && sudo apt-get install -y osmium-tool python3-pyosmium python3-shapely python3-pil

      - name: Download and prefilter Denmark
        id: prefilter_source
        shell: bash
        run: |
          set -euo pipefail
          cd "$PILOT_REPO/trailforge"
          mkdir -p data/raw data/aoi
          curl -fL --retry 5 --retry-delay 5 --connect-timeout 20 \
            --speed-limit 2000 --speed-time 30 \
            -o data/raw/denmark.osm.pbf \
            "https://download.geofabrik.de/europe/denmark-latest.osm.pbf"
          RECEIPT_PARENT_LABEL=data/raw/denmark.osm.pbf \
          RECEIPT_OUTPUT_LABEL=data/hiking.osm.pbf \
          RECEIPT_GITHUB_OUTPUT="$GITHUB_OUTPUT" \
            bash extract/prefilter.sh \
              data/raw/denmark.osm.pbf data/hiking.osm.pbf \
              "$PILOT_QA_ROOT/data/source/mols-bjerge.prefilter-transformation.json"

      - name: Discover and verify exact Mols relation
        shell: bash
        env:
          PILOT_SOURCE_PBF_SHA256: ${{ steps.prefilter_source.outputs.input_sha256 }}
        run: |
          set -euo pipefail
          cd "$PILOT_REPO"
          [[ "$PILOT_SOURCE_PBF_SHA256" =~ ^[0-9a-f]{64}$ ]]
          SOURCE_PBF="$PILOT_REPO/trailforge/data/raw/denmark.osm.pbf"
          if ! python3 scripts/seed-areas.py \
            --dry-run "$PILOT_SEED_CODE" \
            --source-pbf "$SOURCE_PBF" \
            --source-pbf-sha256 "$PILOT_SOURCE_PBF_SHA256" \
            --discovery-report "$PILOT_QA_ROOT/discovery/report.json" \
            --pbf-provenance \
              "$PILOT_QA_ROOT/discovery/pbf-provenance.json" \
            > "$PILOT_QA_ROOT/discovery/discovery.log" 2>&1; then
            cat "$PILOT_QA_ROOT/discovery/discovery.log"
            exit 1
          fi
          cat "$PILOT_QA_ROOT/discovery/discovery.log"
          python3 trailforge/tools/validate_publish_pilot.py discovery \
            --discovery-report "$PILOT_QA_ROOT/discovery/report.json" \
            --pbf-provenance \
              "$PILOT_QA_ROOT/discovery/pbf-provenance.json" \
            --source-pbf "$SOURCE_PBF" \
            --expected-osm-relation-id "$PILOT_EXPECTED_RELATION_ID" \
            --selected-record-out "$PILOT_QA_ROOT/discovery/selected.json" \
            --index-out "$PILOT_INDEX" \
            --result-json "$PILOT_QA_ROOT/discovery/validation.json" \
            2>&1 | tee "$PILOT_QA_ROOT/discovery/validation.log"
          AREA_NAME="$(python3 -c \
            'import json,sys; print(json.load(open(sys.argv[1]))["index_row"][1])' \
            "$PILOT_QA_ROOT/discovery/selected.json")"
          [[ "$AREA_NAME" == "Nationalpark Mols Bjerge" ]]
          echo "PILOT_AREA_NAME=$AREA_NAME" >> "$GITHUB_ENV"

      - name: Cut and seal padded Mols AOI
        id: aoi_scope
        shell: bash
        run: |
          set -euo pipefail
          cd "$PILOT_REPO/trailforge"
          HIKING=data/hiking.osm.pbf \
          NAME=mols-bjerge \
          BBOX="$PILOT_BBOX" \
          AOI_RECEIPT="$PILOT_QA_ROOT/data/aoi/mols-bjerge.scope.aoi.json" \
          AOI_RELATION_MEMBERS="$PILOT_QA_ROOT/data/aoi/mols-bjerge.relation-members.aoi.json" \
          AOI_WAY_TOPOLOGY=data/aoi/mols-bjerge.way-topology.json \
          AOI_GITHUB_OUTPUT="$GITHUB_OUTPUT" \
          AOI_PARENT_LABEL=data/hiking.osm.pbf \
          AOI_OUTPUT_ARTIFACT=data/aoi/mols-bjerge.osm.pbf \
            bash extract/aoi.sh
          cp data/aoi/mols-bjerge.osm.pbf \
            "$PILOT_QA_ROOT/data/aoi/mols-bjerge.osm.pbf"

      - name: Build and seal raw Denmark root closure
        id: raw_scope
        shell: bash
        run: |
          set -euo pipefail
          cd "$PILOT_REPO/trailforge"
          AOI="$PILOT_QA_ROOT/data/aoi/mols-bjerge.relation-members.aoi.json"
          RAW_PBF="$PILOT_QA_ROOT/data/source/mols-bjerge.raw.osm.pbf"
          RAW="$PILOT_QA_ROOT/data/source/mols-bjerge.relation-members.raw.json"
          python3 tools/build_relation_slice.py \
            --in data/raw/denmark.osm.pbf \
            --roots-from "$AOI" \
            --out "$RAW_PBF" \
            --receipt "$PILOT_QA_ROOT/data/source/mols-bjerge.scope.raw.json" \
            --scope raw-denmark \
            --source-label data/raw/denmark.osm.pbf \
            --output-artifact data/source/mols-bjerge.raw.osm.pbf \
            --upstream-stage relation-root-closure-extract \
            --github-output "$GITHUB_OUTPUT"
          python3 tools/export_relation_members.py \
            --in "$RAW_PBF" \
            --scope raw-denmark \
            --roots-from "$AOI" \
            --out "$RAW" \
            --github-output "$GITHUB_OUTPUT"

      - name: Build and seal prefiltered Denmark root closure
        id: prefilter_scope
        shell: bash
        run: |
          set -euo pipefail
          cd "$PILOT_REPO/trailforge"
          AOI="$PILOT_QA_ROOT/data/aoi/mols-bjerge.relation-members.aoi.json"
          PREFILTER_PBF="$PILOT_QA_ROOT/data/source/mols-bjerge.prefilter.osm.pbf"
          PREFILTER="$PILOT_QA_ROOT/data/source/mols-bjerge.relation-members.prefilter.json"
          python3 tools/build_relation_slice.py \
            --in data/hiking.osm.pbf \
            --roots-from "$AOI" \
            --out "$PREFILTER_PBF" \
            --receipt "$PILOT_QA_ROOT/data/source/mols-bjerge.scope.prefilter.json" \
            --scope prefiltered-denmark \
            --source-label data/hiking.osm.pbf \
            --output-artifact data/source/mols-bjerge.prefilter.osm.pbf \
            --upstream-stage relation-root-closure-extract \
            --github-output "$GITHUB_OUTPUT"
          python3 tools/export_relation_members.py \
            --in "$PREFILTER_PBF" \
            --scope prefiltered-denmark \
            --roots-from "$AOI" \
            --out "$PREFILTER" \
            --github-output "$GITHUB_OUTPUT"

      - name: Assemble exact Mols boundary
        shell: bash
        run: |
          set -euo pipefail
          cd "$PILOT_REPO/trailforge"
          python3 assemble/assemble.py \
            --in data/aoi/mols-bjerge.osm.pbf \
            --out data/aoi/mols-bjerge.trails.geojson \
            --only-area "$PILOT_AREA_NAME" \
            --require-exact-area \
            --expected-area-relation-id "$PILOT_EXPECTED_RELATION_ID" \
            --relation-authority \
              "$PILOT_QA_ROOT/data/source/mols-bjerge.relation-members.raw.json" \
            --prefilter-authority \
              "$PILOT_QA_ROOT/data/source/mols-bjerge.relation-members.prefilter.json" \
            --aoi-relation-members \
              "$PILOT_QA_ROOT/data/aoi/mols-bjerge.relation-members.aoi.json" \
            --min-length-mi 0.1 \
            --per-area-merge \
            --region dk \
            --report-json "$PILOT_QA_ROOT/reports/assembly.json" \
            2>&1 | tee "$PILOT_QA_ROOT/reports/assembly.log"

      - name: Dry-run publish the one-row Mols index
        shell: bash
        run: |
          set -euo pipefail
          cd "$PILOT_REPO/trailforge"
          mkdir -p "$PILOT_WORK_ROOT/publish-output"
          python3 serve/publish_areas.py \
            --trails data/aoi/mols-bjerge.trails.geojson \
            --hiking data/aoi/mols-bjerge.osm.pbf \
            --state Denmark \
            --index "$PILOT_INDEX" \
            --out-dir "$PILOT_WORK_ROOT/publish-output" \
            --dry-run \
            --no-boundary-fetch \
            --no-elevation \
            --exact-boundary data/aoi/mols-bjerge.exact-area.geojson \
            --preview-root "$PILOT_QA_ROOT" \
            --preview-json "$PILOT_QA_ROOT/reports/app-preview.json" \
            --report-json "$PILOT_QA_ROOT/reports/publish.json" \
            2>&1 | tee "$PILOT_QA_ROOT/reports/publish.log"

      - name: Stage complete visual QA artifact
        shell: bash
        run: |
          set -euo pipefail
          cd "$PILOT_REPO/trailforge"
          for file in \
            mols-bjerge.raw.geojson \
            mols-bjerge.way-topology.json \
            mols-bjerge.trails.geojson \
            mols-bjerge.removed.geojson \
            mols-bjerge.ingest-dropped.geojson \
            mols-bjerge.areas.geojson \
            mols-bjerge.exact-area.geojson \
            mols-bjerge.curation.json \
            mols-bjerge.curation-diff.json; do
            cp "data/aoi/$file" "$PILOT_QA_ROOT/data/aoi/$file"
          done
          python3 tools/build_mols_golden.py \
            --template golden/mols-bjerge.json \
            --relation-authority \
              "$PILOT_QA_ROOT/data/source/mols-bjerge.relation-members.raw.json" \
            --trails "$PILOT_QA_ROOT/data/aoi/mols-bjerge.trails.geojson" \
            --source-sha "$GITHUB_SHA" \
            --out "$PILOT_QA_ROOT/golden/mols-bjerge.json"
          if [[ -f data/aoi/mols-bjerge.dropped-routes.geojson ]]; then
            cp data/aoi/mols-bjerge.dropped-routes.geojson \
              "$PILOT_QA_ROOT/data/aoi/mols-bjerge.dropped-routes.geojson"
          fi
          cp viewer/index.html "$PILOT_QA_ROOT/viewer/index.html"
          cp viewer/serve.py "$PILOT_QA_ROOT/viewer/serve.py"
          python3 tools/build_mols_pilot_visual.py \
            --raw "$PILOT_QA_ROOT/data/aoi/mols-bjerge.raw.geojson" \
            --areas "$PILOT_QA_ROOT/data/aoi/mols-bjerge.areas.geojson" \
            --trails "$PILOT_QA_ROOT/data/aoi/mols-bjerge.trails.geojson" \
            --removed "$PILOT_QA_ROOT/data/aoi/mols-bjerge.removed.geojson" \
            --relation-authority \
              "$PILOT_QA_ROOT/data/source/mols-bjerge.relation-members.raw.json" \
            --assembly-report "$PILOT_QA_ROOT/reports/assembly.json" \
            --out "$PILOT_QA_ROOT/visual/mols-bjerge.svg" \
            --review-out "$PILOT_QA_ROOT/visual/review.json"

      - name: Seal every validation input
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$PILOT_QA_ROOT" <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import sys
          import tempfile

          root = Path(sys.argv[1])
          relatives = [
              "README.md",
              "data/aoi/mols-bjerge.areas.geojson",
              "data/aoi/mols-bjerge.exact-area.geojson",
              "data/aoi/mols-bjerge.scope.aoi.json",
              "data/aoi/mols-bjerge.way-topology.json",
              "data/aoi/mols-bjerge.curation-diff.json",
              "data/aoi/mols-bjerge.curation.json",
              "data/aoi/mols-bjerge.ingest-dropped.geojson",
              "data/aoi/mols-bjerge.osm.pbf",
              "data/aoi/mols-bjerge.raw.geojson",
              "data/aoi/mols-bjerge.relation-members.aoi.json",
              "data/aoi/mols-bjerge.removed.geojson",
              "data/aoi/mols-bjerge.trails.geojson",
              "data/source/mols-bjerge.prefilter.osm.pbf",
              "data/source/mols-bjerge.prefilter-transformation.json",
              "data/source/mols-bjerge.raw.osm.pbf",
              "data/source/mols-bjerge.scope.prefilter.json",
              "data/source/mols-bjerge.scope.raw.json",
              "data/source/mols-bjerge.relation-members.prefilter.json",
              "data/source/mols-bjerge.relation-members.raw.json",
              "discovery/discovery.log",
              "discovery/pbf-provenance.json",
              "discovery/report.json",
              "discovery/selected.json",
              "discovery/validation.json",
              "discovery/validation.log",
              "golden/mols-bjerge.json",
              "reports/app-preview.json",
              "reports/assembly.json",
              "reports/assembly.log",
              "reports/input-validation.log",
              "reports/publish.json",
              "reports/publish.log",
              "viewer/index.html",
              "viewer/serve.py",
              "visual/mols-bjerge.svg",
              "visual/review.json",
          ]
          optional = "data/aoi/mols-bjerge.dropped-routes.geojson"
          if (root / optional).is_file():
              relatives.append(optional)
          scopes = {
              "data/source/mols-bjerge.raw.osm.pbf": "raw-denmark",
              "data/source/mols-bjerge.prefilter.osm.pbf":
                  "prefiltered-denmark",
              "data/aoi/mols-bjerge.osm.pbf": "aoi-render-scope",
              "data/aoi/mols-bjerge.scope.aoi.json": "aoi-scope-provenance",
              "data/aoi/mols-bjerge.way-topology.json": "aoi-source-topology",
              "data/aoi/mols-bjerge.exact-area.geojson": "exact-area-geometry",
              "data/aoi/mols-bjerge.relation-members.aoi.json": "aoi-render-scope",
              "data/source/mols-bjerge.relation-members.raw.json": "raw-denmark",
              "data/source/mols-bjerge.relation-members.prefilter.json":
                  "prefiltered-denmark",
              "data/source/mols-bjerge.scope.raw.json": "raw-scope-provenance",
              "data/source/mols-bjerge.scope.prefilter.json":
                  "prefiltered-scope-provenance",
              "data/source/mols-bjerge.prefilter-transformation.json":
                  "prefilter-transformation-provenance",
              "discovery/pbf-provenance.json":
                  "local-pbf-discovery-provenance",
              "reports/app-preview.json": "runner-local-app-preview",
              "golden/mols-bjerge.json": "validation-only-no-geometry",
              "visual/mols-bjerge.svg": "offline-osm-visual",
              "visual/review.json": "offline-osm-visual-review",
          }
          def producer_stage(relative):
              if relative.endswith("scope.raw.json") or \
                      relative.endswith("scope.prefilter.json") or \
                      relative.endswith("scope.aoi.json"):
                  return "scope-provenance"
              if relative.endswith("prefilter-transformation.json"):
                  return "prefilter-provenance"
              if relative.endswith("way-topology.json"):
                  return "aoi-way-topology-export"
              if "relation-members" in relative:
                  return "relation-authority-export"
              if relative in {
                      "data/source/mols-bjerge.raw.osm.pbf",
                      "data/source/mols-bjerge.prefilter.osm.pbf"}:
                  return "relation-root-closure-extract"
              if relative.endswith(".osm.pbf"):
                  return "aoi-extract"
              if relative in {
                      "data/aoi/mols-bjerge.raw.geojson"}:
                  return "aoi-raw-export"
              if relative.startswith("data/aoi/"):
                  return "assembly"
              if relative.startswith("discovery/"):
                  return "discovery"
              if relative == "golden/mols-bjerge.json":
                  return "current-osm-golden-builder"
              if relative.startswith("reports/app-preview") or \
                      relative.startswith("reports/publish"):
                  return "publisher"
              if relative.startswith("reports/assembly"):
                  return "assembly"
              if relative.startswith("visual/"):
                  return "offline-visual-builder"
              if relative.startswith("viewer/"):
                  return "qa-viewer"
              return "qa-initialization"
          artifacts = {}
          for relative in sorted(relatives):
              path = root / relative
              raw = path.read_bytes()
              if path.suffix in {".json", ".geojson"}:
                  value = json.loads(raw)
                  schema = value.get(
                      "schema_version",
                      "geojson" if path.suffix == ".geojson" else "json",
                  ) if isinstance(value, dict) else "json"
              elif path.suffix == ".pbf":
                  schema = "osm-pbf"
              elif path.suffix == ".svg":
                  schema = "svg"
              else:
                  schema = "text"
              artifacts[relative] = {
                  "bytes": len(raw),
                  "sha256": hashlib.sha256(raw).hexdigest(),
                  "producer_stage": producer_stage(relative),
                  "source_scope": scopes.get(relative, "runner-local-qa"),
                  "schema_version": schema,
              }
          manifest_path = root / "manifest.json"
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          manifest["artifacts"] = artifacts
          descriptor, temporary = tempfile.mkstemp(
              prefix=".manifest.", suffix=".tmp", dir=manifest_path.parent)
          try:
              with os.fdopen(descriptor, "w", encoding="utf-8") as output:
                  json.dump(manifest, output, indent=2, ensure_ascii=False)
                  output.write("\n")
                  output.flush()
                  os.fsync(output.fileno())
              os.replace(temporary, manifest_path)
          except BaseException:
              try:
                  os.unlink(temporary)
              except FileNotFoundError:
                  pass
              raise
          PY

      - name: Materialize non-package scope trust from stage outputs
        shell: bash
        env:
          RAW_PARENT_SHA256: ${{ steps.raw_scope.outputs.parent_sha256 }}
          RAW_PARENT_BYTES: ${{ steps.raw_scope.outputs.parent_bytes }}
          RAW_SLICE_SHA256: ${{ steps.raw_scope.outputs.slice_sha256 }}
          RAW_SLICE_BYTES: ${{ steps.raw_scope.outputs.slice_bytes }}
          RAW_RECEIPT_SHA256: ${{ steps.raw_scope.outputs.receipt_sha256 }}
          RAW_RECEIPT_BYTES: ${{ steps.raw_scope.outputs.receipt_bytes }}
          RAW_ROOT_SET_SHA256: ${{ steps.raw_scope.outputs.root_set_sha256 }}
          RAW_RELATION_LEDGER_SHA256: ${{ steps.raw_scope.outputs.relation_ledger_sha256 }}
          RAW_RELATION_LEDGER_BYTES: ${{ steps.raw_scope.outputs.relation_ledger_bytes }}
          PREFILTER_PARENT_SHA256: ${{ steps.prefilter_scope.outputs.parent_sha256 }}
          PREFILTER_PARENT_BYTES: ${{ steps.prefilter_scope.outputs.parent_bytes }}
          PREFILTER_SLICE_SHA256: ${{ steps.prefilter_scope.outputs.slice_sha256 }}
          PREFILTER_SLICE_BYTES: ${{ steps.prefilter_scope.outputs.slice_bytes }}
          PREFILTER_RECEIPT_SHA256: ${{ steps.prefilter_scope.outputs.receipt_sha256 }}
          PREFILTER_RECEIPT_BYTES: ${{ steps.prefilter_scope.outputs.receipt_bytes }}
          PREFILTER_ROOT_SET_SHA256: ${{ steps.prefilter_scope.outputs.root_set_sha256 }}
          PREFILTER_RELATION_LEDGER_SHA256: ${{ steps.prefilter_scope.outputs.relation_ledger_sha256 }}
          PREFILTER_RELATION_LEDGER_BYTES: ${{ steps.prefilter_scope.outputs.relation_ledger_bytes }}
          AOI_PARENT_SHA256: ${{ steps.aoi_scope.outputs.parent_sha256 }}
          AOI_PARENT_BYTES: ${{ steps.aoi_scope.outputs.parent_bytes }}
          AOI_SLICE_SHA256: ${{ steps.aoi_scope.outputs.slice_sha256 }}
          AOI_SLICE_BYTES: ${{ steps.aoi_scope.outputs.slice_bytes }}
          AOI_RECEIPT_SHA256: ${{ steps.aoi_scope.outputs.receipt_sha256 }}
          AOI_RECEIPT_BYTES: ${{ steps.aoi_scope.outputs.receipt_bytes }}
          AOI_ROOT_SET_SHA256: ${{ steps.aoi_scope.outputs.root_set_sha256 }}
          AOI_ROOT_BBOX_SHA256: ${{ steps.aoi_scope.outputs.root_bbox_sha256 }}
          AOI_RELATION_LEDGER_SHA256: ${{ steps.aoi_scope.outputs.relation_ledger_sha256 }}
          AOI_RELATION_LEDGER_BYTES: ${{ steps.aoi_scope.outputs.relation_ledger_bytes }}
          AOI_WAY_TOPOLOGY_SHA256: ${{ steps.aoi_scope.outputs.way_topology_sha256 }}
          AOI_WAY_TOPOLOGY_BYTES: ${{ steps.aoi_scope.outputs.way_topology_bytes }}
          AOI_STAGE_NAME: ${{ steps.aoi_scope.outputs.aoi_name }}
          AOI_STAGE_BBOX: ${{ steps.aoi_scope.outputs.aoi_bbox }}
          TRANSFORM_INPUT_SHA256: ${{ steps.prefilter_source.outputs.input_sha256 }}
          TRANSFORM_INPUT_BYTES: ${{ steps.prefilter_source.outputs.input_bytes }}
          TRANSFORM_OUTPUT_SHA256: ${{ steps.prefilter_source.outputs.output_sha256 }}
          TRANSFORM_OUTPUT_BYTES: ${{ steps.prefilter_source.outputs.output_bytes }}
          TRANSFORM_RECEIPT_SHA256: ${{ steps.prefilter_source.outputs.receipt_sha256 }}
          TRANSFORM_RECEIPT_BYTES: ${{ steps.prefilter_source.outputs.receipt_bytes }}
        run: |
          set -euo pipefail
          [[ "$PILOT_SCOPE_TRUST" == "$PILOT_WORK_ROOT/"* ]]
          [[ "$PILOT_SCOPE_TRUST" != "$PILOT_QA_ROOT/"* ]]
          python3 - "$PILOT_SCOPE_TRUST" <<'PY'
          import json
          import os
          from pathlib import Path
          import sys

          def identity(prefix):
              return {
                  "sha256": os.environ[f"{prefix}_SHA256"],
                  "bytes": int(os.environ[f"{prefix}_BYTES"]),
              }

          document = {
              "schema_version": 1,
              "pilot": {
                  "name": os.environ["AOI_STAGE_NAME"],
                  "bbox": os.environ["AOI_STAGE_BBOX"],
              },
              "scopes": {
                  "raw-denmark": {
                      "parent": identity("RAW_PARENT"),
                      "slice": identity("RAW_SLICE"),
                      "receipt": identity("RAW_RECEIPT"),
                      "relation_ledger": identity("RAW_RELATION_LEDGER"),
                      "root_set_sha256": os.environ["RAW_ROOT_SET_SHA256"],
                  },
                  "prefiltered-denmark": {
                      "parent": identity("PREFILTER_PARENT"),
                      "slice": identity("PREFILTER_SLICE"),
                      "receipt": identity("PREFILTER_RECEIPT"),
                      "relation_ledger": identity(
                          "PREFILTER_RELATION_LEDGER"),
                      "root_set_sha256": os.environ[
                          "PREFILTER_ROOT_SET_SHA256"],
                  },
                  "aoi": {
                      "parent": identity("AOI_PARENT"),
                      "slice": identity("AOI_SLICE"),
                      "receipt": identity("AOI_RECEIPT"),
                      "relation_ledger": identity("AOI_RELATION_LEDGER"),
                      "way_topology": identity("AOI_WAY_TOPOLOGY"),
                      "root_set_sha256": os.environ["AOI_ROOT_SET_SHA256"],
                      "root_bbox_sha256": os.environ[
                          "AOI_ROOT_BBOX_SHA256"],
                  },
              },
              "prefilter_transformation": {
                  "input": identity("TRANSFORM_INPUT"),
                  "output": identity("TRANSFORM_OUTPUT"),
                  "receipt": identity("TRANSFORM_RECEIPT"),
              },
          }
          path = Path(sys.argv[1])
          payload = (
              json.dumps(document, ensure_ascii=False, sort_keys=True,
                         separators=(",", ":")) + "\n")
          with path.open("x", encoding="utf-8") as output:
              output.write(payload)
              output.flush()
              os.fsync(output.fileno())
          path.chmod(0o400)
          PY

      - name: Validate complete Mols QA package
        shell: bash
        run: |
          set -euo pipefail
          python3 "$PILOT_REPO/trailforge/tools/validate_publish_pilot.py" final \
            --qa-dir "$PILOT_QA_ROOT" \
            --scope-trust-file "$PILOT_SCOPE_TRUST" \
            --raw-relation-members \
              "$PILOT_QA_ROOT/data/source/mols-bjerge.relation-members.raw.json" \
            --prefilter-relation-members \
              "$PILOT_QA_ROOT/data/source/mols-bjerge.relation-members.prefilter.json" \
            --aoi-relation-members \
              "$PILOT_QA_ROOT/data/aoi/mols-bjerge.relation-members.aoi.json" \
            --expected-osm-relation-id "$PILOT_EXPECTED_RELATION_ID" \
            --require-pbf-provenance \
            --source-pbf \
              "$PILOT_REPO/trailforge/data/raw/denmark.osm.pbf" \
            --result-json "$PILOT_QA_ROOT/validation/final.json" \
            2>&1 | tee "$PILOT_QA_ROOT/validation/final.log"

      - name: Upload Mols Bjerge QA artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: mols-bjerge-qa-${{ github.sha }}
          path: ${{ env.PILOT_QA_ROOT }}
          if-no-files-found: error

      - name: Prove tracked checkout stayed unchanged
        if: ${{ always() }}
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          git diff --exit-code HEAD --
          git diff --cached --exit-code
          STATUS="$(git status --porcelain --untracked-files=all)"
          if [[ -n "$STATUS" ]]; then
            printf '%s\n' "$STATUS"
            exit 1
          fi
