name: SouthMountainExplorer
options:
  bundleIdPrefix: com.southmountainexplorer
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "26.0"

packages:
  PostHog:
    url: https://github.com/PostHog/posthog-ios
    from: "3.0.0"

targets:
  SouthMountainExplorer:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: SouthMountainExplorer
    dependencies:
      - package: PostHog
        product: PostHog
    resources:
      - path: SouthMountainExplorer/Resources
      - path: SouthMountainExplorer/Assets.xcassets
    info:
      path: SouthMountainExplorer/Info.plist
      properties:
        CFBundleName: TrekDex
        CFBundleDisplayName: TrekDex
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        CFBundleIconName: AppIcon
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSLocationWhenInUseUsageDescription: "TrekDex uses your location to find nearby trails and show your position on the map."
        NSLocationAlwaysAndWhenInUseUsageDescription: "TrekDex uses your location in the background to record your hike even when the app is minimised."
        UIBackgroundModes:
          - location
        ITSAppUsesNonExemptEncryption: false
        # PostHog config, read at runtime by PostHogBackend. The
        # project API key is a CLIENT-side key (safe to ship in the
        # binary); keeping it here centralizes it instead of hardcoding
        # in Swift, and swapping projects/regions is a one-line change.
        PostHogAPIKey: phc_nMKfJcA9euYLgb7jjFJMryhzCbLUeY9fDuejH35BpQQP
        PostHogHost: https://us.i.posthog.com
    entitlements:
      path: SouthMountainExplorer/SouthMountainExplorer.entitlements
      properties:
        com.apple.developer.applesignin:
          - Default
    settings:
      base:
        SWIFT_VERSION: "6.0"
        PRODUCT_BUNDLE_IDENTIFIER: com.southmountainexplorer.app
        SWIFT_STRICT_CONCURRENCY: complete
        ENABLE_USER_SCRIPT_SANDBOXING: NO
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: PROFILE_UUID_PLACEHOLDER

  SouthMountainExplorerTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: SouthMountainExplorerTests
    dependencies:
      - target: SouthMountainExplorer
    settings:
      base:
        SWIFT_VERSION: "6.0"
        PRODUCT_BUNDLE_IDENTIFIER: com.southmountainexplorer.app.tests
        SWIFT_STRICT_CONCURRENCY: complete
        GENERATE_INFOPLIST_FILE: YES
