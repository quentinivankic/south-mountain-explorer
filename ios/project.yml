name: SouthMountainExplorer
options:
  bundleIdPrefix: com.southmountainexplorer
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "26.0"

targets:
  SouthMountainExplorer:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: SouthMountainExplorer
      - path: Shared
    resources:
      - path: SouthMountainExplorer/Resources
      - path: SouthMountainExplorer/Assets.xcassets
    dependencies:
      - target: SouthMountainExplorerWidgets
    info:
      path: SouthMountainExplorer/Info.plist
      properties:
        CFBundleName: TrekDex
        CFBundleDisplayName: TrekDex
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        CFBundleIconName: AppIcon
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSLocationWhenInUseUsageDescription: "TrekDex uses your location to find nearby trails and show your position on the map."
        NSLocationAlwaysAndWhenInUseUsageDescription: "TrekDex uses your location in the background to record your hike even when the app is minimised."
        UIBackgroundModes:
          - location
        ITSAppUsesNonExemptEncryption: false
        NSSupportsLiveActivities: true
    entitlements:
      path: SouthMountainExplorer/SouthMountainExplorer.entitlements
      properties:
        com.apple.developer.applesignin:
          - Default
    settings:
      base:
        SWIFT_VERSION: "6.0"
        PRODUCT_BUNDLE_IDENTIFIER: com.southmountainexplorer.app
        SWIFT_STRICT_CONCURRENCY: complete
        ENABLE_USER_SCRIPT_SANDBOXING: NO
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: PROFILE_UUID_PLACEHOLDER

  SouthMountainExplorerWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: SouthMountainExplorerWidgets
      - path: Shared
    info:
      path: SouthMountainExplorerWidgets/Info.plist
      properties:
        CFBundleDisplayName: TrekDex Widgets
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        SWIFT_VERSION: "6.0"
        PRODUCT_BUNDLE_IDENTIFIER: com.southmountainexplorer.app.widgets
        SWIFT_STRICT_CONCURRENCY: complete
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: WIDGETS_PROFILE_UUID_PLACEHOLDER

  SouthMountainExplorerTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: SouthMountainExplorerTests
    dependencies:
      - target: SouthMountainExplorer
    settings:
      base:
        SWIFT_VERSION: "6.0"
        PRODUCT_BUNDLE_IDENTIFIER: com.southmountainexplorer.app.tests
        SWIFT_STRICT_CONCURRENCY: complete
        GENERATE_INFOPLIST_FILE: YES
