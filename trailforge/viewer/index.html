<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>trailforge QA viewer</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<!-- Local-only QA tool (homelab). CDN + OSM raster tiles are fine here;
     this never ships to users. -->
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
<style>
  html, body, #map { margin: 0; height: 100%; }
  #panel {
    position: absolute; top: 10px; left: 10px; z-index: 2;
    background: rgba(255,255,255,.95); border-radius: 8px; padding: 10px 12px;
    font: 13px/1.5 system-ui, sans-serif; box-shadow: 0 1px 6px rgba(0,0,0,.25);
    max-width: 300px; max-height: calc(100vh - 20px); overflow-y: auto;
  }
  #panel h1 { font-size: 14px; margin: 0 0 6px; }
  #panel label { display: block; cursor: pointer; }
  #golden-list, #inview-list { margin: 6px 0 0; padding: 0; list-style: none; max-height: 34vh; overflow: auto; }
  #golden-list li, #inview-list li { cursor: pointer; padding: 1px 4px; border-radius: 4px; }
  #golden-list li:hover, #inview-list li:hover { background: #eef; }
  #trail-search { width: 100%; box-sizing: border-box; margin: 4px 0; padding: 3px 6px;
    border: 1px solid #ccc; border-radius: 4px; font: inherit; }
  .swatch { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; }
  .mi { color: #888; }
</style>
</head>
<body>
<div id="map"></div>
<div id="panel">
  <h1>trailforge QA</h1>
  <label><input type="checkbox" id="toggle-raw" checked />
    <span class="swatch" style="background:#888"></span>OSM raw (aoi.raw)</label>
  <label><input type="checkbox" id="toggle-areas" checked />
    <span class="swatch" style="background:#2e7d32;opacity:.45"></span>Park areas (merge scope)</label>
  <label><input type="checkbox" id="toggle-hikes" checked />
    <span class="swatch" style="background:#17913a"></span>Hikes (canonical)</label>
  <label><input type="checkbox" id="toggle-trails" checked />
    <span class="swatch" style="background:#e6521f"></span>Trails (v3)</label>
  <label><input type="checkbox" id="toggle-routes" checked />
    <span class="swatch" style="background:#8b3fd6"></span>Routes (thru / composite)</label>
  <label><input type="checkbox" id="toggle-removed" />
    <span class="swatch" style="background:#b3261e"></span>Removed (filtered out) <span id="removed-count" class="mi"></span></label>
  <label><input type="checkbox" id="toggle-inarea" />
    <span class="swatch" style="background:#e6521f;opacity:.35"></span>Only trails in an area</label>
  <label><input type="checkbox" id="toggle-golden" checked />
    <span class="swatch" style="background:#1a7f37"></span>Golden destinations</label>
  <div style="margin-top:8px"><b>Trails</b> <span id="inview-count" class="mi"></span></div>
  <input id="trail-search" type="search" placeholder="search all trails…" />
  <ul id="inview-list"></ul>
  <div style="margin-top:6px"><b id="golden-title">Golden trails</b> (click to fly)</div>
  <div id="golden-summary" style="font-weight:600"></div>
  <ul id="golden-list"></ul>
</div>
<script>
const AOI = new URLSearchParams(location.search).get("aoi") || "sedona";

const map = new maplibregl.Map({
  container: "map",
  center: [-111.8153, 34.9008],  // Devils Bridge — the founding regression
  zoom: 13,
  style: {
    version: 8,
    sources: {
      osm: {
        type: "raster", tileSize: 256,
        tiles: ["https://tile.openstreetmap.org/{z}/{x}/{y}.png"],
        attribution: "© OpenStreetMap contributors",
      },
    },
    layers: [{ id: "osm", type: "raster", source: "osm" }],
  },
});
map.addControl(new maplibregl.NavigationControl());

async function maybeJSON(url) {
  try { const r = await fetch(url); return r.ok ? await r.json() : null; }
  catch { return null; }
}

// grow a LngLatBounds to cover a (Multi)LineString feature.
function extendBounds(b, feature) {
  const g = feature.geometry || {};
  const lines = g.type === "MultiLineString" ? g.coordinates
              : g.type === "LineString" ? [g.coordinates] : [];
  for (const line of lines) for (const c of line) b.extend(c);
  return b;
}

map.on("load", async () => {
  // Layer 0 (bottom): park areas that scope the per-area merge (SPEC §6b).
  const areas = await maybeJSON(`../data/aoi/${AOI}.areas.geojson`);
  if (areas) {
    map.addSource("areas", { type: "geojson", data: areas });
    map.addLayer({ id: "area-fill", source: "areas", type: "fill",
      paint: { "fill-color": "#2e7d32", "fill-opacity": 0.12 } });
    map.addLayer({ id: "area-line", source: "areas", type: "line",
      paint: { "line-color": "#2e7d32", "line-width": 1, "line-opacity": 0.55 } });
    map.on("click", "area-fill", (e) => {
      new maplibregl.Popup().setLngLat(e.lngLat)
        .setHTML(`<b>${e.features[0].properties.name || "(unnamed area)"}</b><br>park area — merge scope`)
        .addTo(map);
    });
  }

  // Layer 1: raw OSM export of the AOI (what the data contains).
  const raw = await maybeJSON(`../data/aoi/${AOI}.raw.geojson`);
  if (raw) {
    map.addSource("raw", { type: "geojson", data: raw });
    map.addLayer({ id: "raw-lines", source: "raw", type: "line",
      filter: ["==", ["geometry-type"], "LineString"],
      paint: { "line-color": "#888", "line-width": 1.5, "line-dasharray": [2, 2] } });
    map.addLayer({ id: "raw-pois", source: "raw", type: "circle",
      filter: ["==", ["geometry-type"], "Point"],
      paint: { "circle-color": "#888", "circle-radius": 3 } });
  }

  // Layer 2: OUR assembled trails (one feature per trail object).
  // aoi=golden shows the merged suite output; otherwise the named AOI.
  const trailsUrl = AOI === "golden"
    ? `../data/golden.trails.geojson`
    : `../data/aoi/${AOI}.trails.geojson`;
  const trails = await maybeJSON(trailsUrl);
  if (trails) {
    // generateId gives each trail feature an id so a click can flip its
    // feature-state — and since one trail = one MultiLineString feature,
    // that lights up the WHOLE assembled trail at once.
    map.addSource("trails", { type: "geojson", data: trails, generateId: true });
    // selected feature-state flips a line to cyan + thicker.
    const selPaint = (base, w = 3) => ({
      "line-color": ["case", ["boolean", ["feature-state", "selected"], false],
                     "#00b7ff", base],
      "line-width": ["case", ["boolean", ["feature-state", "selected"], false], 6, w],
    });
    // Base filter per kind. The "Only trails in an area" toggle ANDs an
    // area-membership clause onto these (SPEC §6b — arealess backcountry).
    const KIND_FILTER = {
      "trail-lines": ["all", ["!=", ["get", "kind"], "route"], ["!=", ["get", "kind"], "hike"]],
      "route-lines": ["==", ["get", "kind"], "route"],
      "hike-lines": ["==", ["get", "kind"], "hike"],
    };
    // Named physical trails (kind == trail) — solid orange. Unknown/missing
    // kind falls here too (safe default).
    map.addLayer({ id: "trail-lines", source: "trails", type: "line",
      filter: KIND_FILTER["trail-lines"],
      layout: { "line-cap": "round", "line-join": "round" },
      paint: selPaint("#e6521f") });
    // Routes that traverse named trails (kind == route) — dashed purple, so a
    // park view can uncheck them and see just the named-trail set (SPEC §6b).
    map.addLayer({ id: "route-lines", source: "trails", type: "line",
      filter: KIND_FILTER["route-lines"],
      layout: { "line-cap": "round", "line-join": "round" },
      paint: { ...selPaint("#8b3fd6"), "line-dasharray": [2, 1.5] } });
    // Canonical hikes (kind == hike) — solid green, thicker, drawn on top:
    // the marquee "complete this" objects harvested from OSM routes (SPEC §6c).
    map.addLayer({ id: "hike-lines", source: "trails", type: "line",
      filter: KIND_FILTER["hike-lines"],
      layout: { "line-cap": "round", "line-join": "round" },
      paint: selPaint("#17913a", 4.5) });
    // "Only trails in an area": AND an area-membership clause onto each kind.
    document.getElementById("toggle-inarea").onchange = (e) => {
      for (const [lid, base] of Object.entries(KIND_FILTER)) {
        if (!map.getLayer(lid)) continue;
        map.setFilter(lid, e.target.checked
          ? ["all", base, ["to-boolean", ["get", "area"]]] : base);
      }
    };

    const HIT = ["hike-lines", "trail-lines", "route-lines"];
    let selectedId = null;
    const clearSel = () => {
      if (selectedId !== null) {
        map.setFeatureState({ source: "trails", id: selectedId }, { selected: false });
        selectedId = null;
      }
    };
    map.on("mouseenter", HIT, () => map.getCanvas().style.cursor = "pointer");
    map.on("mouseleave", HIT, () => map.getCanvas().style.cursor = "");

    map.on("click", HIT, (e) => {
      clearSel();
      const f = e.features[0];
      selectedId = f.id;
      map.setFeatureState({ source: "trails", id: selectedId }, { selected: true });
      const p = f.properties;
      new maplibregl.Popup().setLngLat(e.lngLat)
        .setHTML(`<b>${p.name || "(unnamed)"}</b><br>` +
                 Object.entries(p).map(([k, v]) => `${k}: ${v}`).join("<br>"))
        .addTo(map);
    });
    // click empty space (off any trail/route) to clear the highlight
    map.on("click", (e) => {
      if (!map.queryRenderedFeatures(e.point, { layers: HIT }).length) clearSel();
    });

    // --- trail picker: list what's in view, search across all, click to frame ---
    // id === feature index (maplibre generateId), so we can look up full geometry.
    const feats = trails.features;
    const listEl = document.getElementById("inview-list");
    const countEl = document.getElementById("inview-count");
    const searchEl = document.getElementById("trail-search");

    // frame + highlight the whole trail on pick.
    const pick = (id) => {
      clearSel();
      selectedId = id;
      map.setFeatureState({ source: "trails", id }, { selected: true });
      const b = extendBounds(new maplibregl.LngLatBounds(), feats[id]);
      if (!b.isEmpty()) map.fitBounds(b, { padding: 60, maxZoom: 15, duration: 600 });
    };

    const renderList = () => {
      const q = (searchEl.value || "").trim().toLowerCase();
      let items;
      if (q) {                                   // search ALL trails in the AOI
        items = feats.map((f, i) => [i, f.properties])
                     .filter(([, p]) => (p.name || "").toLowerCase().includes(q));
      } else {                                   // just what's rendered in the viewport
        const seen = new Set();
        for (const f of map.queryRenderedFeatures({ layers: HIT }))
          if (f.id != null) seen.add(f.id);
        items = [...seen].map((i) => [i, feats[i].properties]);
      }
      items.sort((a, b) => (a[1].name || "~").localeCompare(b[1].name || "~"));
      countEl.textContent = q ? `(${items.length} matches)` : `(${items.length} in view)`;
      listEl.innerHTML = "";
      for (const [i, p] of items) {
        const li = document.createElement("li");
        const color = p.kind === "hike" ? "#17913a"
                    : p.kind === "route" ? "#8b3fd6" : "#e6521f";
        li.innerHTML = `<span class="swatch" style="background:${color}"></span>` +
          `${p.name || "(unnamed)"} <span class="mi">${(p.length_mi || 0).toFixed(1)}mi</span>`;
        li.onclick = () => pick(i);
        listEl.appendChild(li);
      }
    };

    // frame the whole AOI on load (so trails aren't off-screen), then list.
    if (AOI !== "golden") {
      const all = feats.reduce((b, f) => extendBounds(b, f), new maplibregl.LngLatBounds());
      if (!all.isEmpty()) map.fitBounds(all, { padding: 30, duration: 0 });
    }
    map.on("moveend", () => { if (!searchEl.value.trim()) renderList(); });
    searchEl.addEventListener("input", renderList);
    renderList();
  }

  // Layer 2b: trails curation REMOVED — the show/hide "why did it drop?"
  // layer. Off by default; dashed dark-red; click shows a plain-language
  // removed_reason. Sidecar file written next to the trails output.
  const removedUrl = AOI === "golden"
    ? `../data/golden.removed.geojson`
    : `../data/aoi/${AOI}.removed.geojson`;
  const removed = await maybeJSON(removedUrl);
  if (removed && removed.features.length) {
    map.addSource("removed", { type: "geojson", data: removed, generateId: true });
    map.addLayer({ id: "removed-lines", source: "removed", type: "line",
      layout: { "line-cap": "round", "line-join": "round", visibility: "none" },
      paint: { "line-color": "#b3261e", "line-width": 2, "line-opacity": 0.9,
               "line-dasharray": [1.5, 1.5] } });
    const rc = document.getElementById("removed-count");
    if (rc) rc.textContent = `(${removed.features.length})`;
    map.on("mouseenter", "removed-lines", () => map.getCanvas().style.cursor = "pointer");
    map.on("mouseleave", "removed-lines", () => map.getCanvas().style.cursor = "");
    map.on("click", "removed-lines", (e) => {
      const p = e.features[0].properties;
      const reason = p.removed_reason || "(no reason recorded)";
      const bits = [];
      if (p.length_mi != null) bits.push(`${(+p.length_mi).toFixed(2)} mi`);
      if (p.source) bits.push(`source: ${p.source}`);
      if (p.network) bits.push(`network: ${p.network}`);
      if (p.operator) bits.push(`operator: ${p.operator}`);
      new maplibregl.Popup({ maxWidth: "300px" }).setLngLat(e.lngLat)
        .setHTML(
          `<b>${p.name || "(unnamed)"}</b>` +
          `<div style="color:#b3261e;font-weight:600;margin:4px 0">✕ Removed</div>` +
          `<div style="margin-bottom:4px">${reason}</div>` +
          `<div style="color:#888;font-size:11px">${bits.join(" · ")}</div>`)
        .addTo(map);
    });
  }

  // Layer 3: golden destinations, colored PASS/FAIL when results exist.
  const golden = await maybeJSON(`../golden/golden.snapped.json`)
              || await maybeJSON(`../golden/golden.json`);
  const resDoc = await maybeJSON(`../data/golden.results.json`);
  const byId = {};
  if (resDoc) for (const r of resDoc.results) byId[r.id] = r;
  if (golden) {
    const feats = [];
    const list = document.getElementById("golden-list");
    if (resDoc) {
      const pass = resDoc.results.filter((r) => r.passed).length;
      const sum = document.getElementById("golden-summary");
      sum.textContent = `${pass}/${resDoc.results.length} passing`;
      sum.style.color = pass === resDoc.results.length ? "#1a7f37" : "#b3261e";
    }
    for (const t of golden.trails) {
      const pts = t.kind === "destination" ? [t.destination] : t.endpoints;
      const r = byId[t.id];
      const passed = r ? r.passed : null;
      for (const c of pts) {
        feats.push({ type: "Feature",
          properties: { id: t.id, name: t.name, why: t.why,
                        pass: passed === null ? "—" : passed ? "PASS" : "FAIL",
                        diagnosis: r ? (r.diagnosis || "") : "",
                        detail: r ? (r.reasons || []).join("; ") || `reach ${r.reach_ft}ft` : "" },
          geometry: { type: "Point", coordinates: [c.lon, c.lat] } });
      }
      const li = document.createElement("li");
      const badge = passed === null ? "" : passed ? "✅ " : "❌ ";
      li.textContent = `${badge}${t.name} (${t.country})`;
      if (r && !r.passed) li.title = (r.reasons || []).join("; ");
      const c0 = pts[0];
      li.onclick = () => map.flyTo({ center: [c0.lon, c0.lat], zoom: 14 });
      list.appendChild(li);
    }
    map.addSource("golden", { type: "geojson",
      data: { type: "FeatureCollection", features: feats } });
    map.addLayer({ id: "golden-pts", source: "golden", type: "circle",
      paint: {
        "circle-color": ["match", ["get", "pass"],
          "PASS", "#1a7f37", "FAIL", "#b3261e", /* other */ "#888"],
        "circle-radius": 7,
        "circle-stroke-color": "#fff", "circle-stroke-width": 2 } });
    map.on("click", "golden-pts", (e) => {
      const p = e.features[0].properties;
      const diag = p.diagnosis ? `<br><i>${p.diagnosis}</i>` : "";
      new maplibregl.Popup().setLngLat(e.lngLat)
        .setHTML(`<b>${p.name}</b> — ${p.pass}${diag}<br>${p.detail || p.why}`).addTo(map);
    });
  }

  const wire = (box, ids) => document.getElementById(box).onchange = (e) =>
    ids.forEach((id) => map.getLayer(id) &&
      map.setLayoutProperty(id, "visibility", e.target.checked ? "visible" : "none"));
  wire("toggle-raw", ["raw-lines", "raw-pois"]);
  wire("toggle-areas", ["area-fill", "area-line"]);
  wire("toggle-hikes", ["hike-lines"]);
  wire("toggle-trails", ["trail-lines"]);
  wire("toggle-routes", ["route-lines"]);
  wire("toggle-removed", ["removed-lines"]);
  wire("toggle-golden", ["golden-pts"]);
});
</script>
</body>
</html>
