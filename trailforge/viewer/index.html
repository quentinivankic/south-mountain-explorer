<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>trailforge QA viewer</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<!-- Local-only QA tool (homelab). CDN + OSM raster tiles are fine here;
     this never ships to users. -->
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
<style>
  html, body, #map { margin: 0; height: 100%; }
  #panel {
    position: absolute; top: 10px; left: 10px; z-index: 2;
    background: rgba(255,255,255,.95); border-radius: 8px; padding: 10px 12px;
    font: 13px/1.5 system-ui, sans-serif; box-shadow: 0 1px 6px rgba(0,0,0,.25);
    max-width: 300px; max-height: calc(100vh - 20px); overflow-y: auto;
  }
  #panel h1 { font-size: 14px; margin: 0 0 6px; }
  #panel label { display: block; cursor: pointer; }
  #golden-list, #inview-list { margin: 6px 0 0; padding: 0; list-style: none; max-height: 34vh; overflow: auto; }
  #golden-list li, #inview-list li { cursor: pointer; padding: 1px 4px; border-radius: 4px; }
  #golden-list li:hover, #inview-list li:hover { background: #eef; }
  #trail-search { width: 100%; box-sizing: border-box; margin: 4px 0; padding: 3px 6px;
    border: 1px solid #ccc; border-radius: 4px; font: inherit; }
  .swatch { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; }
  .mi { color: #888; }
</style>
</head>
<body>
<div id="map"></div>
<div id="panel">
  <h1>trailforge QA</h1>
  <label><input type="checkbox" id="toggle-raw" checked />
    <span class="swatch" style="background:#888"></span>OSM raw (aoi.raw)</label>
  <label><input type="checkbox" id="toggle-areas" checked />
    <span class="swatch" style="background:#2e7d32;opacity:.45"></span>Park areas (merge scope)</label>
  <label><input type="checkbox" id="toggle-hikes" checked />
    <span class="swatch" style="background:#17913a"></span>Hikes (canonical)</label>
  <label><input type="checkbox" id="toggle-trails" checked />
    <span class="swatch" style="background:#e6521f"></span>Trails (v3)</label>
  <label><input type="checkbox" id="toggle-routes" checked />
    <span class="swatch" style="background:#8b3fd6"></span>Routes (thru / composite)</label>
  <label><input type="checkbox" id="toggle-removed" />
    <span class="swatch" style="background:#b3261e"></span>Removed (filtered out) <span id="removed-count" class="mi"></span></label>
  <div id="removed-cats" style="margin:0 0 2px 18px; font-size:12px;"></div>
  <label><input type="checkbox" id="toggle-diff" />
    <span class="swatch" style="background:#ffd400"></span>Changed since last run <span id="diff-count" class="mi"></span></label>
  <label><input type="checkbox" id="toggle-ingest" />
    <span class="swatch" style="background:#00695c"></span>Ingest-filtered (named, tag rules) <span id="ingest-count" class="mi"></span></label>
  <div id="ingest-cats" style="margin:0 0 2px 18px; font-size:12px;"></div>
  <label><input type="checkbox" id="toggle-inarea" />
    <span class="swatch" style="background:#e6521f;opacity:.35"></span>Only trails in an area</label>
  <label><input type="checkbox" id="toggle-clip" />
    <span class="swatch" style="background:#e6521f"></span>Clip to park boundaries (preview what ships)</label>
  <label><input type="checkbox" id="toggle-golden" checked />
    <span class="swatch" style="background:#1a7f37"></span>Golden destinations</label>
  <div style="margin-top:8px"><b>Trails</b> <span id="inview-count" class="mi"></span></div>
  <input id="trail-search" type="search" placeholder="search all trails…" />
  <ul id="inview-list"></ul>
  <div style="margin-top:6px"><b id="golden-title">Golden trails</b> (click to fly)</div>
  <div id="golden-summary" style="font-weight:600"></div>
  <ul id="golden-list"></ul>
</div>
<script>
const AOI = new URLSearchParams(location.search).get("aoi") || "sedona";

const map = new maplibregl.Map({
  container: "map",
  center: [-111.8153, 34.9008],  // Devils Bridge — the founding regression
  zoom: 13,
  style: {
    version: 8,
    sources: {
      osm: {
        type: "raster", tileSize: 256,
        tiles: ["https://tile.openstreetmap.org/{z}/{x}/{y}.png"],
        attribution: "© OpenStreetMap contributors",
      },
    },
    layers: [{ id: "osm", type: "raster", source: "osm" }],
  },
});
map.addControl(new maplibregl.NavigationControl());

async function maybeJSON(url) {
  try { const r = await fetch(url); return r.ok ? await r.json() : null; }
  catch { return null; }
}

// grow a LngLatBounds to cover a (Multi)LineString feature.
function extendBounds(b, feature) {
  const g = feature.geometry || {};
  const lines = g.type === "MultiLineString" ? g.coordinates
              : g.type === "LineString" ? [g.coordinates] : [];
  for (const line of lines) for (const c of line) b.extend(c);
  return b;
}

map.on("load", async () => {
  // Layer 0 (bottom): park areas that scope the per-area merge (SPEC §6b).
  const areas = await maybeJSON(`../data/aoi/${AOI}.areas.geojson`);
  if (areas) {
    map.addSource("areas", { type: "geojson", data: areas });
    map.addLayer({ id: "area-fill", source: "areas", type: "fill",
      paint: { "fill-color": "#2e7d32", "fill-opacity": 0.12 } });
    map.addLayer({ id: "area-line", source: "areas", type: "line",
      paint: { "line-color": "#2e7d32", "line-width": 1, "line-opacity": 0.55 } });
    map.on("click", "area-fill", (e) => {
      new maplibregl.Popup().setLngLat(e.lngLat)
        .setHTML(`<b>${e.features[0].properties.name || "(unnamed area)"}</b><br>park area — merge scope`)
        .addTo(map);
    });
  }

  // Layer 1: raw OSM export of the AOI (what the data contains).
  const raw = await maybeJSON(`../data/aoi/${AOI}.raw.geojson`);
  if (raw) {
    map.addSource("raw", { type: "geojson", data: raw });
    map.addLayer({ id: "raw-lines", source: "raw", type: "line",
      filter: ["==", ["geometry-type"], "LineString"],
      paint: { "line-color": "#888", "line-width": 1.5, "line-dasharray": [2, 2] } });
    map.addLayer({ id: "raw-pois", source: "raw", type: "circle",
      filter: ["==", ["geometry-type"], "Point"],
      paint: { "circle-color": "#888", "circle-radius": 3 } });
  }

  // Layer 2: OUR assembled trails (one feature per trail object).
  // aoi=golden shows the merged suite output; otherwise the named AOI.
  const trailsUrl = AOI === "golden"
    ? `../data/golden.trails.geojson`
    : `../data/aoi/${AOI}.trails.geojson`;
  const trails = await maybeJSON(trailsUrl);
  // Geometry-based area membership + publish-preview clipping for the two area
  // toggles. Ray-casting every trail vertex against every park polygon is heavy
  // on a dense state (MA: ~110k vertices x ~100 parks), so: nothing runs on
  // load; a spatial grid cuts each point to a handful of candidate polygons;
  // per-vertex membership is computed ONCE (memoized) the first time either
  // toggle is used and shared by both. After that, toggling/panning is pure
  // array work — no per-pan recompute.
  let hasAreas = false;
  let computeInArea = () => {};
  let applyClip = () => {};
  if (trails) {
    const polys = [];
    for (const af of (areas ? areas.features : [])) {
      const gt = af.geometry && af.geometry.type, c = af.geometry && af.geometry.coordinates;
      if (gt === "Polygon") polys.push(c);
      else if (gt === "MultiPolygon") for (const p of c) polys.push(p);
    }
    hasAreas = polys.length > 0;
    const bb = polys.map((rings) => {
      let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
      for (const [x, y] of rings[0]) { if (x<x0)x0=x; if (x>x1)x1=x; if (y<y0)y0=y; if (y>y1)y1=y; }
      return [x0, y0, x1, y1];
    });
    // Global park bbox — a cheap trail-level reject before touching any vertex.
    let gx0=Infinity, gy0=Infinity, gx1=-Infinity, gy1=-Infinity;
    for (const [x0,y0,x1,y1] of bb) { if(x0<gx0)gx0=x0; if(y0<gy0)gy0=y0; if(x1>gx1)gx1=x1; if(y1>gy1)gy1=y1; }

    // Uniform spatial grid over the park bboxes. Each point tests only the few
    // polygons whose bbox lands in its cell, not all N — the difference between
    // O(points x polygons) (unusable on a dense state like MA: ~1,260 trails,
    // ~110k vertices, ~100 parks) and ~O(points).
    const GN = Math.max(1, Math.min(128, Math.round(Math.sqrt(polys.length || 1)) * 8));
    const gdx = (gx1 - gx0) / GN || 1, gdy = (gy1 - gy0) / GN || 1;
    const clampX = (c) => c < 0 ? 0 : c > GN - 1 ? GN - 1 : c;
    const grid = new Map();
    for (let i = 0; i < polys.length; i++) {
      const [x0,y0,x1,y1] = bb[i];
      const cx0=clampX(Math.floor((x0-gx0)/gdx)), cx1=clampX(Math.floor((x1-gx0)/gdx));
      const cy0=clampX(Math.floor((y0-gy0)/gdy)), cy1=clampX(Math.floor((y1-gy0)/gdy));
      for (let cy=cy0; cy<=cy1; cy++) for (let cx=cx0; cx<=cx1; cx++) {
        const k = cy*GN+cx; let a = grid.get(k); if (!a) grid.set(k, a=[]); a.push(i);
      }
    }
    const cellOf = (x, y) =>
      clampX(Math.floor((y-gy0)/gdy)) * GN + clampX(Math.floor((x-gx0)/gdx));

    const inRing = (x, y, ring) => {
      let inside = false;
      for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
        const [xi, yi] = ring[i], [xj, yj] = ring[j];
        if (((yi > y) !== (yj > y)) && (x < (xj - xi) * (y - yi) / (yj - yi) + xi)) inside = !inside;
      }
      return inside;
    };
    const inPoly = (x, y, rings) => {
      if (!inRing(x, y, rings[0])) return false;
      for (let k = 1; k < rings.length; k++) if (inRing(x, y, rings[k])) return false;
      return true;
    };
    const ptInAnyArea = (x, y) => {
      if (x < gx0 || x > gx1 || y < gy0 || y > gy1) return false;
      const cand = grid.get(cellOf(x, y));
      if (!cand) return false;
      for (let n = 0; n < cand.length; n++) {
        const i = cand[n], [x0, y0, x1, y1] = bb[i];
        if (x < x0 || x > x1 || y < y0 || y > y1) continue;
        if (inPoly(x, y, polys[i])) return true;
      }
      return false;
    };
    const partsOf = (g) => g.type === "MultiLineString" ? g.coordinates
                         : (g.type === "LineString" ? [g.coordinates] : []);

    // Per-vertex membership, computed ONCE (memoized) and shared by BOTH area
    // toggles: the in-area filter reads "any vertex inside", the clip reads the
    // first/last inside vertex to trim. So the point-in-polygon pass happens a
    // single time — after it, toggling and panning are pure array work.
    let membership = null;             // membership[i] = Array<Uint8Array> per part
    const ensureMembership = () => {
      if (membership) return;
      const cv = map.getCanvas(); const prev = cv.style.cursor; cv.style.cursor = "progress";
      membership = trails.features.map((f) => {
        if (!hasAreas) return null;
        return partsOf(f.geometry).map((line) => {
          const bits = new Uint8Array(line.length);
          for (let i = 0; i < line.length; i++)
            if (ptInAnyArea(line[i][0], line[i][1])) bits[i] = 1;
          return bits;
        });
      });
      cv.style.cursor = prev;
    };

    // Stamp `_inarea` (touch, like the publisher) onto every feature from the
    // cached membership, so the "Only trails in an area" layer filter can read
    // it. Cheap array work once membership exists.
    const setInarea = () => {
      trails.features.forEach((tf, i) => {
        tf.properties = tf.properties || {};
        if (!hasAreas) { tf.properties._inarea = !!tf.properties.area; return; }
        let hit = false;
        for (const bits of membership[i]) { for (let k = 0; k < bits.length; k++) if (bits[k]) { hit = true; break; } if (hit) break; }
        tf.properties._inarea = hit;
      });
    };

    // Single source-of-truth for the trails geometry fed to the map. Clip
    // trims each line to its first..last in-park vertex (drops dangling
    // out-of-park tails, keeps in->gap->in connectors, matching the publisher's
    // _trim_to_parks). Both toggles route through here so they COMPOSE: turning
    // one on never clobbers the other's effect. Reads cached membership, so it
    // runs once for the whole state — no per-pan recompute, no viewport cap.
    let clipOn = false;
    const buildData = () => {
      if (!(clipOn && hasAreas)) return trails;
      // Keep the array 1:1 with trails.features (a fully-out-of-park trail
      // becomes an empty line, drawn as nothing) so generateId indices stay
      // aligned with the trail picker's `feats[id]` lookups.
      const feats = trails.features.map((f, i) => {
        const lines = partsOf(f.geometry), parts = membership[i], out = [];
        for (let pi = 0; pi < lines.length; pi++) {
          const bits = parts[pi];
          let first = -1, last = -1;
          for (let k = 0; k < bits.length; k++) if (bits[k]) { if (first < 0) first = k; last = k; }
          if (first >= 0 && last > first) out.push(lines[pi].slice(first, last + 1));
        }
        return { ...f, geometry: { type: "MultiLineString", coordinates: out } };
      });
      return { type: "FeatureCollection", features: feats };
    };
    const refresh = () => {
      if ((clipOn) && hasAreas) ensureMembership();
      const src = map.getSource("trails");
      if (src) src.setData(buildData());
    };

    // "Only trails in an area": ensure membership + stamp _inarea, then refresh
    // (keeping any active clip). The layer filter itself is set by the handler.
    computeInArea = () => { ensureMembership(); setInarea(); refresh(); };
    // "Clip to park boundaries": flip clip state and rebuild geometry.
    applyClip = (on) => { if (on !== undefined) clipOn = on; refresh(); };
  }
  if (trails) {
    // generateId gives each trail feature an id so a click can flip its
    // feature-state — and since one trail = one MultiLineString feature,
    // that lights up the WHOLE assembled trail at once.
    map.addSource("trails", { type: "geojson", data: trails, generateId: true });
    // selected feature-state flips a line to cyan + thicker.
    const selPaint = (base, w = 3) => ({
      "line-color": ["case", ["boolean", ["feature-state", "selected"], false],
                     "#00b7ff", base],
      "line-width": ["case", ["boolean", ["feature-state", "selected"], false], 6, w],
    });
    // Base filter per kind. The "Only trails in an area" toggle ANDs an
    // area-membership clause onto these (SPEC §6b — arealess backcountry).
    const KIND_FILTER = {
      "trail-lines": ["all", ["!=", ["get", "kind"], "route"], ["!=", ["get", "kind"], "hike"]],
      "route-lines": ["==", ["get", "kind"], "route"],
      "hike-lines": ["==", ["get", "kind"], "hike"],
    };
    // Named physical trails (kind == trail) — solid orange. Unknown/missing
    // kind falls here too (safe default).
    map.addLayer({ id: "trail-lines", source: "trails", type: "line",
      filter: KIND_FILTER["trail-lines"],
      layout: { "line-cap": "round", "line-join": "round" },
      paint: selPaint("#e6521f") });
    // Routes that traverse named trails (kind == route) — dashed purple, so a
    // park view can uncheck them and see just the named-trail set (SPEC §6b).
    map.addLayer({ id: "route-lines", source: "trails", type: "line",
      filter: KIND_FILTER["route-lines"],
      layout: { "line-cap": "round", "line-join": "round" },
      paint: { ...selPaint("#8b3fd6"), "line-dasharray": [2, 1.5] } });
    // Canonical hikes (kind == hike) — solid green, thicker, drawn on top:
    // the marquee "complete this" objects harvested from OSM routes (SPEC §6c).
    map.addLayer({ id: "hike-lines", source: "trails", type: "line",
      filter: KIND_FILTER["hike-lines"],
      layout: { "line-cap": "round", "line-join": "round" },
      paint: selPaint("#17913a", 4.5) });
    // "Only trails in an area": lazily derive _inarea (first use), then AND an
    // area-membership clause onto each kind's filter.
    document.getElementById("toggle-inarea").onchange = (e) => {
      if (e.target.checked) computeInArea();
      for (const [lid, base] of Object.entries(KIND_FILTER)) {
        if (!map.getLayer(lid)) continue;
        map.setFilter(lid, e.target.checked
          ? ["all", base, ["to-boolean", ["get", "_inarea"]]] : base);
      }
    };
    // "Clip to park boundaries": viewport-scoped publish-preview (trims only
    // on-screen trails; re-runs on pan). Disabled if no area polygons loaded.
    const clipEl = document.getElementById("toggle-clip");
    if (!hasAreas) clipEl.disabled = true;
    clipEl.onchange = (e) => applyClip(e.target.checked);

    const HIT = ["hike-lines", "trail-lines", "route-lines"];
    let selectedId = null;
    const clearSel = () => {
      if (selectedId !== null) {
        map.setFeatureState({ source: "trails", id: selectedId }, { selected: false });
        selectedId = null;
      }
    };
    map.on("mouseenter", HIT, () => map.getCanvas().style.cursor = "pointer");
    map.on("mouseleave", HIT, () => map.getCanvas().style.cursor = "");

    map.on("click", HIT, (e) => {
      clearSel();
      const f = e.features[0];
      selectedId = f.id;
      map.setFeatureState({ source: "trails", id: selectedId }, { selected: true });
      const p = f.properties;
      new maplibregl.Popup().setLngLat(e.lngLat)
        .setHTML(`<b>${p.name || "(unnamed)"}</b><br>` +
                 Object.entries(p).map(([k, v]) => `${k}: ${v}`).join("<br>"))
        .addTo(map);
    });
    // click empty space (off any trail/route) to clear the highlight
    map.on("click", (e) => {
      if (!map.queryRenderedFeatures(e.point, { layers: HIT }).length) clearSel();
    });

    // --- trail picker: list what's in view, search across all, click to frame ---
    // id === feature index (maplibre generateId), so we can look up full geometry.
    const feats = trails.features;
    const listEl = document.getElementById("inview-list");
    const countEl = document.getElementById("inview-count");
    const searchEl = document.getElementById("trail-search");

    // frame + highlight the whole trail on pick.
    const pick = (id) => {
      clearSel();
      selectedId = id;
      map.setFeatureState({ source: "trails", id }, { selected: true });
      const b = extendBounds(new maplibregl.LngLatBounds(), feats[id]);
      if (!b.isEmpty()) map.fitBounds(b, { padding: 60, maxZoom: 15, duration: 600 });
    };

    const renderList = () => {
      const q = (searchEl.value || "").trim().toLowerCase();
      let items;
      if (q) {                                   // search ALL trails in the AOI
        items = feats.map((f, i) => [i, f.properties])
                     .filter(([, p]) => (p.name || "").toLowerCase().includes(q));
      } else {                                   // just what's rendered in the viewport
        const seen = new Set();
        for (const f of map.queryRenderedFeatures({ layers: HIT }))
          if (f.id != null) seen.add(f.id);
        items = [...seen].map((i) => [i, feats[i].properties]);
      }
      items.sort((a, b) => (a[1].name || "~").localeCompare(b[1].name || "~"));
      countEl.textContent = q ? `(${items.length} matches)` : `(${items.length} in view)`;
      listEl.innerHTML = "";
      for (const [i, p] of items) {
        const li = document.createElement("li");
        const color = p.kind === "hike" ? "#17913a"
                    : p.kind === "route" ? "#8b3fd6" : "#e6521f";
        li.innerHTML = `<span class="swatch" style="background:${color}"></span>` +
          `${p.name || "(unnamed)"} <span class="mi">${(p.length_mi || 0).toFixed(1)}mi</span>`;
        li.onclick = () => pick(i);
        listEl.appendChild(li);
      }
    };

    // frame the whole AOI on load (so trails aren't off-screen), then list.
    if (AOI !== "golden") {
      const all = feats.reduce((b, f) => extendBounds(b, f), new maplibregl.LngLatBounds());
      if (!all.isEmpty()) map.fitBounds(all, { padding: 30, duration: 0 });
    }
    map.on("moveend", () => { if (!searchEl.value.trim()) renderList(); });
    searchEl.addEventListener("input", renderList);
    renderList();
  }

  // Layer 2b: trails curation REMOVED — the show/hide "why did it drop?"
  // layer. Off by default; dashed dark-red; click shows a plain-language
  // removed_reason. Sidecar file written next to the trails output.
  const removedUrl = AOI === "golden"
    ? `../data/golden.removed.geojson`
    : `../data/aoi/${AOI}.removed.geojson`;
  const removed = await maybeJSON(removedUrl);
  // Thru-routes the PUBLISHER dropped (they span parks with no majority home)
  // live in a sidecar the assembler doesn't write. Merge them into the same
  // removed layer so this panel covers curation removals AND dropped
  // thru-hikes — both carry a plain-language removed_reason.
  const droppedRoutes = AOI === "golden"
    ? null : await maybeJSON(`../data/aoi/${AOI}.dropped-routes.geojson`);
  const removedFeatures = [
    ...((removed && removed.features) || []),
    ...((droppedRoutes && droppedRoutes.features) || []),
  ];
  if (removedFeatures.length) {
    const removedData = { type: "FeatureCollection", features: removedFeatures };
    map.addSource("removed", { type: "geojson", data: removedData, generateId: true });

    // A distinct colour per curation reason so a whole CLASS reads at a glance
    // — you judge "motorized (412): trust" once instead of eyeballing each line.
    const CAT_COLORS = {
      "thru-hike": "#8b3fd6", "route-traverse": "#5e35b1", "motorized": "#d81b60",
      "utility": "#00897b", "road-code": "#6d4c41", "off-trail": "#546e7a",
      "grid-address": "#8d6e63", "generic": "#f9a825", "short-name": "#9e9e9e",
      "min-length": "#c0ca33", "closed": "#e53935",
      "access": "#1565c0", "non-trail-feature": "#4527a0",
    };
    const catColor = (c) => CAT_COLORS[c] || "#b3261e";
    const colorExpr = ["match", ["get", "removed_category"]];
    for (const [k, v] of Object.entries(CAT_COLORS)) colorExpr.push(k, v);
    colorExpr.push("#b3261e");                      // fallback for any unknown slug

    map.addLayer({ id: "removed-lines", source: "removed", type: "line",
      layout: { "line-cap": "round", "line-join": "round", visibility: "none" },
      paint: { "line-color": colorExpr, "line-width": 2, "line-opacity": 0.9,
               "line-dasharray": [1.5, 1.5] } });

    // Review-band state: which reason buckets are shown, and (diff mode) whether
    // to scope the layer to only what changed since the last assemble.
    const counts = {};
    for (const f of removedFeatures) {
      const c = (f.properties && f.properties.removed_category) || "removed";
      counts[c] = (counts[c] || 0) + 1;
    }
    const enabledCats = new Set(Object.keys(counts));   // all reasons on by default
    let diffOn = false;
    const diffRemovedKeys = new Set();
    const applyRemovedFilter = () => {
      if (!map.getLayer("removed-lines")) return;
      map.setFilter("removed-lines", diffOn
        ? ["in", ["get", "ckey"], ["literal", [...diffRemovedKeys]]]
        : ["in", ["get", "removed_category"], ["literal", [...enabledCats]]]);
    };

    const rc = document.getElementById("removed-count");
    if (rc) rc.textContent = `(${removedFeatures.length})`;

    // One checkbox per reason bucket — the review unit.
    const catBox = document.getElementById("removed-cats");
    if (catBox) {
      for (const c of Object.keys(counts).sort((a, b) => counts[b] - counts[a])) {
        const lab = document.createElement("label");
        lab.innerHTML = `<input type="checkbox" checked />` +
          `<span class="swatch" style="background:${catColor(c)}"></span>` +
          `${c} <span class="mi">(${counts[c]})</span>`;
        catBox.appendChild(lab);
        lab.querySelector("input").onchange = (e) => {
          if (e.target.checked) enabledCats.add(c); else enabledCats.delete(c);
          applyRemovedFilter();
        };
      }
    }
    // Parent toggle shows/hides the whole removed layer.
    const parentBox = document.getElementById("toggle-removed");
    if (parentBox) parentBox.onchange = (e) =>
      map.setLayoutProperty("removed-lines", "visibility",
        e.target.checked ? "visible" : "none");

    map.on("mouseenter", "removed-lines", () => map.getCanvas().style.cursor = "pointer");
    map.on("mouseleave", "removed-lines", () => map.getCanvas().style.cursor = "");
    map.on("click", "removed-lines", (e) => {
      const p = e.features[0].properties;
      const reason = p.removed_reason || "(no reason recorded)";
      const bits = [];
      if (p.length_mi != null) bits.push(`${(+p.length_mi).toFixed(2)} mi`);
      if (p.source) bits.push(`source: ${p.source}`);
      if (p.network) bits.push(`network: ${p.network}`);
      if (p.operator) bits.push(`operator: ${p.operator}`);
      new maplibregl.Popup({ maxWidth: "300px" }).setLngLat(e.lngLat)
        .setHTML(
          `<b>${p.name || "(unnamed)"}</b>` +
          `<div style="color:${catColor(p.removed_category)};font-weight:600;margin:4px 0">` +
          `✕ Removed · ${p.removed_category || "?"}</div>` +
          `<div style="margin-bottom:4px">${reason}</div>` +
          `<div style="color:#888;font-size:11px">${bits.join(" · ")}</div>`)
        .addTo(map);
    });

    // --- Diff: only what CHANGED since the last assemble of this AOI. On a
    // re-run (tweak a rule, re-assemble) you review the handful of deltas, not
    // the whole area again. Newly-removed scope the removed layer; newly-KEPT
    // get a bright highlight on the trails layer.
    const diff = AOI === "golden" ? null
               : await maybeJSON(`../data/aoi/${AOI}.curation-diff.json`);
    const diffKeptKeys = new Set();
    if (diff && diff.has_baseline) {
      for (const e of diff.new_removed || []) diffRemovedKeys.add(e.ckey);
      for (const e of diff.reason_changed || []) diffRemovedKeys.add(e.ckey);
      for (const e of diff.new_kept || []) diffKeptKeys.add(e.ckey);
    }
    const dc = document.getElementById("diff-count");
    if (dc) dc.textContent = (diff && diff.has_baseline)
      ? `(${diffRemovedKeys.size + diffKeptKeys.size})` : "(no baseline)";
    if (map.getSource("trails")) {
      map.addLayer({ id: "diff-kept", source: "trails", type: "line",
        layout: { "line-cap": "round", "line-join": "round", visibility: "none" },
        filter: ["in", ["get", "ckey"], ["literal", [...diffKeptKeys]]],
        paint: { "line-color": "#ffd400", "line-width": 5, "line-opacity": 0.95 } });
    }
    const diffBox = document.getElementById("toggle-diff");
    if (diffBox) diffBox.onchange = (e) => {
      diffOn = e.target.checked;
      if (diffOn && parentBox) {                     // reveal changed removals
        parentBox.checked = true;
        map.setLayoutProperty("removed-lines", "visibility", "visible");
      }
      applyRemovedFilter();
      if (map.getLayer("diff-kept"))
        map.setLayoutProperty("diff-kept", "visibility", diffOn ? "visible" : "none");
    };
  }

  // Layer 2c: NAMED ways a TAG gate dropped BEFORE assembly (foot=no, ski
  // piste, road-like track, motor vehicle). Off by default; dotted; click for
  // the tag reason. Surfaces the "named trail silently eaten by a tag rule"
  // false-negative — otherwise these just vanish with no trace.
  const ingest = AOI === "golden" ? null
               : await maybeJSON(`../data/aoi/${AOI}.ingest-dropped.geojson`);
  if (ingest && ingest.features && ingest.features.length) {
    map.addSource("ingest", { type: "geojson", data: ingest, generateId: true });
    // 'road-track-name' (a track dropped only because its NAME looks road-like)
    // is the fuzzy, false-negative-risk bucket — deep orange to stand out. The
    // rest are unambiguous tag drops.
    const ICOL = { "sidewalk": "#8e8e8e", "indoor/trail=no": "#8e8e8e",
      "road-track-tag": "#6d4c41", "road-track-name": "#e65100",
      "motorized-tag": "#d81b60", "non-hiking-tag": "#00838f" };
    const iexpr = ["match", ["get", "removed_category"]];
    for (const [k, v] of Object.entries(ICOL)) iexpr.push(k, v);
    iexpr.push("#00695c");
    map.addLayer({ id: "ingest-lines", source: "ingest", type: "line",
      layout: { "line-cap": "round", "line-join": "round", visibility: "none" },
      paint: { "line-color": iexpr, "line-width": 2.2, "line-opacity": 0.9,
               "line-dasharray": [0.5, 2] } });
    const ic = document.getElementById("ingest-count");
    if (ic) ic.textContent = `(${ingest.features.length})`;

    // Per-category buckets, same as Removed — so you can show JUST
    // 'road-track-name' (the handful worth checking) and hide the noise.
    const iCounts = {};
    for (const f of ingest.features) {
      const c = (f.properties && f.properties.removed_category) || "?";
      iCounts[c] = (iCounts[c] || 0) + 1;
    }
    const iEnabled = new Set(Object.keys(iCounts));
    const applyIngestFilter = () => map.getLayer("ingest-lines") &&
      map.setFilter("ingest-lines",
        ["in", ["get", "removed_category"], ["literal", [...iEnabled]]]);
    const iBox = document.getElementById("ingest-cats");
    if (iBox) {
      for (const c of Object.keys(iCounts).sort((a, b) => iCounts[b] - iCounts[a])) {
        const lab = document.createElement("label");
        lab.innerHTML = `<input type="checkbox" checked />` +
          `<span class="swatch" style="background:${ICOL[c] || "#00695c"}"></span>` +
          `${c} <span class="mi">(${iCounts[c]})</span>`;
        iBox.appendChild(lab);
        lab.querySelector("input").onchange = (e) => {
          if (e.target.checked) iEnabled.add(c); else iEnabled.delete(c);
          applyIngestFilter();
        };
      }
    }
    map.on("mouseenter", "ingest-lines", () => map.getCanvas().style.cursor = "pointer");
    map.on("mouseleave", "ingest-lines", () => map.getCanvas().style.cursor = "");
    map.on("click", "ingest-lines", (e) => {
      const p = e.features[0].properties;
      new maplibregl.Popup({ maxWidth: "300px" }).setLngLat(e.lngLat)
        .setHTML(
          `<b>${p.name || "(unnamed)"}</b>` +
          `<div style="color:#00695c;font-weight:600;margin:4px 0">` +
          `⊘ Filtered at ingest · ${p.removed_category || "?"}</div>` +
          `<div style="margin-bottom:4px">${p.removed_reason || ""}</div>` +
          `<div style="color:#888;font-size:11px">highway=${p.highway || "?"}</div>`)
        .addTo(map);
    });
  }

  // Layer 3: golden destinations, colored PASS/FAIL when results exist.
  const golden = await maybeJSON(`../golden/golden.snapped.json`)
              || await maybeJSON(`../golden/golden.json`);
  const resDoc = await maybeJSON(`../data/golden.results.json`);
  const byId = {};
  if (resDoc) for (const r of resDoc.results) byId[r.id] = r;
  if (golden) {
    const feats = [];
    const list = document.getElementById("golden-list");
    if (resDoc) {
      const pass = resDoc.results.filter((r) => r.passed).length;
      const sum = document.getElementById("golden-summary");
      sum.textContent = `${pass}/${resDoc.results.length} passing`;
      sum.style.color = pass === resDoc.results.length ? "#1a7f37" : "#b3261e";
    }
    for (const t of golden.trails) {
      const pts = t.kind === "destination" ? [t.destination] : t.endpoints;
      const r = byId[t.id];
      const passed = r ? r.passed : null;
      for (const c of pts) {
        feats.push({ type: "Feature",
          properties: { id: t.id, name: t.name, why: t.why,
                        pass: passed === null ? "—" : passed ? "PASS" : "FAIL",
                        diagnosis: r ? (r.diagnosis || "") : "",
                        detail: r ? (r.reasons || []).join("; ") || `reach ${r.reach_ft}ft` : "" },
          geometry: { type: "Point", coordinates: [c.lon, c.lat] } });
      }
      const li = document.createElement("li");
      const badge = passed === null ? "" : passed ? "✅ " : "❌ ";
      li.textContent = `${badge}${t.name} (${t.country})`;
      if (r && !r.passed) li.title = (r.reasons || []).join("; ");
      const c0 = pts[0];
      li.onclick = () => map.flyTo({ center: [c0.lon, c0.lat], zoom: 14 });
      list.appendChild(li);
    }
    map.addSource("golden", { type: "geojson",
      data: { type: "FeatureCollection", features: feats } });
    map.addLayer({ id: "golden-pts", source: "golden", type: "circle",
      paint: {
        "circle-color": ["match", ["get", "pass"],
          "PASS", "#1a7f37", "FAIL", "#b3261e", /* other */ "#888"],
        "circle-radius": 7,
        "circle-stroke-color": "#fff", "circle-stroke-width": 2 } });
    map.on("click", "golden-pts", (e) => {
      const p = e.features[0].properties;
      const diag = p.diagnosis ? `<br><i>${p.diagnosis}</i>` : "";
      new maplibregl.Popup().setLngLat(e.lngLat)
        .setHTML(`<b>${p.name}</b> — ${p.pass}${diag}<br>${p.detail || p.why}`).addTo(map);
    });
  }

  const wire = (box, ids) => document.getElementById(box).onchange = (e) =>
    ids.forEach((id) => map.getLayer(id) &&
      map.setLayoutProperty(id, "visibility", e.target.checked ? "visible" : "none"));
  wire("toggle-raw", ["raw-lines", "raw-pois"]);
  wire("toggle-areas", ["area-fill", "area-line"]);
  wire("toggle-hikes", ["hike-lines"]);
  wire("toggle-trails", ["trail-lines"]);
  wire("toggle-routes", ["route-lines"]);
  // toggle-removed + toggle-diff are wired inside the removed block (they drive
  // per-category filters, not just visibility).
  wire("toggle-ingest", ["ingest-lines"]);
  wire("toggle-golden", ["golden-pts"]);
});
</script>
</body>
</html>
