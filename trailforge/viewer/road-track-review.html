<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Trailforge — road-track-name drops (false-negative review)</title>
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
<style>
  :root { --bg:#1b1d21; --panel:#23262b; --line:#333; --txt:#e8e8e8; --dim:#9aa0a6; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; font:13px/1.4 system-ui,sans-serif; color:var(--txt); }
  #app { display:flex; height:100%; }
  #side { width:340px; flex:none; background:var(--panel); border-right:1px solid var(--line); display:flex; flex-direction:column; }
  #map { flex:1; }
  header { padding:10px 12px; border-bottom:1px solid var(--line); }
  header h1 { margin:0 0 6px; font-size:14px; }
  header .sub { color:var(--dim); font-size:12px; }
  .controls { padding:8px 12px; border-bottom:1px solid var(--line); display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
  .controls input, .controls label { font:12px system-ui; }
  .controls input[type=text] { background:var(--bg); color:var(--txt); border:1px solid var(--line); border-radius:5px; padding:4px 6px; }
  #list { overflow-y:auto; flex:1; }
  .item { padding:8px 12px; border-bottom:1px solid var(--line); cursor:pointer; }
  .item:hover { background:#2c3036; }
  .item.active { background:#2f3742; box-shadow:inset 3px 0 0 #e65100; }
  .item .nm { font-weight:600; }
  .item .meta { color:var(--dim); font-size:11.5px; margin-top:2px; }
  .tag { display:inline-block; padding:0 5px; border-radius:3px; font-size:10.5px; margin:2px 3px 0 0; background:#3a3f45; }
  .tag.hot { background:#264; color:#dfd; }
  .empty { padding:16px 12px; color:var(--dim); }
  .empty code { color:#e8e8e8; background:#000; padding:1px 4px; border-radius:3px; }
  .maplibregl-popup-content { color:#111; font:12px system-ui; }
  .maplibregl-popup-content a { color:#0645ad; }
</style>
</head>
<body>
<div id="app">
  <div id="side">
    <header>
      <h1>Road-track-name drops</h1>
      <div class="sub" id="count">loading…</div>
    </header>
    <div class="controls">
      <label><input type="checkbox" id="hotonly" /> likely-trail only</label>
      <input type="text" id="q" placeholder="filter name…" size="12" />
    </div>
    <div id="list"></div>
  </div>
  <div id="map"></div>
</div>
<script>
const map = new maplibregl.Map({
  container:"map",
  style:{ version:8, sources:{ osm:{ type:"raster", tileSize:256,
      tiles:["https://tile.openstreetmap.org/{z}/{x}/{y}.png"],
      attribution:"© OpenStreetMap contributors" } },
    layers:[{ id:"osm", type:"raster", source:"osm" }] },
  center:[-98,39], zoom:3.4,
});
map.addControl(new maplibregl.NavigationControl());

// A drop is a "likely trail" (rescue candidate) if OSM already carries a
// pedestrian signal that contradicts "this is a road": foot=yes/designated,
// any sac_scale (a hiking-difficulty rating), or an unpaved/soft surface.
function isHot(p) {
  if (["yes","designated"].includes((p.foot||"").toLowerCase())) return true;
  if ((p.sac_scale||"").trim()) return true;
  if (/(ground|dirt|earth|grass|unpaved|fine_gravel)/i.test(p.surface||"")) return true;
  return false;
}

function bounds(coords){ const b=new maplibregl.LngLatBounds(); coords.forEach(c=>b.extend(c)); return b; }
let FEATS=[], BYID=new Map();

function focus(f, el){
  document.querySelectorAll(".item").forEach(x=>x.classList.remove("active"));
  if (el) el.classList.add("active");
  map.fitBounds(bounds(f.geometry.coordinates), {padding:80, maxZoom:15, duration:500});
}

function render(){
  const hot = document.getElementById("hotonly").checked;
  const q = document.getElementById("q").value.toLowerCase();
  const list = document.getElementById("list"); list.innerHTML="";
  let shown=0;
  for (const f of FEATS){
    const p=f.properties;
    if (hot && !isHot(p)) continue;
    if (q && !(p.name||"").toLowerCase().includes(q)) continue;
    shown++;
    const el=document.createElement("div"); el.className="item";
    const tags=[];
    if (p.foot) tags.push(`<span class="tag ${["yes","designated"].includes(p.foot)?"hot":""}">foot=${p.foot}</span>`);
    if (p.sac_scale) tags.push(`<span class="tag hot">${p.sac_scale}</span>`);
    if (p.surface) tags.push(`<span class="tag ${/(ground|dirt|earth|grass|unpaved|fine_gravel)/i.test(p.surface)?"hot":""}">${p.surface}</span>`);
    if (p.tracktype) tags.push(`<span class="tag">${p.tracktype}</span>`);
    el.innerHTML=`<div class="nm">${p.name||"(unnamed)"}${isHot(p)?' <span class="tag hot">rescue?</span>':''}</div>`
      +`<div class="meta">${tags.join("")||"no extra tags"}</div>`;
    el.onclick=()=>focus(f, el);
    list.appendChild(el);
  }
  document.getElementById("count").textContent=`${shown} shown / ${FEATS.length} drops`;
}

(async () => {
  await new Promise(res=>map.on("load",res));
  let fc=null;
  try { const r=await fetch("road-track-drops.geojson"); if (r.ok) fc=await r.json(); } catch(e){}
  if (!fc || !fc.features || !fc.features.length){
    document.getElementById("count").textContent="no data";
    document.getElementById("list").innerHTML =
      `<div class="empty">No <code>road-track-drops.geojson</code> yet. On the homelab (after <code>make prefilter</code>):<br><br>`
      +`<code>python3 trailforge/viewer/scan-road-track-drops.py</code><br><br>then reload.</div>`;
    return;
  }
  FEATS = fc.features.sort((a,b)=> (isHot(b.properties)-isHot(a.properties))
        || (a.properties.name||"").localeCompare(b.properties.name||""));
  FEATS.forEach(f=>BYID.set(f.properties.osm_way, f));
  map.addSource("drops",{type:"geojson", data:fc, generateId:true});
  map.addLayer({ id:"drops-line", type:"line", source:"drops",
    layout:{ "line-cap":"round","line-join":"round" },
    paint:{ "line-color":["case", ["boolean",["feature-state","hot"],false], "#39d353", "#e65100"],
            "line-width":3, "line-opacity":0.9 }});
  // colour rescue-candidates green via feature-state
  fc.features.forEach((f,i)=>{ if (isHot(f.properties)) map.setFeatureState({source:"drops",id:i},{hot:true}); });
  map.on("click","drops-line",(e)=>{
    const p=e.features[0].properties;
    const osm=`https://www.openstreetmap.org/way/${p.osm_way}`;
    new maplibregl.Popup().setLngLat(e.lngLat).setHTML(
      `<b>${p.name||"(unnamed)"}</b><br>`
      +`highway=track · ${p.surface||"surface?"}${p.foot?` · foot=${p.foot}`:""}${p.sac_scale?` · ${p.sac_scale}`:""}<br>`
      +`<a href="${osm}" target="_blank">inspect / fix on OSM →</a>`).addTo(map);
  });
  map.on("mouseenter","drops-line",()=>map.getCanvas().style.cursor="pointer");
  map.on("mouseleave","drops-line",()=>map.getCanvas().style.cursor="");
  ["hotonly","q"].forEach(id=>document.getElementById(id).addEventListener("input",render));
  render();
})();
</script>
</body>
</html>
